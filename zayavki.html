<!--
  Salateira · Заявки на расходники (zayavki.html)
  Версия 1.6

  1.6 — корректировка утверждённой заявки (количество/комментарий, номера накладных
        сохраняются); пометка «больше обычного» у Тани; «Как в прошлый раз» в новой
        заявке. Нужен Code.gs ≥ 1.4.0.
  1.5 — «Просмотреть» у накладных: предпросмотр листов A4 прямо на странице,
        оттуда — печать или «Сохранить как PDF».
  1.4 — подключение Telegram со страницы убрано: ID вносит администратор в таблицу.
  1.3 — Telegram: кнопка «Подключить Telegram» в шапке (ссылка на бота с одноразовым
        кодом → «Проверить»), отключение. Нужен Code.gs ≥ 1.3.0.
  1.2 — накладная: подписи «Сдал» / «Принял» (без «Администратор» — отпускает
        и офис); таблица без пустых строк — ровно столько строк, сколько позиций.
  1.1 — фиолетовая палитра (#7002FF); «Взять в работу» продублирована вверху
        заявки; поиск позиции по первым буквам в перемещениях и при добавлении
        позиции закупками; вкладка «Справочник» — закупки добавляют и правят
        позиции прямо со страницы (нужен Code.gs ≥ 1.2.0); тексты по правкам.
  1.0 — первая версия. Вход по логину/паролю (учётки в Google Таблице).
        Ресторан: новая заявка по категориям с кратностью и прошлым заказом,
        мои заявки с «было → стало» и комментариями закупок, отзыв заявки,
        «Собрать» (что отдать другим), перемещение в другой ресторан, накладные.
        Закупки: входящие заявки, «Взять в работу», правка количеств/источника/
        комментариев, возврат, утверждение (накладные создаются сами), свод по
        позициям на дату, сообщение водителю, отметка «отгружено».
        Водитель: маршрут на дату. Экономист: перемещения за период, свод по
        ресторанам, выгрузка в Excel, печать накладных пачкой.
        Бэкенд: Code.gs ≥ 1.1.0.
-->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salateira · Заявки на расходники</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237002FF'/%3E%3Ctext x='32' y='45' font-family='Arial, Helvetica, sans-serif' font-weight='800' font-size='38' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --accent:#7002FF; --accent-dark:#5300C2; --accent-soft:#F2EAFF; --accent-line:#D9C6FF;
    --ink:#1A1433; --muted:#6B6582; --line:#E3DEF0; --bg:#F7F5FC; --hover:#FAF8FE;
    --ok:#0F8F62; --ok-soft:#E5F5EE;
    --red:#D6304A; --red-soft:#FCEBEE; --amber:#A8650B; --amber-soft:#FDF2E1;
    --blue:#3B4FD8; --blue-soft:#ECEFFE; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:'Manrope', system-ui, sans-serif; background:var(--bg); color:var(--ink); line-height:1.45; -webkit-font-smoothing:antialiased; }
  .app{ max-width:1220px; margin:0 auto; padding:24px 24px 80px; }
  @media (max-width:600px){ .app{ padding:16px 16px 60px; } }

  header.top{ display:flex; align-items:center; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  .logo-mark{ height:24px; width:auto; display:block; flex:0 0 auto; }
  header.top h1{ font-size:1.25rem; font-weight:800; margin:0; letter-spacing:-0.01em; }
  header.top .sub{ font-size:0.83rem; color:var(--muted); margin-top:2px; }
  .sync{ margin-left:auto; font-size:0.78rem; color:var(--muted); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .version-tag{ font-size:0.7rem; color:var(--accent-dark); background:var(--accent-soft); border-radius:999px; padding:3px 9px; }

  .tabs{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .tab-btn{ font-family:inherit; font-size:0.86rem; font-weight:600; padding:9px 16px; border-radius:999px; border:1.5px solid var(--line); background:#fff; color:var(--muted); cursor:pointer; }
  .tab-btn.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .tab-btn:not(.active):hover{ border-color:var(--accent); color:var(--ink); }
  .tab-btn .cnt{ display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:999px; background:var(--red); color:#fff; font-size:0.7rem; line-height:18px; text-align:center; }

  .panel{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:20px; }
  .panel + .panel{ margin-top:16px; }
  h2.panel-title{ font-size:1rem; font-weight:700; margin:0 0 14px; }
  h3.sec{ font-size:0.8rem; font-weight:700; color:var(--accent-dark); margin:18px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line); text-transform:uppercase; letter-spacing:0.03em; }
  .muted{ color:var(--muted); }
  .small{ font-size:0.8rem; }
  .split{ display:grid; grid-template-columns:minmax(320px, 420px) 1fr; gap:18px; align-items:start; }
  @media (max-width:960px){ .split{ grid-template-columns:1fr; } }

  .btn{ font-family:inherit; font-size:0.86rem; font-weight:700; padding:9px 16px; border-radius:8px; border:1.5px solid transparent; cursor:pointer; white-space:nowrap; }
  .btn:disabled{ opacity:0.5; cursor:default; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover:not(:disabled){ background:var(--accent-dark); }
  .btn-secondary{ background:#fff; border-color:var(--line); color:var(--ink); }
  .btn-secondary:hover:not(:disabled){ border-color:var(--accent); }
  .btn-danger{ background:#fff; border-color:#F2C4CA; color:var(--red); }
  .btn-danger:hover:not(:disabled){ background:var(--red-soft); }
  .btn-sm{ padding:5px 10px; font-size:0.78rem; }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }

  .field{ display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
  .field label{ font-size:0.75rem; font-weight:700; color:var(--muted); }
  input[type=text], input[type=password], input[type=number], input[type=date], select, textarea{
    font-family:inherit; font-size:0.9rem; color:var(--ink); background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; outline:none; width:100%;
  }
  input:focus, select:focus, textarea:focus{ border-color:var(--accent); }
  textarea{ resize:vertical; min-height:60px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row > .field{ flex:1 1 160px; }

  .msg{ font-size:0.85rem; padding:10px 12px; border-radius:8px; margin:10px 0; white-space:pre-line; }
  .msg.err{ background:var(--red-soft); color:#9B1C2C; }
  .msg.ok{ background:var(--ok-soft); color:var(--ok); }
  .msg.warn{ background:var(--amber-soft); color:#7A4E0E; }
  .msg.info{ background:var(--blue-soft); color:#1E4E80; }

  table.t{ width:100%; border-collapse:collapse; font-size:0.86rem; }
  table.t th{ text-align:left; font-size:0.72rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; padding:8px 8px; border-bottom:1.5px solid var(--line); white-space:nowrap; }
  table.t td{ padding:7px 8px; border-bottom:1px solid #EFECF6; vertical-align:middle; }
  table.t tr.click{ cursor:pointer; }
  table.t tr.click:hover td{ background:var(--hover); }
  table.t tr.sel td{ background:var(--accent-soft); }
  table.t td.num, table.t th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  table.t tfoot td{ font-weight:800; border-top:1.5px solid var(--line); }
  .t-wrap{ overflow-x:auto; }

  .chip{ display:inline-block; font-size:0.72rem; font-weight:700; padding:2px 9px; border-radius:999px; white-space:nowrap; }
  .st-Черновик{ background:#EFECF6; color:var(--muted); }
  .st-Отправлена{ background:var(--accent-soft); color:var(--accent-dark); }
  .st-На-проверке{ background:var(--amber-soft); color:var(--amber); }
  .st-Возвращена{ background:var(--red-soft); color:var(--red); }
  .st-Утверждена{ background:var(--ok-soft); color:var(--ok); }
  .st-Отгружена{ background:#E9E6F1; color:#4A4560; }
  .chip.late{ background:var(--red-soft); color:var(--red); }

  .item-row{ display:grid; grid-template-columns:1fr 92px 150px; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid #EFECF6; }
  .item-row:last-child{ border-bottom:none; }
  .item-row .nm{ font-weight:600; font-size:0.9rem; }
  .item-row .meta{ font-size:0.74rem; color:var(--muted); }
  .item-row .prev{ font-size:0.78rem; color:var(--muted); text-align:right; }
  .item-row .note{ font-size:0.76rem; color:var(--red); }
  .qty{ display:flex; align-items:center; gap:4px; }
  .qty button{ width:30px; height:34px; border:1.5px solid var(--line); background:#fff; border-radius:8px; font-weight:800; font-size:1rem; color:var(--accent-dark); cursor:pointer; flex:0 0 auto; }
  .qty button:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .qty input{ text-align:center; padding:7px 4px; }
  .item-row.has-qty .nm{ color:var(--accent-dark); }
  @media (max-width:600px){ .item-row{ grid-template-columns:1fr 132px; } .item-row .prev{ grid-column:1; text-align:left; } }

  .free-row{ display:grid; grid-template-columns:1fr 80px 90px 34px; gap:8px; margin-bottom:6px; }
  .x-btn{ border:1.5px solid var(--line); background:#fff; border-radius:8px; cursor:pointer; color:var(--red); font-weight:800; }

  .combo{ position:relative; }
  .combo-list{ position:absolute; left:0; right:0; top:100%; margin-top:4px; z-index:30; background:#fff; border:1.5px solid var(--accent-line); border-radius:8px; box-shadow:0 8px 24px rgba(40,20,90,0.12); max-height:290px; overflow:auto; display:none; }
  .combo-list.open{ display:block; }
  .combo-opt{ padding:8px 10px; cursor:pointer; font-size:0.88rem; display:flex; justify-content:space-between; gap:10px; }
  .combo-opt .m{ color:var(--muted); font-size:0.75rem; white-space:nowrap; }
  .combo-opt.hi, .combo-opt:hover{ background:var(--accent-soft); }
  .combo-opt.free{ color:var(--accent-dark); font-weight:600; border-top:1px solid var(--line); }
  .combo-empty{ padding:8px 10px; font-size:0.82rem; color:var(--muted); }
  .chk{ display:flex; align-items:center; gap:8px; font-size:0.88rem; font-weight:600; margin:4px 0 12px; }
  .chk input{ width:18px; height:18px; accent-color:var(--accent); }
  .diff-down{ color:var(--red); font-weight:700; }
  .diff-up{ color:var(--ok); font-weight:700; }
  .card-list{ display:flex; flex-direction:column; gap:8px; }
  .card{ border:1.5px solid var(--line); border-radius:var(--radius); padding:10px 12px; cursor:pointer; background:#fff; }
  .card:hover{ border-color:var(--accent); }
  .card.sel{ border-color:var(--accent); background:var(--accent-soft); }
  .card .top{ display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .card .title{ font-weight:700; }
  .empty{ color:var(--muted); font-size:0.88rem; padding:18px 0; text-align:center; }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:0.86rem; margin-bottom:10px; }
  .kv dt{ color:var(--muted); }
  .kv dd{ margin:0; }
  pre.msgtext{ font-family:inherit; font-size:0.88rem; background:var(--hover); border:1px solid var(--line); border-radius:8px; padding:12px; white-space:pre-wrap; margin:0; }

  .login-wrap{ max-width:380px; margin:8vh auto 0; }
  .login-wrap .panel{ padding:26px; }
  .spinner{ display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:-2px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-cover{ position:fixed; inset:0; background:rgba(247,245,252,0.65); display:flex; align-items:center; justify-content:center; z-index:50; font-weight:700; gap:10px; }

  /* ---------- Печать накладных ---------- */
  #print-root{ display:none; }
  .inv{ font-family:'Times New Roman', Times, serif; color:#000; font-size:13pt; line-height:1.35; }
  @media print{
    @page{ size:A4; margin:16mm 16mm 18mm; }
    body{ background:#fff; }
    .app, .loading-cover, #preview-root{ display:none !important; }
    #print-root{ display:block; }
    .inv{ page-break-after:always; break-after:page; }
    .inv:last-child{ page-break-after:auto; break-after:auto; }
  }

  /* ---------- Предпросмотр накладных ---------- */
  .pv-overlay{ position:fixed; inset:0; z-index:60; background:rgba(26,20,51,0.72); display:flex; flex-direction:column; }
  .pv-bar{ display:flex; align-items:center; gap:10px; padding:12px 20px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .pv-bar .t{ font-weight:800; margin-right:auto; }
  .pv-pages{ flex:1; overflow:auto; padding:24px 16px 40px; display:flex; flex-direction:column; align-items:center; gap:20px; }
  .pv-page{ background:#fff; width:210mm; max-width:100%; min-height:297mm; padding:16mm 16mm 18mm; box-shadow:0 6px 30px rgba(0,0,0,0.35); }
  @media (max-width:820px){ .pv-page{ min-height:0; padding:18px; } .inv{ font-size:11pt; } }
  .inv .org{ font-weight:700; }
  .inv .date{ margin-top:4px; }
  .inv h2{ text-align:center; font-size:15pt; margin:18px 0 4px; }
  .inv .no{ text-align:center; font-weight:700; font-size:14pt; margin-bottom:14px; }
  .inv .parties{ display:flex; justify-content:space-between; margin-bottom:12px; }
  .inv table{ width:100%; border-collapse:collapse; }
  .inv th, .inv td{ border:1px solid #000; padding:4px 6px; height:22px; }
  .inv th{ font-weight:700; text-align:center; }
  .inv td.c{ text-align:center; }
  .inv .sign{ margin-top:26px; line-height:2.4; }
  .inv .basis{ font-size:10pt; margin-top:6px; }
</style>
</head>

/* ============================== УТИЛИТЫ ============================== */
const $ = (sel) => document.querySelector(sel);
function h(v){ return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function str(v){ return v === null || v === undefined ? '' : String(v).trim(); }
function num(v){ const x = Number(String(v === null || v === undefined ? '' : v).replace(',', '.').replace(/\s/g,'')); return isFinite(x) ? x : 0; }
function fmtN(x){ return (Math.round(x * 1000) / 1000).toLocaleString('ru-RU'); }
function ru(d){ if (!d) return ''; const p = d.slice(0,10).split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
function ruShort(d){ if (!d) return ''; const p = d.split('-'); return p[2] + '.' + p[1]; }
function wd(d){ const p = d.split('-').map(Number); return WD[new Date(Date.UTC(p[0], p[1]-1, p[2], 12)).getUTCDay()]; }
function ruDay(d){ return d ? wd(d) + ' ' + ruShort(d) : ''; }
function ruDT(dt){ return dt ? ru(dt) + ' ' + dt.slice(11,16) : ''; }
function todayYmd(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addDays(d, k){ const p = d.split('-').map(Number); const x = new Date(Date.UTC(p[0], p[1]-1, p[2]+k, 12)); return x.toISOString().slice(0,10); }
function chip(st){ return '<span class="chip st-' + h(st.replace(/\s/g,'-')) + '">' + h(st) + '</span>'; }
function by(arr, fn){ const m = {}; arr.forEach(x => { const k = fn(x); (m[k] = m[k] || []).push(x); }); return m; }
function uniq(arr){ return Array.from(new Set(arr)); }
const role = () => S.data ? S.data.user.role : '';
const isSuper = () => ['Закупки','Админ'].indexOf(role()) >= 0;
const isRest = () => role() === 'Ресторан';
const canEditRequests = () => isSuper();
function itemById(id){ return (S.data.items || []).find(i => i.id === id); }
function place(name){ return (S.data.places || []).find(p => p.name === name); }
function restaurants(){ return (S.data.places || []).filter(p => p.type === 'Ресторан').map(p => p.name); }
function linesOf(reqId){ return S.data.lines.filter(l => l.reqId === reqId); }
function movOf(no){ return S.data.movements.filter(m => m.no === no); }

/* ============================== API ============================== */
async function api(action, payload){
  const body = Object.assign({ action: action, token: S.token }, payload || {});
  let res;
  try {
    res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  } catch(e) { throw new Error('Нет связи с сервером. Проверьте интернет и попробуйте ещё раз'); }
  let j;
  try { j = await res.json(); } catch(e){ throw new Error('Сервер ответил ошибкой. Попробуйте обновить страницу'); }
  if (!j.ok) {
    if (j.auth) { logout(true); }
    throw new Error(j.error || 'Ошибка');
  }
  return j;
}

async function run(fn, okText){
  if (S.busy) return;
  S.busy = true; S.msg = null; cover(true);
  try {
    const r = await fn();
    if (okText) S.msg = { kind: 'ok', text: typeof okText === 'function' ? okText(r) : okText };
    return r;
  } catch(e) {
    S.msg = { kind: 'err', text: e.message };
  } finally {
    S.busy = false; cover(false); render();
  }
}

async function reload(){
  const d = await api('bootstrap');
  S.data = d;
  if (!S.tab || !tabs().some(t => t.id === S.tab)) S.tab = tabs()[0].id;
  if (!S.sumDate) S.sumDate = defaultShipDate();
  if (!S.drvDate) S.drvDate = defaultShipDate();
}

function cover(on){
  let c = document.getElementById('cover');
  if (on && !c) { c = document.createElement('div'); c.id = 'cover'; c.className = 'loading-cover'; c.innerHTML = '<span class="spinner"></span> Загрузка…'; document.body.appendChild(c); }
  if (!on && c) c.remove();
}

function defaultShipDate(){
  const o = (S.data && S.data.settings.shipOptions) || [];
  const t = todayYmd();
  const f = o.find(x => x.date >= t);
  return f ? f.date : t;
}

/* ============================== ВХОД ============================== */
function renderLogin(err){
  $('#app').innerHTML =
    '<div class="login-wrap"><div style="display:flex;justify-content:center;margin-bottom:18px">' + LOGO + '</div>' +
    '<div class="panel"><h2 class="panel-title">Заявки на расходники</h2>' +
    (err ? '<div class="msg err">' + h(err) + '</div>' : '') +
    '<form id="login-form"><div class="field"><label>Логин</label><input type="text" id="lg" autocomplete="username" autofocus></div>' +
    '<div class="field"><label>Пароль</label><input type="password" id="pw" autocomplete="current-password"></div>' +
    '<button class="btn btn-primary" style="width:100%" type="submit">Войти</button></form>' +
    '<p class="small muted" style="margin:14px 0 0">Логин и пароль лежит в тг-переписке с маркетологом</p></div>' +
    '<p class="small muted" style="text-align:center">v' + VERSION + '</p></div>';
  $('#login-form').onsubmit = async (e) => {
    e.preventDefault();
    const login = str($('#lg').value), password = $('#pw').value;
    if (!login || !password) return renderLogin('Введите логин и пароль');
    cover(true);
    try {
      const r = await api('login', { login: login, password: password });
      S.token = r.token; store.set(TOKEN_KEY, r.token);
      await reload();
      cover(false); render();
    } catch(err) { cover(false); renderLogin(err.message); }
  };
}

function logout(expired){
  S.token = ''; S.data = null; S.tab = null; S.form = null; S.ed = null; S.tr = null;
  store.del(TOKEN_KEY);
  renderLogin(expired ? 'Сессия закончилась. Войдите заново' : '');
}

  const T = [];
  const nTasks = S.data && S.data.tasks ? S.data.tasks.filter(t => t.date >= todayYmd() && t.status !== 'Отгружена').length : 0;
  if (r === 'Ресторан') {
    T.push({ id: 'new', title: S.form && S.form.id ? 'Заявка ' + S.form.id : 'Новая заявка' });

    T.push({ id: 'invoices', title: 'Накладные' });
  } else if (r === 'Закупки' || r === 'Админ') {

    T.push({ id: 'invoices', title: 'Накладные' });
    T.push({ id: 'catalog', title: 'Справочник' });
    T.push({ id: 'movements', title: 'Отчёт по перемещениям' });
    if (nTasks) T.push({ id: 'tasks', title: 'Собрать', cnt: nTasks });
  } else if (r === 'Водитель') {
    T.push({ id: 'driver', title: 'Маршрут' });

    T.push({ id: 'invoices', title: 'Накладные' });
  } else if (r === 'Экономист') {
    T.push({ id: 'movements', title: 'Перемещения' });

    T.push({ id: 'movements', title: 'Перемещения' });
    T.push({ id: 'invoices', title: 'Накладные' });
  }
  return T;
}

/* ---------- Новая / редактируемая заявка ---------- */
function newForm(){
  const opts = S.data.settings.shipOptions;
  const me = isRest() ? S.data.user.place : '';
  const taken = d => me && S.data.requests.some(r => r.place === me && r.shipDate === d);
  const first = opts.find(o => !o.late && !taken(o.date)) || opts.find(o => !o.late) || opts[0];
  return { id: '', updatedAt: '', place: isRest() ? S.data.user.place : '', shipDate: first ? first.date : '', comment: '', qty: {}, free: [], notes: {}, q: '' };
}
function formFromRequest(r){
  const f = { id: r.id, updatedAt: r.updatedAt, place: r.place, shipDate: r.shipDate, comment: r.comment, qty: {}, free: [], notes: {}, q: '' };
  linesOf(r.id).forEach(l => {
    if (l.itemId) { if (l.requested) f.qty[l.itemId] = l.requested; if (l.comment) f.notes[l.itemId] = l.comment; }
    else if (l.requested) f.free.push({ name: l.name, unit: l.unit, qty: l.requested, note: l.comment });
  });
  return f;
}
function prevOrder(placeName, exceptId){
  const reqs = S.data.requests.filter(r => r.place === placeName && r.id !== exceptId && r.status !== 'Черновик')
    .sort((a,b) => b.shipDate.localeCompare(a.shipDate));
  const r = reqs[0];
  if (!r) return null;
  const m = {};
  linesOf(r.id).forEach(l => { if (l.itemId) m[l.itemId] = l.approved !== null ? l.approved : l.requested; });
  return { date: r.shipDate, map: m };
}

/* ---------- Поиск позиции по первым буквам ---------- */
// Совпадение с началом любого слова названия: «крыш» → «Крышка…», «200» → «Стакан 200 мл».
function comboMatch(q){
  const items = S.data.items.filter(i => i.active);
  if (!q) return items;
  const words = n => n.toLowerCase().split(/[\s«»"().,:;+\-\/]+/).filter(Boolean);
  const qs = q.toLowerCase().split(/\s+/).filter(Boolean);
  return items.filter(i => { const w = words(i.name); return qs.every(x => w.some(y => y.indexOf(x) === 0)); })
    .sort((a, b) => (b.name.toLowerCase().indexOf(qs[0]) === 0) - (a.name.toLowerCase().indexOf(qs[0]) === 0));
}
function combo(key, value){
  return '<div class="combo" data-key="' + h(key) + '"><input type="text" value="' + h(value) + '" placeholder="Начните вводить название" autocomplete="off"' +
    ' onfocus="this.select();App.comboIn(this)" oninput="App.comboIn(this)" onkeydown="App.comboKey(event,this)" onblur="App.comboBlur(this)"><div class="combo-list"></div></div>';
}

function requestDetail(r, mode){
  if (!r) return '';

  html += '<dl class="kv"><dt>Ресторан</dt><dd>' + h(r.place) + '</dd><dt>Отгрузка</dt><dd>' + h(ruDay(r.shipDate)) + '</dd>' +
    '<dt>Создана</dt><dd>' + h(ruDT(r.createdAt)) + ' · ' + h(r.author) + '</dd>' +
    (r.approvedAt ? '<dt>Утверждена</dt><dd>' + h(ruDT(r.approvedAt)) + ' · ' + h(r.approvedBy) + '</dd>' : '') + '</dl>';
  if (r.comment) html += '<div class="msg info">Комментарий ресторана: ' + h(r.comment) + '</div>';
  if (r.purchaseComment) html += '<div class="msg warn">Комментарий закупок: ' + h(r.purchaseComment) + '</div>';
  html += '<div class="t-wrap"><table class="t"><thead><tr><th>Позиция</th><th class="num">Запрошено</th>' + (showApproved ? '<th class="num">Утверждено</th>' : '') + '<th>Комментарий закупок</th></tr></thead><tbody>';
  ls.forEach(l => {
    let ap = '';
    if (showApproved) {
      const a = l.approved === null ? l.requested : l.approved;
      const cls = l.requested === null ? 'diff-up' : (a < l.requested ? 'diff-down' : (a > l.requested ? 'diff-up' : ''));
      ap = '<td class="num ' + cls + '">' + (a === null ? '' : fmtN(a)) + '</td>';
    }
    html += '<tr><td>' + h(l.name) + ' <span class="muted small">' + h(l.unit) + '</span>' + (l.requested === null ? ' <span class="chip st-Утверждена">добавлено</span>' : '') + '</td>' +
      '<td class="num">' + (l.requested === null ? '—' : fmtN(l.requested)) + '</td>' + ap + '<td class="small">' + h(l.comment) + '</td></tr>';
  });
  html += '</tbody></table></div>';
  const invs = S.data.invoices.filter(i => i.basis === r.id);
  if (invs.length) html += '<div class="actions">' + invs.map(i => '<button class="btn btn-secondary btn-sm" onclick="App.print([\'' + h(i.no) + '\'])">Печать ' + h(i.no) + '</button>').join('') + '</div>';
  if (mode === 'rest') {
    const a = [];
    if (['Черновик','Отправлена','Возвращена'].indexOf(r.status) >= 0) a.push('<button class="btn btn-primary" onclick="App.editReq(\'' + r.id + '\')">' + (r.status === 'Возвращена' ? 'Исправить и отправить' : 'Изменить') + '</button>');
    if (r.status === 'Отправлена') a.push('<button class="btn btn-secondary" onclick="App.withdraw(\'' + r.id + '\')">Отозвать в черновик</button>');
    if (['Черновик','Отправлена'].indexOf(r.status) >= 0) a.push('<button class="btn btn-danger" onclick="App.delReq(\'' + r.id + '\')">Удалить</button>');
    if (r.status === 'На проверке') html += '<div class="msg info">Закупки уже проверяют заявку, изменить её нельзя. Если срочно, напишите Тане.</div>';
    if (a.length) html += '<div class="actions">' + a.join('') + '</div>';
  }
  html += '</div>';
  return html;
}

/* ---------- Входящие заявки (закупки / руководитель) ---------- */
const ACTIVE_ST = ['Отправлена','На проверке','Возвращена'];
VIEWS.inbox = function(){
  const I = S.inbox;
  let reqs = S.data.requests.slice();
  const dates = uniq(reqs.map(r => r.shipDate)).sort().reverse();
  if (I.date) reqs = reqs.filter(r => r.shipDate === I.date);
  if (I.status === 'active') reqs = reqs.filter(r => ACTIVE_ST.indexOf(r.status) >= 0);
  else if (I.status) reqs = reqs.filter(r => r.status === I.status);
  reqs.sort((a,b) => a.shipDate.localeCompare(b.shipDate) || a.place.localeCompare(b.place));
  let html = '<div class="split"><div class="panel"><h2 class="panel-title">Заявки</h2><div class="row">' +
    '<div class="field"><label>Отгрузка</label><select onchange="App.inbox(\'date\', this.value)"><option value="">все даты</option>' +
    dates.map(d => '<option value="' + d + '"' + (d === I.date ? ' selected' : '') + '>' + h(ruDay(d)) + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>Статус</label><select onchange="App.inbox(\'status\', this.value)">' +
    [['active','В работе'],['','Все'],['Отправлена','Отправлена'],['На проверке','На проверке'],['Возвращена','Возвращена'],['Утверждена','Утверждена'],['Отгружена','Отгружена'],['Черновик','Черновик']]
      .map(o => '<option value="' + o[0] + '"' + (o[0] === I.status ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div></div>';
  const notSent = restaurants().filter(p => I.date && !S.data.requests.some(r => r.place === p && r.shipDate === I.date && r.status !== 'Черновик'));
  if (notSent.length) html += '<div class="msg warn">Ещё не прислали на ' + h(ruDay(I.date)) + ': ' + h(notSent.join(', ')) + '</div>';
  if (!reqs.length) html += '<div class="empty">Нет заявок</div>';
  else {
    html += '<div class="card-list">';
    reqs.forEach(r => {
      html += '<div class="card' + (r.id === I.sel ? ' sel' : '') + '" onclick="App.open(\'' + r.id + '\')"><div class="top"><span class="title">' + h(r.place) + ' · ' + h(ruDay(r.shipDate)) + '</span>' + chip(r.status) + '</div>' +
        '<div class="small muted">' + h(r.id) + ' · позиций: ' + linesOf(r.id).length + ' · ' + h(ruDT(r.updatedAt)) + (r.late ? ' · <span style="color:var(--red)">поздняя</span>' : '') + '</div></div>';
    });
    html += '</div>';
  }
  html += '</div><div>';
  const r = S.data.requests.find(x => x.id === I.sel);
  if (r) html += canEditRequests() ? editor(r) : requestDetail(r, 'view');
  else html += '<div class="panel"><div class="empty">Выберите заявку слева</div></div>';
  html += '</div></div>';
  return html;
};

// Сколько ресторан обычно берёт позицию: среднее по утверждённым заявкам за 6 недель до этой отгрузки (нужно ≥ 2).
function usualQty(place, itemId, exceptId, shipDate){
  const from = addDays(shipDate, -42);
  const vals = [];
  S.data.requests.forEach(r => {
    if (r.place !== place || r.id === exceptId || r.shipDate < from || r.shipDate >= shipDate || ['Утверждена','Отгружена'].indexOf(r.status) < 0) return;
    S.data.lines.forEach(l => { if (l.reqId === r.id && l.itemId === itemId && l.approved) vals.push(l.approved); });
  });
  return vals.length >= 2 ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
}

function startEditor(r){
  const E = { id: r.id, updatedAt: r.updatedAt, purchaseComment: r.purchaseComment, lines: {}, added: [], addItem: '', addQty: '' };
  linesOf(r.id).forEach(l => { E.lines[l.lineId] = { approved: l.approved === null ? '' : String(l.approved), from: l.from || '', comment: l.comment || '' }; });
  S.ed = E;
}

function editor(r){
  if (!S.ed || S.ed.id !== r.id || S.ed.updatedAt !== r.updatedAt) startEditor(r);
  const E = S.ed;
  const editable = ['Отправлена','На проверке','Возвращена'].indexOf(r.status) >= 0;
  const approved = ['Утверждена','Отгружена'].indexOf(r.status) >= 0;
  const srcs = S.data.places.filter(p => p.name !== r.place).map(p => p.name);
  let html = '<div class="panel"><h2 class="panel-title">' + h(r.place) + ' · ' + h(ruDay(r.shipDate)) + ' ' + chip(r.status) + (r.late ? ' <span class="chip late">поздняя</span>' : '') + '</h2>';
  html += '<dl class="kv"><dt>Заявка</dt><dd>' + h(r.id) + '</dd><dt>Создана</dt><dd>' + h(ruDT(r.createdAt)) + ' · ' + h(r.author) + '</dd>' +
    (r.approvedAt ? '<dt>Утверждена</dt><dd>' + h(ruDT(r.approvedAt)) + ' · ' + h(r.approvedBy) + '</dd>' : '') + '</dl>';
  if (r.comment) html += '<div class="msg info">Комментарий ресторана: ' + h(r.comment) + '</div>';
  if (r.status === 'Отправлена') html += '<div class="msg info" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><span>Пока заявка «Отправлена», ресторан может её менять. Нажмите «Взять в работу» или просто сохраните правки.</span>' +
    '<button class="btn btn-primary btn-sm" onclick="App.take()">Взять в работу</button></div>';
  if (r.status === 'Черновик') html += '<div class="msg warn">Это черновик, ресторан ещё не отправил заявку.</div>';

  html += '<div class="t-wrap"><table class="t"><thead><tr><th>Позиция</th><th class="num">Запрошено</th><th class="num" style="width:110px">Утвердить</th><th style="width:140px">Откуда</th><th>Комментарий ресторану</th></tr></thead><tbody>';
  linesOf(r.id).forEach(l => {
    const e = E.lines[l.lineId];
    const dis = editable ? '' : ' disabled';
    const disQ = editable || approved ? '' : ' disabled';
    const us = l.itemId && l.requested ? usualQty(r.place, l.itemId, r.id, r.shipDate) : null;
    const over = us !== null && l.requested >= us * (S.data.settings.overuse || 1.5) && l.requested - us >= ((itemById(l.itemId) || {}).mult || 1);
    html += '<tr><td>' + h(l.name) + ' <span class="muted small">' + h(l.unit) + '</span>' + (!l.itemId ? ' <span class="chip st-Возвращена">нет в справочнике</span>' : '') +
      (over ? ' <span class="chip late" title="Среднее по утверждённым заявкам этого ресторана за 6 недель">больше обычного: обычно ~' + fmtN(us) + '</span>' : '') +
      (l.invoice ? '<div class="small muted">' + h(l.invoice) + '</div>' : '') + '</td>' +
      '<td class="num">' + (l.requested === null ? '—' : fmtN(l.requested)) + '</td>' +
      '<td><input type="text" inputmode="decimal" style="text-align:right" value="' + h(e.approved) + '" placeholder="' + (l.requested === null ? '' : fmtN(l.requested)) + '"' + disQ + ' oninput="App.ed(\'' + l.lineId + '\',\'approved\',this.value)"></td>' +
      '<td><select' + dis + ' onchange="App.ed(\'' + l.lineId + '\',\'from\',this.value)"><option value="">—</option>' + srcs.map(s => '<option' + (s === e.from ? ' selected' : '') + '>' + h(s) + '</option>').join('') + '</select></td>' +
      '<td><input type="text" value="' + h(e.comment) + '" placeholder="например: нет, будет через неделю"' + disQ + ' oninput="App.ed(\'' + l.lineId + '\',\'comment\',this.value)"></td></tr>';
  });
  E.added.forEach((a, k) => {
    const it = itemById(a.itemId);
    html += '<tr><td>' + h(it ? it.name : a.itemId) + ' <span class="chip st-Утверждена">добавляю</span></td><td class="num">—</td>' +
      '<td><input type="text" inputmode="decimal" style="text-align:right" value="' + h(a.approved) + '" oninput="App.edAdd(' + k + ',\'approved\',this.value)"></td>' +
      '<td><select onchange="App.edAdd(' + k + ',\'from\',this.value)"><option value="">—</option>' + srcs.map(s => '<option' + (s === a.from ? ' selected' : '') + '>' + h(s) + '</option>').join('') + '</select></td>' +
      '<td><button class="btn btn-danger btn-sm" onclick="App.edAddDel(' + k + ')">Убрать</button></td></tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="small muted" style="margin-top:6px">Пустое «Утвердить» = как запрошено. 0 = не отгружаем (напишите ресторану почему).</div>';

  if (editable) {
    html += '<div class="field" style="margin-top:12px"><label>Добавить позицию</label>' + combo('ed', '') + '</div>';
    html += '<div class="field"><label>Комментарий закупок (виден ресторану)</label><textarea oninput="App.edC(this.value)">' + h(E.purchaseComment) + '</textarea></div>';
    html += '<div class="actions">' +
      '<button class="btn btn-primary" onclick="App.review(\'approve\')">Утвердить</button>' +
      '<button class="btn btn-secondary" onclick="App.review(\'save\')">Сохранить</button>' +
      (r.status === 'Отправлена' ? '<button class="btn btn-secondary" onclick="App.take()">Взять в работу</button>' : '') +
      '<button class="btn btn-danger" onclick="App.review(\'return\')">Вернуть ресторану</button></div>';
  } else if (r.purchaseComment) {
    html += '<div class="msg warn">Комментарий закупок: ' + h(r.purchaseComment) + '</div>';
  }
  if (approved) {
    const invs = S.data.invoices.filter(i => i.basis === r.id);
    html += '<div class="small muted" style="margin-top:6px">Не хватило на складе? Поправьте количество и нажмите «Сохранить корректировку»: номера накладных сохранятся, ресторан получит уведомление. Сменить «откуда» — через «Вернуть в работу».</div>';
    html += '<div class="actions"><button class="btn btn-primary" onclick="App.adjust()">Сохранить корректировку</button>' +
      (invs.length ? '<button class="btn btn-secondary" onclick="App.print(' + h(JSON.stringify(invs.map(i => i.no))) + ')">Печать накладных (' + invs.length + ')</button>' : '') +
      '<button class="btn btn-secondary" onclick="App.reopen()">Вернуть в работу</button></div>';
    html += '<div class="small muted" style="margin-top:6px">«Вернуть в работу» удалит накладные по этой заявке, чтобы их можно было пересоздать.</div>';
  }
  html += '</div>';
  return html;
}

/* ---------- Свод по позициям на дату ---------- */
VIEWS.summary = function(){
  const date = S.sumDate;
  const dates = uniq(S.data.settings.shipOptions.map(o => o.date).concat(S.data.requests.map(r => r.shipDate))).sort().reverse();
  const reqs = S.data.requests.filter(r => r.shipDate === date && r.status !== 'Черновик');
  const rests = uniq(reqs.map(r => r.place)).sort();
  const rows = {};
  reqs.forEach(r => linesOf(r.id).forEach(l => {
    const q = l.approved !== null ? l.approved : (l.requested || 0);
    if (!q) return;
    const key = (l.itemId || '') + '|' + l.name;
    const it = l.itemId ? itemById(l.itemId) : null;
    const row = rows[key] = rows[key] || { name: l.name, unit: l.unit, from: l.from || (it && it.from) || '—', order: it ? it.order : 1e9, by: {} };
    row.by[r.place] = (row.by[r.place] || 0) + q;
  }));
  const groups = by(Object.values(rows), r => r.from);
  let html = '<div class="panel"><h2 class="panel-title">Свод на дату</h2><div class="row"><div class="field" style="max-width:260px"><label>Отгрузка</label><select onchange="App.sumDate(this.value)">' +
    dates.map(d => '<option value="' + d + '"' + (d === date ? ' selected' : '') + '>' + h(ruDay(d)) + '</option>').join('') + '</select></div></div>';
  html += '<div class="small muted">Утверждённое количество. Черновики не учитываются. Заявок: ' + reqs.length + ' (' +
    h(Object.entries(by(reqs, r => r.status)).map(e => e[0].toLowerCase() + ' ' + e[1].length).join(', ') || '—') + ')</div>';
  if (!reqs.length) return html + '<div class="empty">На эту дату заявок нет</div></div>';
  Object.keys(groups).sort().forEach(src => {
    const list = groups[src].sort((a,b) => a.order - b.order);
    html += '<h3 class="sec">Откуда: ' + h(src) + '</h3><div class="t-wrap"><table class="t"><thead><tr><th>Позиция</th>' + rests.map(p => '<th class="num">' + h(p) + '</th>').join('') + '<th class="num">Итого</th></tr></thead><tbody>';
    list.forEach(r => {
      let tot = 0;
      html += '<tr><td>' + h(r.name) + ' <span class="muted small">' + h(r.unit) + '</span></td>' + rests.map(p => { const v = r.by[p] || 0; tot += v; return '<td class="num">' + (v ? fmtN(v) : '<span class="muted">·</span>') + '</td>'; }).join('') + '<td class="num"><b>' + fmtN(tot) + '</b></td></tr>';
    });
    html += '</tbody></table></div>';
  });
  return html + '</div>';
};

/* ---------- Водителю ---------- */
function driverText(date){
  const invs = S.data.invoices.filter(i => i.date === date);
  if (!invs.length) return '';
  const lines = ['Отгрузка ' + ruDay(date)];
  const byFrom = by(invs, i => i.from);
  Object.keys(byFrom).sort((a,b) => (place(a) && place(a).type === 'Склад' ? -1 : 0) - (place(b) && place(b).type === 'Склад' ? -1 : 0) || a.localeCompare(b)).forEach(from => {
    lines.push('');
    lines.push('Забрать: ' + from.toUpperCase());
    byFrom[from].sort((a,b) => a.to.localeCompare(b.to)).forEach(inv => {
      lines.push('→ ' + inv.to + ' (' + inv.no + ')');
      movOf(inv.no).forEach(m => lines.push('   • ' + m.name + ' — ' + fmtN(m.qty) + ' ' + m.unit));
    });
  });
  return lines.join('\n');
}
VIEWS.driver = function(){
  const date = S.drvDate;
  const dates = uniq(S.data.settings.shipOptions.map(o => o.date).concat(S.data.invoices.map(i => i.date))).sort().reverse();
  const txt = driverText(date);
  let html = '<div class="panel"><h2 class="panel-title">' + (role() === 'Водитель' ? 'Маршрут' : 'Сообщение водителю') + '</h2><div class="row"><div class="field" style="max-width:260px"><label>Дата</label><select onchange="App.drvDate(this.value)">' +
    dates.map(d => '<option value="' + d + '"' + (d === date ? ' selected' : '') + '>' + h(ruDay(d)) + '</option>').join('') + '</select></div></div>';
  if (isSuper()) {
    const pend = S.data.requests.filter(r => r.shipDate === date && ACTIVE_ST.indexOf(r.status) >= 0);
    if (pend.length) html += '<div class="msg warn">Ещё не утверждены: ' + h(pend.map(r => r.place + ' (' + r.status.toLowerCase() + ')').join(', ')) + '. В сообщение попадают только утверждённые заявки и перемещения.</div>';
  }
  if (!txt) html += '<div class="empty">На эту дату накладных нет</div>';
  else {
    html += '<pre class="msgtext" id="drv-text">' + h(txt) + '</pre><div class="actions">' +
      '<button class="btn btn-primary" onclick="App.copyDrv()">Скопировать для Viber</button>' +
      '<button class="btn btn-secondary" onclick="App.print(' + h(JSON.stringify(S.data.invoices.filter(i => i.date === date).map(i => i.no))) + ')">Печать всех накладных на дату</button>';
    // Водитель не видит статусы заявок, поэтому для него кнопка есть всегда, когда есть плановые накладные.
    const ok = isSuper() ? S.data.requests.filter(r => r.shipDate === date && r.status === 'Утверждена').length
                         : uniq(S.data.invoices.filter(i => i.date === date && i.type === 'Плановая').map(i => i.basis)).length;
    if ((isSuper() || role() === 'Водитель') && ok) html += '<button class="btn btn-secondary" onclick="App.shipped()">Отметить: всё отгружено' + (isSuper() ? ' (' + ok + ')' : '') + '</button>';
    html += '</div>';
  }
  return html + '</div>';
};

/* ---------- Собрать ---------- */
VIEWS.tasks = function(){
  const t0 = todayYmd();
  const tasks = S.data.tasks.filter(t => t.date >= addDays(t0, -2));
  let html = '<div class="panel"><h2 class="panel-title">Что собрать</h2>';
  html += '<div class="small muted" style="margin-bottom:6px">Позиции, которые лежат у вас и должны уйти в другие рестораны.</div>';
  if (!tasks.length) return html + '<div class="empty">Сейчас собирать ничего не нужно</div></div>';
  const byDate = by(tasks, t => t.date);
  Object.keys(byDate).sort().forEach(d => {
    html += '<h3 class="sec">' + h(ruDay(d)) + (d < t0 ? ' · прошло' : '') + '</h3>';
    const byTo = by(byDate[d], t => t.to + '|' + t.invoice);
    Object.keys(byTo).sort().forEach(k => {
      const list = byTo[k], t1 = list[0];
      html += '<div style="margin:8px 0 4px"><b>→ ' + h(t1.to) + '</b> <span class="muted small">' + h(t1.invoice) + ' · ' + h(t1.kind.toLowerCase()) + (t1.status === 'Отгружена' ? ' · отгружено' : '') + '</span></div>' +
        '<table class="t"><tbody>' + list.map(t => '<tr><td>' + h(t.name) + '</td><td class="num" style="width:120px"><b>' + fmtN(t.qty) + '</b> ' + h(t.unit) + '</td></tr>').join('') + '</tbody></table>';
    });
  });
  return html + '</div>';
};

/* ---------- Перемещение ---------- */

  if (isRest() && T.from && T.to && T.from !== me && T.to !== me) html += '<div class="msg warn">Ваш ресторан должен быть «откуда» или «куда».</div>';
  html += '<h3 class="sec">Позиции</h3>';
  T.lines.forEach((l, k) => {
    const it = l.itemId && l.itemId !== '__free' ? itemById(l.itemId) : null;
    html += '<div class="free-row" style="grid-template-columns:1fr 90px 34px">' + combo('tr:' + k, it ? it.name + ' (' + it.unit + ')' : (l.itemId === '__free' ? 'Другое — вписать…' : '')) +
      '<input type="text" inputmode="decimal" placeholder="кол-во" value="' + h(l.qty) + '" onchange="App.trl(' + k + ',\'qty\',this.value)">' +
      '<button class="x-btn" type="button" onclick="App.trlDel(' + k + ')">×</button></div>';
    if (l.itemId === '__free') html += '<div class="free-row" style="grid-template-columns:1fr 90px 34px"><input type="text" placeholder="Название" value="' + h(l.name) + '" onchange="App.trl(' + k + ',\'name\',this.value)"><input type="text" placeholder="ед." value="' + h(l.unit) + '" onchange="App.trl(' + k + ',\'unit\',this.value)"><span></span></div>';
  });
  html += '<button class="btn btn-secondary btn-sm" onclick="App.trlAdd()">+ Ещё позиция</button>';
  html += '<div class="field" style="margin-top:12px"><label>Комментарий (попадёт в основание)</label><input type="text" value="' + h(T.comment) + '" onchange="App.tr(\'comment\', this.value)"></div>';
  html += '<div class="actions"><button class="btn btn-primary" onclick="App.saveTr()">Оформить накладную</button></div></div>';
  return html;
};

    .sort((a,b) => b.date.localeCompare(a.date) || a.no.localeCompare(b.no));

/* ---------- Перемещения / отчёт ---------- */
function movFiltered(){
  const F = S.mov;
  const q = F.q.toLowerCase();
  return S.data.movements.filter(m => m.date >= F.from && m.date <= F.to && (!F.src || m.from === F.src) && (!F.dst || m.to === F.dst) && (!F.type || m.type === F.type) &&
    (!q || (m.name + ' ' + m.no + ' ' + m.category).toLowerCase().indexOf(q) >= 0));
}
VIEWS.movements = function(){
  const F = S.mov;
  if (!F.from) { const t = todayYmd(); F.from = t.slice(0,8) + '01'; const p = t.split('-').map(Number); F.to = new Date(Date.UTC(p[0], p[1], 0, 12)).toISOString().slice(0,10); } // текущий месяц целиком
  const placesAll = uniq(S.data.movements.map(m => m.from).concat(S.data.movements.map(m => m.to))).sort();
  const list = movFiltered().sort((a,b) => a.date.localeCompare(b.date) || a.no.localeCompare(b.no));
  let html = '<div class="panel"><h2 class="panel-title">Перемещения</h2><div class="row">' +
    '<div class="field"><label>С</label><input type="date" value="' + F.from + '" onchange="App.movF(\'from\', this.value)"></div>' +
    '<div class="field"><label>По</label><input type="date" value="' + F.to + '" onchange="App.movF(\'to\', this.value)"></div>' +
    '<div class="field"><label>Откуда</label><select onchange="App.movF(\'src\', this.value)"><option value="">все</option>' + placesAll.map(p => '<option' + (p === F.src ? ' selected' : '') + '>' + h(p) + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>Куда</label><select onchange="App.movF(\'dst\', this.value)"><option value="">все</option>' + placesAll.map(p => '<option' + (p === F.dst ? ' selected' : '') + '>' + h(p) + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>Тип</label><select onchange="App.movF(\'type\', this.value)"><option value="">все</option>' + ['Плановая','Между ресторанами'].map(p => '<option' + (p === F.type ? ' selected' : '') + '>' + p + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>Позиция</label><input type="text" id="mov-q" value="' + h(F.q) + '" oninput="App.movQ(this.value)"></div></div>';
  html += '<div class="actions" style="margin:0 0 10px"><button class="btn btn-primary" onclick="App.excel()"' + (list.length ? '' : ' disabled') + '>Скачать Excel</button>' +
    '<button class="btn btn-secondary" onclick="App.print(' + h(JSON.stringify(uniq(list.map(m => m.no)))) + ')"' + (list.length ? '' : ' disabled') + '>Печать накладных (' + uniq(list.map(m => m.no)).length + ')</button></div>';
  if (!list.length) return html + '<div class="empty">За период перемещений нет</div></div>';

  // Свод: позиция × куда
  const dsts = uniq(list.map(m => m.to)).sort();
  const piv = {};
  list.forEach(m => { const k = m.name + '|' + m.unit; const r = piv[k] = piv[k] || { name: m.name, unit: m.unit, by: {} }; r.by[m.to] = (r.by[m.to] || 0) + m.qty; });
  html += '<h3 class="sec">Расход по ресторанам за период</h3><div class="t-wrap"><table class="t"><thead><tr><th>Позиция</th>' + dsts.map(d => '<th class="num">' + h(d) + '</th>').join('') + '<th class="num">Итого</th></tr></thead><tbody>';
  Object.values(piv).sort((a,b) => a.name.localeCompare(b.name)).forEach(r => {
    let tot = 0;
    html += '<tr><td>' + h(r.name) + ' <span class="muted small">' + h(r.unit) + '</span></td>' + dsts.map(d => { const v = r.by[d] || 0; tot += v; return '<td class="num">' + (v ? fmtN(v) : '<span class="muted">·</span>') + '</td>'; }).join('') + '<td class="num"><b>' + fmtN(tot) + '</b></td></tr>';
  });
  const invCount = {}; uniq(list.map(m => m.no)).forEach(no => { const m = list.find(x => x.no === no); invCount[m.to] = (invCount[m.to] || 0) + 1; });
  html += '</tbody><tfoot><tr><td>Накладных</td>' + dsts.map(d => '<td class="num">' + (invCount[d] || 0) + '</td>').join('') + '<td class="num">' + uniq(list.map(m => m.no)).length + '</td></tr></tfoot></table></div>';

  html += '<h3 class="sec">Все строки (' + list.length + ')</h3><div class="t-wrap"><table class="t"><thead><tr><th>Дата</th><th>№</th><th>Откуда</th><th>Куда</th><th>Позиция</th><th class="num">Кол-во</th><th>Ед.</th></tr></thead><tbody>' +
    list.map(m => '<tr><td>' + h(ru(m.date)) + '</td><td>' + h(m.no) + '</td><td>' + h(m.from) + '</td><td>' + h(m.to) + '</td><td>' + h(m.name) + '</td><td class="num">' + fmtN(m.qty) + '</td><td>' + h(m.unit) + '</td></tr>').join('') +
    '</tbody></table></div></div>';
  return html;
};

/* ============================== EXCEL ============================== */
function exportExcel(){
  if (!window.XLSX) { S.msg = { kind: 'err', text: 'Библиотека Excel ещё не загрузилась, попробуйте через пару секунд' }; return render(); }
  const list = movFiltered().sort((a,b) => a.date.localeCompare(b.date) || a.no.localeCompare(b.no));
  const rows = list.map(m => ({ 'Дата': ru(m.date), '№ накладной': m.no, 'Тип': m.type, 'Откуда': m.from, 'Куда': m.to, 'ID позиции': m.itemId, 'Наименование': m.name, 'Категория': m.category, 'Ед. изм.': m.unit, 'Количество': m.qty }));
  const dsts = uniq(list.map(m => m.to)).sort();
  const piv = {};
  list.forEach(m => { const k = m.name + '|' + m.unit; const r = piv[k] = piv[k] || { 'Позиция': m.name, 'Ед. изм.': m.unit }; r[m.to] = (r[m.to] || 0) + m.qty; });
  const pivRows = Object.values(piv).sort((a,b) => a['Позиция'].localeCompare(b['Позиция'])).map(r => { let t = 0; dsts.forEach(d => { r[d] = r[d] || 0; t += r[d]; }); r['Итого'] = t; return r; });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Перемещения');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pivRows, { header: ['Позиция','Ед. изм.'].concat(dsts, ['Итого']) }), 'Свод по ресторанам');
  XLSX.writeFile(wb, 'Перемещения_' + S.mov.from + '_' + S.mov.to + '.xlsx');
}

/* ============================== ДЕЙСТВИЯ ============================== */
function roundUp(id, v){
  const it = itemById(id);
  let x = num(v);
  if (x <= 0) return '';
  const m = it ? it.mult || 1 : 1;
  x = Math.ceil(Math.round(x / m * 1000) / 1000) * m;
  return x;
}
function keepFocus(fn){
  const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
  fn();
  if (id) { const e = document.getElementById(id); if (e) { e.focus(); try { e.setSelectionRange(pos, pos); } catch(_){} } }
}

window.App = {
  refresh: () => run(reload, 'Обновлено'),
  logout: () => logout(false),
  tab(t){ S.tab = t; S.msg = null; if (t !== 'transfer') S.justCreated = null; render(); window.scrollTo(0,0); },

  // форма заявки
  f(k, v){ S.form[k] = v; render(); },
  fq(v){ S.form.q = v; keepFocus(render); },
  setQty(id, v){ const x = roundUp(id, v); if (x === '') delete S.form.qty[id]; else S.form.qty[id] = x; render(); },
  step(id, d){ const it = itemById(id); const m = it ? it.mult || 1 : 1; const cur = num(S.form.qty[id]); const x = Math.max(0, cur + d * m); if (!x) delete S.form.qty[id]; else S.form.qty[id] = x; render(); },
  free(k, f, v){ S.form.free[k][f] = f === 'qty' ? (num(v) || '') : v; render(); },
  freeAdd(){ S.form.free.push({ name: '', unit: 'шт', qty: '' }); render(); },
  freeDel(k){ S.form.free.splice(k, 1); render(); },
  repeatLast(){
    const f = S.form;
    const prev = prevOrder(f.place, f.id);
    if (!prev) return;
    if (Object.keys(f.qty).length && !confirm('Заменить количества в форме прошлым заказом?')) return;
    f.qty = {};
    Object.keys(prev.map).forEach(id => { const it = itemById(id); if (it && it.active && prev.map[id] > 0) f.qty[id] = roundUp(id, prev.map[id]); });
    S.msg = { kind: 'ok', text: 'Заполнено как ' + ruDay(prev.date) + ' — проверьте и поправьте' };
    render();
  },
  cancelEdit(){ S.form = null; S.tab = isRest() ? 'mine' : 'inbox'; render(); },
  saveReq(submit){
    const f = S.form;
    if (!f.place) { S.msg = { kind: 'err', text: 'Выберите ресторан' }; return render(); }
    const lines = Object.keys(f.qty).filter(k => num(f.qty[k]) > 0).map(k => ({ itemId: k, qty: num(f.qty[k]) }))
      .concat(f.free.filter(x => str(x.name) && num(x.qty) > 0).map(x => ({ name: str(x.name), unit: str(x.unit) || 'шт', qty: num(x.qty) })));
    run(async () => {
      const r = await api('saveRequest', { id: f.id, updatedAt: f.updatedAt, place: f.place, shipDate: f.shipDate, comment: f.comment, submit: submit, lines: lines });
      S.form = null;
      await reload();
      if (isRest()) { S.tab = 'mine'; S.mineSel = r.id; } else { S.tab = 'inbox'; S.inbox.sel = r.id; }
      return r;
    }, r => submit ? 'Заявка ' + r.id + ' отправлена' + (r.late ? ' (поздняя)' : '') : 'Черновик ' + r.id + ' сохранён');
  },
  editReq(id){ const r = S.data.requests.find(x => x.id === id); S.form = formFromRequest(r); S.tab = 'new'; S.msg = null; render(); },
  withdraw(id){ const r = S.data.requests.find(x => x.id === id); run(async () => { await api('withdrawRequest', { id: id, updatedAt: r.updatedAt }); await reload(); }, 'Заявка отозвана в черновик'); },
  delReq(id){
    if (!confirm('Удалить заявку ' + id + '?')) return;
    const r = S.data.requests.find(x => x.id === id);
    run(async () => { await api('deleteDraft', { id: id, updatedAt: r.updatedAt }); S.mineSel = null; await reload(); }, 'Заявка удалена');
  },
  mineSel(id){ S.mineSel = id; S.msg = null; render(); },

  // закупки
  inbox(k, v){ S.inbox[k] = v; render(); },
  open(id){ S.inbox.sel = id; S.msg = null; S.ed = null; render(); },
  ed(lineId, k, v){ S.ed.lines[lineId][k] = v; },
  edC(v){ S.ed.purchaseComment = v; },
  edAdd(k, f, v){ S.ed.added[k][f] = v; },
  edAddDel(k){ S.ed.added.splice(k, 1); render(); },

  take(){ const E = S.ed; run(async () => { await api('takeRequest', { id: E.id }); S.ed = null; await reload(); }, 'Заявка взята в работу, ресторан больше не может её менять'); },
  review(decision){
    const E = S.ed;
    const r = S.data.requests.find(x => x.id === E.id);
    if (decision === 'return' && !str(E.purchaseComment)) { S.msg = { kind: 'err', text: 'Напишите в «Комментарий закупок», что нужно исправить' }; return render(); }
    const lines = Object.keys(E.lines).map(id => ({ lineId: id, approved: E.lines[id].approved, from: E.lines[id].from, comment: E.lines[id].comment }))
      .concat(E.added.filter(a => num(a.approved) > 0).map(a => ({ itemId: a.itemId, approved: a.approved, from: a.from })));
    run(async () => {
      const res = await api('reviewRequest', { id: E.id, updatedAt: r.updatedAt, decision: decision, purchaseComment: E.purchaseComment, lines: lines });
      S.ed = null; await reload(); return res;
    }, res => decision === 'approve' ? 'Утверждено. Накладные: ' + res.invoices.join(', ') : decision === 'return' ? 'Заявка возвращена ресторану' : 'Сохранено');
  },
  adjust(){
    const E = S.ed;
    const r = S.data.requests.find(x => x.id === E.id);
    const lines = linesOf(E.id).filter(l => {
      const e = E.lines[l.lineId];
      return num(e.approved) !== (l.approved || 0) || str(e.comment) !== str(l.comment);
    }).map(l => ({ lineId: l.lineId, approved: num(E.lines[l.lineId].approved), comment: str(E.lines[l.lineId].comment) }));
    if (!lines.length) { S.msg = { kind: 'warn', text: 'Изменений нет' }; return render(); }
    run(async () => { const res = await api('adjustApproved', { id: E.id, updatedAt: r.updatedAt, lines: lines }); S.ed = null; await reload(); return res; },
      res => 'Корректировка сохранена (строк: ' + res.changed + '). Ресторан получит уведомление');
  },
  reopen(){
    if (!confirm('Снять утверждение? Накладные по этой заявке будут удалены.')) return;
    const id = S.inbox.sel;
    run(async () => { await api('reopenRequest', { id: id }); S.ed = null; await reload(); }, 'Заявка снова в работе, накладные удалены');
  },
  sumDate(v){ S.sumDate = v; render(); },
  drvDate(v){ S.drvDate = v; render(); },
  copyDrv(){
    const t = driverText(S.drvDate);
    const done = () => { S.msg = { kind: 'ok', text: 'Скопировано' }; render(); };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => { fallbackCopy(t); done(); });
    else { fallbackCopy(t); done(); }
  },
  shipped(){ const d = S.drvDate; run(async () => { const r = await api('markShipped', { date: d }); await reload(); return r; }, r => 'Отмечено отгруженными: ' + r.count); },

  // перемещение
  tr(k, v){ S.tr[k] = v; S.justCreated = null; render(); },
  trl(k, f, v){
    const l = S.tr.lines[k];
    if (f === 'itemId') { l.itemId = v; const it = itemById(v); l.unit = it ? it.unit : (l.unit || 'шт'); if (it) l.name = ''; }
    else if (f === 'qty') l.qty = num(v) || '';
    else l[f] = v;
    render();
  },
  trlAdd(){ S.tr.lines.push({ itemId: '', name: '', unit: '', qty: '' }); render(); },
  trlDel(k){ S.tr.lines.splice(k, 1); if (!S.tr.lines.length) App.trlAdd(); else render(); },
  saveTr(){
    const T = S.tr;
    if (!T.from || !T.to) { S.msg = { kind: 'err', text: 'Выберите, откуда и куда' }; return render(); }
    const lines = T.lines.filter(l => num(l.qty) > 0 && (l.itemId && l.itemId !== '__free' || str(l.name)))
      .map(l => l.itemId && l.itemId !== '__free' ? { itemId: l.itemId, qty: num(l.qty) } : { name: str(l.name), unit: str(l.unit) || 'шт', qty: num(l.qty) });
    if (!lines.length) { S.msg = { kind: 'err', text: 'Добавьте хотя бы одну позицию с количеством' }; return render(); }
    run(async () => {
      const r = await api('createTransfer', { from: T.from, to: T.to, date: T.date, comment: T.comment, lines: lines });
      S.tr = null; S.justCreated = r.invoice; await reload(); return r;
    });
  },

  // накладные / отчёт
  invF(k, v){ S.inv[k] = v; render(); },
  invQ(v){ S.inv.q = v; keepFocus(render); },
  invChk(no, on){ if (on) S.inv.checked[no] = true; else delete S.inv.checked[no]; render(); },
  invAll(on){ const F = S.inv; S.data.invoices.filter(i => i.date >= F.from && i.date <= F.to).forEach(i => { if (on) F.checked[i.no] = true; else delete F.checked[i.no]; }); render(); },
  movF(k, v){ S.mov[k] = v; render(); },
  movQ(v){ S.mov.q = v; keepFocus(render); },
  // справочник
  catQ(v){ S.cat.q = v; keepFocus(render); },
  catNew(){ S.cat.sel = 'new'; S.cat.f = catForm(null); S.msg = null; render(); },
  catSel(id){ S.cat.sel = id; S.cat.f = catForm(itemById(id)); S.msg = null; render(); },
  catF(k, v, rerender){ S.cat.f[k] = v; if (rerender) render(); },
  catCancel(){ S.cat.sel = null; S.cat.f = null; render(); },
  catSave(){
    const f = S.cat.f;
    const body = { id: f.id, name: str(f.name), category: f.category, unit: str(f.unit), mult: num(f.mult), from: f.from,
                   responsible: f.responsible, order: str(f.order), active: !!f.active, comment: str(f.comment) };
    run(async () => {
      const r = await api('saveItem', body);
      await reload();
      S.cat.sel = r.id; S.cat.f = catForm(itemById(r.id));
      return r;
    }, () => f.id ? 'Сохранено' : 'Позиция «' + str(f.name) + '» добавлена в справочник');
  },

  // поиск позиции
  comboIn(el){ el.setAttribute('data-hi', 0); comboDraw(el); },
  comboKey(e, el){
    const n = comboOpts(el).length; let hi = Number(el.getAttribute('data-hi') || 0);
    if (e.key === 'ArrowDown'){ e.preventDefault(); el.setAttribute('data-hi', Math.min(hi + 1, n - 1)); comboDraw(el); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); el.setAttribute('data-hi', Math.max(hi - 1, 0)); comboDraw(el); }
    else if (e.key === 'Enter'){ e.preventDefault(); const o = comboOpts(el)[hi]; if (o) App.comboPick(el.parentNode.getAttribute('data-key'), o.id, hi, el); }
    else if (e.key === 'Escape'){ el.blur(); }
  },
  comboBlur(el){ setTimeout(() => { const b = el.parentNode && el.parentNode.querySelector('.combo-list'); if (b) b.classList.remove('open'); }, 120); },
  comboPick(key, id, k, node){
    const input = node.closest('.combo').querySelector('input');
    const typed = input.value.trim();
    if (key === 'ed') {
      const it = itemById(id); if (!it) return;
      S.ed.added.push({ itemId: id, approved: '', from: it.from || '' });
    } else if (key.indexOf('tr:') === 0) {
      const l = S.tr.lines[Number(key.slice(3))];
      if (id === '__free') { l.itemId = '__free'; l.name = typed; l.unit = l.unit || 'шт'; }
      else { const it = itemById(id); l.itemId = id; l.unit = it ? it.unit : 'шт'; l.name = ''; }
      S.justCreated = null;
    }
    render();
    if (key.indexOf('tr:') === 0) { const q = document.querySelectorAll('.free-row input[inputmode=decimal]')[Number(key.slice(3))]; if (q) q.focus(); }
  },
  print: printInvoices,
  preview: previewInvoices,
  pvClose(){ $('#preview-root').innerHTML = ''; document.body.style.overflow = ''; },
  pvPrint(){ const nos = JSON.parse($('#preview-root').getAttribute('data-nos') || '[]'); printInvoices(nos); },
  excel: exportExcel
};

function comboOpts(el){
  const key = el.parentNode.getAttribute('data-key');
  const q = el.value.trim();
  const list = comboMatch(q).slice(0, 10);
  const opts = list.map(i => ({ id: i.id, label: i.name, meta: i.unit + (i.mult > 1 ? ' · кратно ' + fmtN(i.mult) : '') }));
  if (key.indexOf('tr:') === 0 && q) opts.push({ id: '__free', label: 'Вписать «' + q + '» вручную', meta: '', free: true });
  return opts;
}
function comboDraw(el){
  const box = el.parentNode.querySelector('.combo-list');
  const opts = comboOpts(el);
  const hi = Math.min(Number(el.getAttribute('data-hi') || 0), Math.max(opts.length - 1, 0));
  const key = el.parentNode.getAttribute('data-key');
  box.innerHTML = opts.length ? opts.map((o, k) => '<div class="combo-opt' + (k === hi ? ' hi' : '') + (o.free ? ' free' : '') + '" onmousedown="event.preventDefault();App.comboPick(\'' + h(key) + '\',\'' + h(o.id) + '\',' + k + ',this)">' +
    '<span>' + h(o.label) + '</span><span class="m">' + h(o.meta) + '</span></div>').join('') : '<div class="combo-empty">Ничего не нашлось</div>';
  box.classList.add('open');
}
function fallbackCopy(t){
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  ta.remove();
}

/* ============================== СТАРТ ============================== */
(async function start(){
  if (!S.token) return renderLogin();
  cover(true);
  try { await reload(); cover(false); render(); }
  catch(e){ cover(false); if (S.token) { S.msg = null; renderLogin(e.message); } }
})();
})();
</script>
</body>
