/* ---------- Собрать ---------- */
VIEWS.tasks = function(){
  const t0 = todayYmd();
  const tasks = S.data.tasks;
  let html = '<div class="panel">' + title('Сборка', 'Позиции, которые хранятся у вас и должны уехать в другие места.');
  if (!tasks.length) return html + '<div class="empty">Сейчас собирать ничего не нужно</div></div>';
  const byDate = by(tasks, t => t.date);
  const day = (d, active) => {
    let x = '<h3 class="sec" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span>' + (d === t0 ? 'Сегодня, ' : '') + h(ruDay(d)) + '</span>' +
      (active ? '<button class="btn btn-secondary btn-sm" onclick="App.printTasks(\'' + d + '\')">Печать списка</button>' : '') + '</h3>';
    const byTo = by(byDate[d], t => t.to + '|' + t.invoice);
    Object.keys(byTo).sort().forEach(k => {
      const list = byTo[k], t1 = list[0];
      x += '<div style="margin:12px 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><b style="font-size:1rem">' + h(t1.to) + '</b><span class="muted small">Накладная ' + h(t1.invoice) + '</span>' + (t1.status === 'Отгружена' ? '<span class="chip st-Отгружена">Отгружено</span>' : '') + '</div>' +
        '<table class="t"><thead><tr><th>Позиция</th><th class="num">Количество</th><th class="num">В ед. учёта</th></tr></thead><tbody>' + list.map(t => '<tr><td>' + h(t.name) + '</td><td class="num" style="width:160px"><b>' + fmtN(t.qty) + '</b> ' + h(t.unit) + '</td><td class="num muted" style="width:120px">' + h(baseQty(t.itemId, t.unit, t.qty)) + '</td></tr>').join('') + '</tbody></table>';
    });
    return x;
  };
  const dates = Object.keys(byDate).sort();
  const fut = dates.filter(d => d >= t0), past = dates.filter(d => d < t0).reverse();
  if (!fut.length) html += '<div class="empty">Собирать ничего не нужно</div>';
  fut.forEach(d => { html += day(d, true); });
  if (past.length) html += '<details class="past"><summary>Прошедшие дни: ' + past.length + '</summary><div class="inner">' + past.map(d => day(d, false)).join('') + '</div></details>';
  return html + '</div>';
};

/* ---------- Перемещения / отчёт ---------- */
function mergeHist(d, hst){
  const have = {}; d.invoices.forEach(i => { have[i.no] = 1; });
  hst.invoices.forEach(i => { if (!have[i.no]) d.invoices.push(i); });
  const mv = {}; d.movements.forEach(m => { mv[m.no + '|' + m.itemId + '|' + m.name] = 1; });
  hst.movements.forEach(m => { if (!mv[m.no + '|' + m.itemId + '|' + m.name]) d.movements.push(m); });
  if (d.ledger && hst.ledger) { const lk = x => [x.date, x.place, x.itemId, x.delta, x.type, x.basis].join('|'); const L = {}; d.ledger.forEach(x => { L[lk(x)] = 1; }); hst.ledger.forEach(x => { if (!L[lk(x)]) d.ledger.push(x); }); }
}
// отчёт за период раньше загруженного окна — догружаем историю с сервера
async function ensureHistory(from){
  const since = S.data.since;
  if (!since || from >= since || (S.hist && S.hist.from <= from)) return;
  cover(true);
  try { const r = await api('history', { from: from, to: since }); S.hist = r; mergeHist(S.data, r); }
  catch(e) { S.msg = { kind: 'err', text: e.message }; }
  finally { cover(false); render(); }
}
function movFiltered(){
  const F = S.mov;

    (!q || (m.name + ' ' + m.no + ' ' + m.category).toLowerCase().indexOf(q) >= 0));
}

/* ---------- Места: рестораны, склад, офис, поставщики ---------- */
const PLACE_TYPES = ['Ресторан','Склад','Офис','Поставщик'];
const DAY_ORDER = ['пн','вт','ср','чт','пт','сб','вс'];
function daysSet(v){
  const t = str(v).toLowerCase().replace(/[–—]/g, '-');
  if (/ежеднев|каждый|все дни/.test(t)) return DAY_ORDER.slice();
  const out = [];
  t.split(/[,;\s]+/).filter(Boolean).forEach(tok => {
    const m = tok.split('-').filter(Boolean);
    if (m.length === 2) { let a = DAY_ORDER.indexOf(m[0].slice(0, 2)), b = DAY_ORDER.indexOf(m[1].slice(0, 2)); if (a < 0 || b < 0) return; for (let k = 0; k < 7; k++) { const d = DAY_ORDER[(a + k) % 7]; if (out.indexOf(d) < 0) out.push(d); if ((a + k) % 7 === b) break; } }
    else { const d = DAY_ORDER.indexOf(tok.slice(0, 2)); if (d >= 0 && out.indexOf(DAY_ORDER[d]) < 0) out.push(DAY_ORDER[d]); }
  });
  return out;
}
function daysStr(set){
  if (set.length === 7) return 'ежедневно';
  return DAY_ORDER.filter(d => set.indexOf(d) >= 0).map(d => d[0].toUpperCase() + d[1]).join(', ');
}
function schedText(p){
  if (!p.days) return '';
  p = Object.assign({}, p, { days: daysStr(daysSet(p.days)) || p.days });
  return p.days + ', заказ ' + (num(p.lead) === 0 ? 'в день поставки' : 'за ' + plural(num(p.lead), 'день', 'дня', 'дней')) + ' до ' + (p.time || '16:00');
}
function placeForm(p){
  if (!p) return { isNew: true, name: '', type: 'Поставщик', code: '', invoiceName: '', responsible: '', address: '', phone: '', days: '', lead: '1', time: '16:00', contact: '', active: true };
  return Object.assign({ isNew: false }, p, { lead: p.lead === '' ? '1' : p.lead, time: p.time || '16:00' });
}

// «3 уп. 450 г» → «1,35 кг». Пусто, если фасовка неизвестна или совпадает с единицей учёта.
function baseFactorC(it, unitName){
  if (!it) return null;
  const p = (it.packs || []).find(x => x.name === unitName);
  return p && p.amount ? p.amount : (unitName === (it.baseUnit || it.unit) ? 1 : (unitName === it.unit ? (it.base || 1) : null));
}
function baseQtyNum(itemId, unitName, qty){ const f = baseFactorC(itemById(itemId), unitName); return f === null || qty === null || qty === undefined ? null : Math.round(qty * f * 1000) / 1000; }
function baseQty(itemId, unitName, qty){
  const v = baseQtyNum(itemId, unitName, qty), it = itemById(itemId);
  return v === null ? '' : fmtN(v) + ' ' + (it.baseUnit || it.unit);
}

// Расход по инвентаризации: у ресторана остаток растёт при приёмке и уменьшается только инвентаризацией,
// поэтому «было − стало» за период = фактический расход.
function consumption(){
  const F = S.mov, L = (S.data.ledger || []).filter(x => x.type === 'Инвентаризация' && (place(x.place) || {}).type === 'Ресторан' && x.date >= F.from && x.date <= F.to && (!F.dst || x.place === F.dst) &&
    (!F.q || x.name.toLowerCase().indexOf(F.q.toLowerCase()) >= 0));
  const places = uniq(L.map(x => x.place)).sort(), piv = {};
  L.forEach(x => { const k = x.itemId || x.name; const r = piv[k] = piv[k] || { name: x.name, unit: x.unit, by: {} }; r.by[x.place] = (r.by[x.place] || 0) - x.delta; });
  return { places, rows: Object.values(piv).sort((a,b) => a.name.localeCompare(b.name)) };
}
/* ============================== EXCEL ============================== */
// Библиотеку Excel (≈1 МБ) грузим только когда нажали «Скачать Excel», а не при каждом открытии страницы
function loadXlsx(){
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = () => fail(new Error('Не удалось загрузить библиотеку Excel')); document.head.appendChild(s); });
}
async function exportExcel(){
  try { cover(true); await loadXlsx(); } catch(e) { S.msg = { kind: 'err', text: e.message }; return render(); } finally { cover(false); }
  const list = movFiltered().sort((a,b) => a.date.localeCompare(b.date) || a.no.localeCompare(b.no));
  const rows = list.map(m => ({ 'Дата': ru(m.date), '№ накладной': m.no, 'Тип': m.type, 'Откуда': m.from, 'Куда': m.to, 'ID позиции': m.itemId, 'Наименование': m.name, 'Категория': m.category, 'Ед. изм.': m.unit, 'Количество': m.qty, 'Кол-во в ед. учёта': baseQtyNum(m.itemId, m.unit, m.qty) === null ? '' : baseQtyNum(m.itemId, m.unit, m.qty), 'Ед. учёта': (itemById(m.itemId) || {}).baseUnit || '' }));
  const dsts = uniq(list.map(m => m.to)).sort();
  const piv = {};
  list.forEach(m => { const k = m.name + '|' + m.unit; const r = piv[k] = piv[k] || { 'Позиция': m.name, 'Ед. изм.': m.unit }; r[m.to] = (r[m.to] || 0) + m.qty; });
  const pivRows = Object.values(piv).sort((a,b) => a['Позиция'].localeCompare(b['Позиция'])).map(r => { let t = 0; dsts.forEach(d => { r[d] = r[d] || 0; t += r[d]; }); r['Итого'] = t; return r; });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Перемещения');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pivRows, { header: ['Позиция','Ед. изм.'].concat(dsts, ['Итого']) }), 'Свод по ресторанам');
  const C = consumption();
  if (C.rows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(C.rows.map(r => { const o = { 'Позиция': r.name, 'Ед. учёта': r.unit }; let t = 0; C.places.forEach(d => { o[d] = r.by[d] || 0; t += o[d]; }); o['Итого'] = t; return o; }),
    { header: ['Позиция','Ед. учёта'].concat(C.places, ['Итого']) }), 'Расход по инвентаризации');
  XLSX.writeFile(wb, 'Перемещения_' + S.mov.from + '_' + S.mov.to + '.xlsx');
}

function roundUp(id, v){
  const it = itemById(id);
  let x = num(v);
  if (x <= 0) return '';
  const m = it ? it.mult || 1 : 1;
  x = Math.ceil(Math.round(x / m * 1000) / 1000) * m;
  return x;
}
function keepFocus(fn){
  const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
  fn();
  if (id) { const e = document.getElementById(id); if (e) { e.focus(); try { e.setSelectionRange(pos, pos); } catch(_){} } }
}

window.App = {
  refresh: () => run(reload, 'Обновлено'),
  logout: () => logout(false),
  sec(id){ const s = sections().find(x => x.id === id); if (!s) return; S.lastSub = S.lastSub || {}; const t = S.lastSub[id] && s.subs.some(x => x.id === S.lastSub[id]) ? S.lastSub[id] : s.subs[0].id; App.tab(t); },

  // заказ ресторана
  cq(v){ S.cart.q = v; keepFocus(render); },
  cset(id, v){ const x = roundUp(id, v); S.cart.qty[id] = x || ''; S.cart.dirty[id] = true; render(); },
  cstep(id, d){ const it = itemById(id); const m = it ? it.mult || 1 : 1; const x = Math.max(0, num(S.cart.qty[id]) + d * m); S.cart.qty[id] = x || ''; S.cart.dirty[id] = true; render(); },
  cfree(k, f, v){ S.cart.free[k][f] = f === 'qty' ? (num(v) || '') : v; S.cart.freeDirty = true; render(); },

  cfreeDel(k){ S.cart.free.splice(k, 1); S.cart.freeDirty = true; render(); },
  ccomment(v){ S.cart.comment = v; const b = document.getElementById('cart-save'); if (b && str(v)) b.disabled = false; },
  jump(id){ const el = document.getElementById(id); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' }); },
  cartReset(){ S.cart = null; render(); },

  supLine(lineId, k, v){

  },
  supItem(key, k, v){
    const s = supplies().find(x => x.key === S.inbox.sup); if (!s) return;
    s.reqs.forEach(r => { if (['Отправлена','На проверке'].indexOf(r.status) < 0) return; linesOf(r.id).forEach(l => {
      if ((l.itemId || '') + '|' + l.name !== key) return;
      const e = S.sup.lines[l.lineId]; e[k] = v;
      if (k === 'pack') { const it = itemById(l.itemId); const p = it && it.packs ? it.packs.find(x => x.name === v) : null; if (p && p.supplier) e.from = p.supplier; }

  supReturn(id){
    const r = S.data.requests.find(x => x.id === id);

    if (why === null) return;
    if (!str(why)) { S.msg = { kind: 'err', text: 'Напишите, что нужно исправить' }; render(); return window.scrollTo({ top: 0, behavior: 'smooth' }); }
    run(async () => { await api('reviewRequest', { id: id, updatedAt: r.updatedAt, decision: 'return', purchaseComment: str(why) }); S.sup = null; await reload(); }, 'Заявка ' + r.place + ' возвращена ресторану');
  },
  supSave(approve){
    const s = supplies().find(x => x.key === S.inbox.sup); if (!s) return;
    const E = S.sup, lines = [], versions = {};
    s.reqs.filter(r => ['Отправлена','На проверке'].indexOf(r.status) >= 0).forEach(r => {
      versions[r.id] = r.updatedAt;
      linesOf(r.id).forEach(l => { const e = E.lines[l.lineId]; lines.push({ lineId: l.lineId, approved: e.approved, comment: e.comment, pack: e.pack, from: e.from }); });
    });
    // Сохраняем в фоне: сразу показываем результат, Таня работает дальше, ответ сервера догоняет.
    const label = srcLabel(s.source) + ', ' + ruDay(s.date);
    Object.keys(versions).forEach(id => {
      const r = S.data.requests.find(x => x.id === id);
      if (r) { r.status = approve ? 'Утверждена' : 'На проверке'; r.updatedAt = r.updatedAt + '~'; }
      linesOf(id).forEach(l => { const e = E.lines[l.lineId]; if (!e) return; l.approved = str(e.approved) === '' ? null : num(e.approved); l.comment = e.comment; l.pack = e.pack; l.from = e.from; });
    });
    S.sup = null;
    S.msg = { kind: 'info', text: (approve ? 'Утверждаем поставку ' : 'Сохраняем поставку ') + label + '. Можно работать дальше.' };
    bgSave('saveSupply', { lines: lines, versions: versions, approve: approve }, res => {
      const ok = res.results.filter(x => x.ok), bad = res.results.filter(x => !x.ok);
      return { kind: bad.length ? 'warn' : 'ok', text: (approve ? 'Поставка утверждена: ' : 'Поставка сохранена: ') + label +
        (bad.length ? '\nНе прошли: ' + bad.map(x => x.place + ': ' + x.error).join('; ') : '') };
    }, 'Поставка ' + label + ' не сохранена');
    render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  },

    const f = S.cat.f;
    const body = { id: f.id, name: str(f.name), category: f.category, newCategory: str(f.newCategory), unit: str(f.unit), mult: num(f.mult), from: f.from, newSupplier: str(f.newSupplier),
                   responsible: f.responsible, order: str(f.order), active: !!f.active, comment: str(f.comment), baseUnit: str(f.baseUnit), base: num(f.base),
                   packs: f.packs.map(p => ({ id: p.id, name: str(p.name), amount: num(p.amount), supplier: p.supplier, isDefault: !!p.isDefault, active: p.active !== false })) };
    run(async () => {
      const r = await api('saveItem', body);
      await reload();
      S.cat.sel = r.id; S.cat.f = catForm(itemById(r.id));
      return r;
    }, () => f.id ? 'Сохранено' : 'Позиция «' + str(f.name) + '» добавлена в справочник');
  },
  // места
  plNew(){ S.plc.sel = null; S.plc.f = placeForm(null); S.msg = null; render(); showDetail(); },
  plSel(name){ S.plc.sel = name; S.plc.f = placeForm(place(name)); S.msg = null; render(); showDetail(); },
  plF(k, v, rerender){ S.plc.f[k] = v; if (rerender) render(); },
  plDay(d){
    const f = S.plc.f;
    let set = daysSet(f.days);
    if (d === 'all') set = set.length === 7 ? [] : DAY_ORDER.slice();
    else set = set.indexOf(d) >= 0 ? set.filter(x => x !== d) : set.concat([d]);
    f.days = daysStr(set); render();
  },
  plCancel(){ S.plc.sel = null; S.plc.f = null; render(); },
  plSave(){
    const f = S.plc.f;
    run(async () => {
      const r = await api('savePlace', { isNew: f.isNew, name: str(f.name), type: f.type, code: str(f.code), invoiceName: str(f.invoiceName), responsible: f.responsible,
        address: str(f.address), phone: str(f.phone), days: str(f.days), lead: str(f.lead), time: str(f.time), contact: str(f.contact), active: f.active !== false });
      await reload();
      S.plc.sel = r.name; S.plc.f = placeForm(place(r.name));
      return r;
    }, () => f.isNew ? 'Добавлено' : 'Сохранено');
  },

  // поиск позиции
  comboIn(el){ el.setAttribute('data-hi', 0); comboDraw(el); },
  comboKey(e, el){
    const n = comboOpts(el).length; let hi = Number(el.getAttribute('data-hi') || 0);
    if (e.key === 'ArrowDown'){ e.preventDefault(); el.setAttribute('data-hi', Math.min(hi + 1, n - 1)); comboDraw(el); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); el.setAttribute('data-hi', Math.max(hi - 1, 0)); comboDraw(el); }
    else if (e.key === 'Enter'){ e.preventDefault(); const o = comboOpts(el)[hi]; if (o) App.comboPick(el.parentNode.getAttribute('data-key'), o.id, hi, el); }
    else if (e.key === 'Escape'){ el.blur(); }
  },
  comboBlur(el){ setTimeout(() => { const b = el.parentNode && el.parentNode.querySelector('.combo-list'); if (b) b.classList.remove('open'); }, 120); },
  comboPick(key, id, k, node){
    const input = node.closest('.combo').querySelector('input');
    const typed = input.value.trim();
    if (key === 'ed') {
      const it = itemById(id); if (!it) return;
      const dp = (it.packs || []).find(p => p.isDefault && p.active) || (it.packs || []).find(p => p.active);
      S.ed.added.push({ itemId: id, approved: '', from: it.source || it.from || '', pack: dp ? dp.name : '' });
    } else if (key === 'rf') {
      const it = itemById(id); if (!it) return;
      if (!S.form.lines.some(l => l.itemId === id)) S.form.lines.push({ itemId: id, name: it.name, unit: it.unitLabel || it.unit, qty: '' });
      if (!S.form.source && it.source) S.form.source = it.source;
    } else if (key.indexOf('tr:') === 0) {
      const l = S.tr.lines[Number(key.slice(3))];
      if (id === '__free') { l.itemId = '__free'; l.name = typed; l.unit = l.unit || 'шт'; }
      else { const it = itemById(id); l.itemId = id; l.unit = it ? it.unit : 'шт'; l.name = ''; }
      S.justCreated = null;
    }
    render();
    if (key.indexOf('tr:') === 0) { const q = document.querySelectorAll('.free-row input[inputmode=decimal]')[Number(key.slice(3))]; if (q) q.focus(); }
  },
  print: printInvoices,
  printTasks: printTasks,
  preview: previewInvoices,
  pvClose(){ $('#preview-root').innerHTML = ''; document.body.style.overflow = ''; },
  pvPrint(){ const nos = JSON.parse($('#preview-root').getAttribute('data-nos') || '[]'); printInvoices(nos); },
  excel: exportExcel
};

function comboOpts(el){
  const key = el.parentNode.getAttribute('data-key');
  const q = el.value.trim();
  const list = comboMatch(q).slice(0, 10);
  const opts = list.map(i => ({ id: i.id, label: i.name, meta: (i.unitLabel || i.unit) + (i.mult > 1 ? ', кратно ' + fmtN(i.mult) : '') + (i.source ? ', ' + i.source : '') }));
  if (key.indexOf('tr:') === 0 && q) opts.push({ id: '__free', label: 'Другое: «' + q + '»', meta: '', free: true });
  return opts;
}
function comboDraw(el){
  const box = el.parentNode.querySelector('.combo-list');
  const opts = comboOpts(el);
  const hi = Math.min(Number(el.getAttribute('data-hi') || 0), Math.max(opts.length - 1, 0));
  const key = el.parentNode.getAttribute('data-key');
  box.innerHTML = opts.length ? opts.map((o, k) => '<div class="combo-opt' + (k === hi ? ' hi' : '') + (o.free ? ' free' : '') + '" onmousedown="event.preventDefault();App.comboPick(\'' + h(key) + '\',\'' + h(o.id) + '\',' + k + ',this)">' +
    '<span>' + h(o.label) + '</span><span class="m">' + h(o.meta) + '</span></div>').join('') : '<div class="combo-empty">Ничего не нашлось</div>';
  box.classList.add('open');
}
function fallbackCopy(t){
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  ta.remove();
}

/* ============================== ФОНОВОЕ СОХРАНЕНИЕ ============================== */
// Запрос уходит в фоне. Свежие данные применяем от последнего завершившегося запроса.
function bgSave(action, payload, okMsg, errPrefix){
  S.bg = (S.bg || 0) + 1;
  api(action, payload).then(res => {
    const d = S.pendingData; S.pendingData = null;
    S.bg--;
    if (d) applyData(d);
    S.msg = okMsg(res);
    renderWhenIdle();
  }).catch(e => {
    S.bg--;
    S.msg = { kind: 'err', text: errPrefix + ': ' + e.message + '. Данные обновлены, проверьте и повторите.' };
    reload().then(renderWhenIdle, renderWhenIdle);
  });
}
window.addEventListener('beforeunload', e => { if (S.bg > 0) { e.preventDefault(); e.returnValue = ''; } });

/* ============================== СТАРТ ============================== */
(async function start(){
  if (!S.token) return renderLogin();
  const cached = loadDataCache();
  if (cached) {
    // показываем то, что было в прошлый раз, и тихо подгружаем свежее
    applyData(cached); S.syncing = true; render();
    try { const d = await api('bootstrap'); S.syncing = false; applyData(d); renderWhenIdle(); }
    catch(e){ S.syncing = false; if (!S.token) return; S.msg = { kind: 'warn', text: 'Не удалось обновить данные: ' + e.message + '. Показаны сохранённые, нажмите «Обновить».' }; render(); }
    return;
  }
  cover(true);
  try { await reload(); cover(false); render(); }
  catch(e){ cover(false); if (S.token) { S.msg = null; renderLogin(e.message); } }
})();
// не перерисовываем, пока человек печатает в поле — дождёмся, когда уйдёт из него
function renderWhenIdle(){
  const a = document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.closest('#app')) { a.addEventListener('blur', () => setTimeout(render, 0), { once: true }); return; }
  render();
}
})();
</script>
