<!--
  Salateira · Заявки на расходники (zayavki.html)
  Версия 2.1

  2.1 — время приёма без «1899 года»; дни поставки — переключатели по дням недели; «Собрать»:
        печать списка на день, прошедшие дни свёрнуты внизу; после действий страница поднимается
        к сообщению, выбор слева сразу показывает карточку; у закупок понятнее «Утвердить» и
        «Сохранить правки»; в «Сообщениях» и «Своде» даты — плитками с тем, что в них есть;
        короче подсказки в полях, подсказка светлее введённого текста.
  2.0 — поставщики и графики. Ресторан: вкладка «Заказ» — заказывает каждый день, каждая позиция
        сама уходит в ближайшую поставку (видна дата и время приёма), «Как в прошлый раз»;
        источники ресторану не видны. Закупки: заявки сгруппированы по источнику и дате,
        фасовка в строке заявки (поставщик фасовки становится источником), «Заявка вручную»
        (в т.ч. на склад), «Сообщения» — водителю и каждому поставщику (с адресами и телефонами),
        раздел «Места» с графиками, в справочнике — фасовки, новая категория/поставщик на месте.
        Нужен Code.gs ≥ 2.0.0.
  1.7 — компактная форма заявки: позиции в две колонки на широком экране, плотнее строки,
        количество рядом с названием; в накладной «Отпустил» вместо «Сдал».
  1.6 — корректировка утверждённой заявки (количество/комментарий, номера накладных
        сохраняются); пометка «больше обычного» у Тани; «Как в прошлый раз» в новой
        заявке. Нужен Code.gs ≥ 1.4.0.
  1.5 — «Просмотреть» у накладных: предпросмотр листов A4 прямо на странице,
        оттуда — печать или «Сохранить как PDF».
  1.4 — подключение Telegram со страницы убрано: ID вносит администратор в таблицу.
  1.3 — Telegram: кнопка «Подключить Telegram» в шапке (ссылка на бота с одноразовым
        кодом → «Проверить»), отключение. Нужен Code.gs ≥ 1.3.0.
  1.2 — накладная: подписи «Сдал» / «Принял» (без «Администратор» — отпускает
        и офис); таблица без пустых строк — ровно столько строк, сколько позиций.
  1.1 — фиолетовая палитра (#7002FF); «Взять в работу» продублирована вверху
        заявки; поиск позиции по первым буквам в перемещениях и при добавлении
        позиции закупками; вкладка «Справочник» — закупки добавляют и правят
        позиции прямо со страницы (нужен Code.gs ≥ 1.2.0); тексты по правкам.
  1.0 — первая версия. Вход по логину/паролю (учётки в Google Таблице).
        Ресторан: новая заявка по категориям с кратностью и прошлым заказом,
        мои заявки с «было → стало» и комментариями закупок, отзыв заявки,
        «Собрать» (что отдать другим), перемещение в другой ресторан, накладные.
        Закупки: входящие заявки, «Взять в работу», правка количеств/источника/
        комментариев, возврат, утверждение (накладные создаются сами), свод по
        позициям на дату, сообщение водителю, отметка «отгружено».
        Водитель: маршрут на дату. Экономист: перемещения за период, свод по
        ресторанам, выгрузка в Excel, печать накладных пачкой.
        Бэкенд: Code.gs ≥ 1.1.0.
-->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salateira · Заявки на расходники</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237002FF'/%3E%3Ctext x='32' y='45' font-family='Arial, Helvetica, sans-serif' font-weight='800' font-size='38' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
  :root{
    --accent:#7002FF; --accent-dark:#5300C2; --accent-soft:#F2EAFF; --accent-line:#D9C6FF;
    --ink:#1A1433; --muted:#6B6582; --line:#E3DEF0; --bg:#F7F5FC; --hover:#FAF8FE;
    --ok:#0F8F62; --ok-soft:#E5F5EE;
    --red:#D6304A; --red-soft:#FCEBEE; --amber:#A8650B; --amber-soft:#FDF2E1;
    --blue:#3B4FD8; --blue-soft:#ECEFFE; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:'Manrope', system-ui, sans-serif; background:var(--bg); color:var(--ink); line-height:1.45; -webkit-font-smoothing:antialiased; }
  .app{ max-width:1220px; margin:0 auto; padding:24px 24px 80px; }
  @media (max-width:600px){ .app{ padding:16px 16px 60px; } }

  header.top{ display:flex; align-items:center; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  .logo-mark{ height:24px; width:auto; display:block; flex:0 0 auto; }
  header.top h1{ font-size:1.25rem; font-weight:800; margin:0; letter-spacing:-0.01em; }
  header.top .sub{ font-size:0.83rem; color:var(--muted); margin-top:2px; }
  .sync{ margin-left:auto; font-size:0.78rem; color:var(--muted); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .version-tag{ font-size:0.7rem; color:var(--accent-dark); background:var(--accent-soft); border-radius:999px; padding:3px 9px; }

  .tabs{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .tab-btn{ font-family:inherit; font-size:0.86rem; font-weight:600; padding:9px 16px; border-radius:999px; border:1.5px solid var(--line); background:#fff; color:var(--muted); cursor:pointer; }
  .tab-btn.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .tab-btn:not(.active):hover{ border-color:var(--accent); color:var(--ink); }
  .tab-btn .cnt{ display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:999px; background:var(--red); color:#fff; font-size:0.7rem; line-height:18px; text-align:center; }

  .panel{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:20px; }
  .panel + .panel{ margin-top:16px; }
  h2.panel-title{ font-size:1rem; font-weight:700; margin:0 0 14px; }
  h3.sec{ font-size:0.8rem; font-weight:700; color:var(--accent-dark); margin:14px 0 4px; padding-bottom:6px; border-bottom:1px solid var(--line); text-transform:uppercase; letter-spacing:0.03em; }
  .muted{ color:var(--muted); }
  .small{ font-size:0.8rem; }
  .split{ display:grid; grid-template-columns:minmax(320px, 420px) 1fr; gap:18px; align-items:start; }
  .split.wide{ grid-template-columns:minmax(260px, 310px) 1fr; }
  @media (max-width:960px){ .split, .split.wide{ grid-template-columns:1fr; } }
  table.ed-t{ min-width:860px; }
  table.ed-t select{ min-width:120px; }

  .btn{ font-family:inherit; font-size:0.86rem; font-weight:700; padding:9px 16px; border-radius:8px; border:1.5px solid transparent; cursor:pointer; white-space:nowrap; }
  .btn:disabled{ opacity:0.5; cursor:default; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover:not(:disabled){ background:var(--accent-dark); }
  .btn-secondary{ background:#fff; border-color:var(--line); color:var(--ink); }
  .btn-secondary:hover:not(:disabled){ border-color:var(--accent); }
  .btn-danger{ background:#fff; border-color:#F2C4CA; color:var(--red); }
  .btn-danger:hover:not(:disabled){ background:var(--red-soft); }
  .btn-sm{ padding:5px 10px; font-size:0.78rem; }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }

  .field{ display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
  .field label{ font-size:0.75rem; font-weight:700; color:var(--muted); }
  input[type=text], input[type=password], input[type=number], input[type=date], input[type=time], select, textarea{
    font-family:inherit; font-size:0.9rem; color:var(--ink); background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; outline:none; width:100%;
  }
  input:focus, select:focus, textarea:focus{ border-color:var(--accent); }
  input::placeholder, textarea::placeholder{ color:#BEB8CE; opacity:1; }
  input:disabled, select:disabled, textarea:disabled{ background:#F4F2F9; color:#9E98B0; border-color:#ECE8F4; cursor:not-allowed; }
  .days{ display:flex; gap:6px; flex-wrap:wrap; }
  .days button{ font-family:inherit; font-size:0.84rem; font-weight:700; min-width:44px; padding:7px 10px; border-radius:8px; border:1.5px solid var(--line); background:#fff; color:var(--muted); cursor:pointer; }
  .days button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .days button.all{ margin-left:6px; }
  .dates{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .dates .dt{ border:1.5px solid var(--line); border-radius:10px; padding:7px 11px; background:#fff; cursor:pointer; text-align:left; font-family:inherit; min-width:120px; }
  .dates .dt b{ display:block; font-size:0.9rem; }
  .dates .dt span{ display:block; font-size:0.72rem; color:var(--muted); line-height:1.3; }
  .dates .dt.on{ border-color:var(--accent); background:var(--accent-soft); }
  .dates .dt .warn{ color:var(--amber); }
  details.past{ margin-top:18px; }
  details.past summary{ cursor:pointer; font-size:0.82rem; font-weight:700; color:var(--muted); }
  details.past .inner{ opacity:0.55; }
  .ptask h2{ font-size:15pt; text-align:left; margin:0 0 4px; }
  .ptask h3{ font-size:12pt; margin:14px 0 4px; }
  .ptask td.chk{ width:16mm; }
  textarea{ resize:vertical; min-height:60px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row > .field{ flex:1 1 160px; }

  .msg{ font-size:0.85rem; padding:10px 12px; border-radius:8px; margin:10px 0; white-space:pre-line; }
  .msg.err{ background:var(--red-soft); color:#9B1C2C; }
  .msg.ok{ background:var(--ok-soft); color:var(--ok); }
  .msg.warn{ background:var(--amber-soft); color:#7A4E0E; }
  .msg.info{ background:var(--blue-soft); color:#1E4E80; }

  table.t{ width:100%; border-collapse:collapse; font-size:0.86rem; }
  table.t th{ text-align:left; font-size:0.72rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; padding:8px 8px; border-bottom:1.5px solid var(--line); white-space:nowrap; }
  table.t td{ padding:7px 8px; border-bottom:1px solid #EFECF6; vertical-align:middle; }
  table.t tr.click{ cursor:pointer; }
  table.t tr.click:hover td{ background:var(--hover); }
  table.t tr.sel td{ background:var(--accent-soft); }
  table.t td.num, table.t th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  table.t tfoot td{ font-weight:800; border-top:1.5px solid var(--line); }
  .t-wrap{ overflow-x:auto; }

  .chip{ display:inline-block; font-size:0.72rem; font-weight:700; padding:2px 9px; border-radius:999px; white-space:nowrap; }
  .st-Черновик{ background:#EFECF6; color:var(--muted); }
  .st-Отправлена{ background:var(--accent-soft); color:var(--accent-dark); }
  .st-На-проверке{ background:var(--amber-soft); color:var(--amber); }
  .st-Возвращена{ background:var(--red-soft); color:var(--red); }
  .st-Утверждена{ background:var(--ok-soft); color:var(--ok); }
  .st-Отгружена{ background:#E9E6F1; color:#4A4560; }
  .chip.late{ background:var(--red-soft); color:var(--red); }

  .items-grid{ display:grid; grid-template-columns:1fr 1fr; column-gap:36px; }
  @media (max-width:1000px){ .items-grid{ grid-template-columns:1fr; } }
  .item-row{ display:grid; grid-template-columns:1fr 70px 124px; gap:8px; align-items:center; padding:4px 0; border-bottom:1px solid #EFECF6; min-height:44px; }
  .item-row:last-child{ border-bottom:none; }
  @media (min-width:1001px){ .items-grid .item-row:nth-last-child(2):nth-child(odd){ border-bottom:none; } }
  .item-row .nm{ font-weight:600; font-size:0.88rem; line-height:1.25; }
  .item-row .meta{ font-size:0.72rem; color:var(--muted); line-height:1.2; }
  .item-row .prev{ font-size:0.78rem; color:var(--muted); text-align:right; }
  .item-row .note{ font-size:0.76rem; color:var(--red); }
  .qty{ display:flex; align-items:center; gap:4px; }
  .qty button{ width:28px; height:30px; border:1.5px solid var(--line); background:#fff; border-radius:8px; font-weight:800; font-size:1rem; color:var(--accent-dark); cursor:pointer; flex:0 0 auto; }
  .qty button:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .qty input{ text-align:center; padding:4px; height:30px; }
  .item-row.has-qty .nm{ color:var(--accent-dark); }
  @media (max-width:600px){ .item-row{ grid-template-columns:1fr 124px; } .item-row .prev{ grid-column:1; text-align:left; } }

  .free-row{ display:grid; grid-template-columns:1fr 80px 90px 34px; gap:8px; margin-bottom:6px; }
  .x-btn{ border:1.5px solid var(--line); background:#fff; border-radius:8px; cursor:pointer; color:var(--red); font-weight:800; }

  .combo{ position:relative; }
  .combo-list{ position:absolute; left:0; right:0; top:100%; margin-top:4px; z-index:30; background:#fff; border:1.5px solid var(--accent-line); border-radius:8px; box-shadow:0 8px 24px rgba(40,20,90,0.12); max-height:290px; overflow:auto; display:none; }
  .combo-list.open{ display:block; }
  .combo-opt{ padding:8px 10px; cursor:pointer; font-size:0.88rem; display:flex; justify-content:space-between; gap:10px; }
  .combo-opt .m{ color:var(--muted); font-size:0.75rem; white-space:nowrap; }
  .combo-opt.hi, .combo-opt:hover{ background:var(--accent-soft); }
  .combo-opt.free{ color:var(--accent-dark); font-weight:600; border-top:1px solid var(--line); }
  .combo-empty{ padding:8px 10px; font-size:0.82rem; color:var(--muted); }
  .chk{ display:flex; align-items:center; gap:8px; font-size:0.88rem; font-weight:600; margin:4px 0 12px; }
  .chk input{ width:18px; height:18px; accent-color:var(--accent); }
  .diff-down{ color:var(--red); font-weight:700; }
  .diff-up{ color:var(--ok); font-weight:700; }
  .card-list{ display:flex; flex-direction:column; gap:8px; }
  .card{ border:1.5px solid var(--line); border-radius:var(--radius); padding:10px 12px; cursor:pointer; background:#fff; }
  .card:hover{ border-color:var(--accent); }
  .card.sel{ border-color:var(--accent); background:var(--accent-soft); }
  .card .top{ display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .card .title{ font-weight:700; }
  .empty{ color:var(--muted); font-size:0.88rem; padding:18px 0; text-align:center; }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:0.86rem; margin-bottom:10px; }
  .kv dt{ color:var(--muted); }
  .kv dd{ margin:0; }
  pre.msgtext{ font-family:inherit; font-size:0.88rem; background:var(--hover); border:1px solid var(--line); border-radius:8px; padding:12px; white-space:pre-wrap; margin:0; }

  .login-wrap{ max-width:380px; margin:8vh auto 0; }
  .login-wrap .panel{ padding:26px; }
  .spinner{ display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:-2px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-cover{ position:fixed; inset:0; background:rgba(247,245,252,0.65); display:flex; align-items:center; justify-content:center; z-index:50; font-weight:700; gap:10px; }

  /* ---------- Печать накладных ---------- */
  #print-root{ display:none; }
  .inv{ font-family:'Times New Roman', Times, serif; color:#000; font-size:13pt; line-height:1.35; }
  @media print{
    @page{ size:A4; margin:16mm 16mm 18mm; }
    body{ background:#fff; }
    .app, .loading-cover, #preview-root{ display:none !important; }
    #print-root{ display:block; }
    .inv{ page-break-after:always; break-after:page; }
    .inv:last-child{ page-break-after:auto; break-after:auto; }
  }

  /* ---------- Предпросмотр накладных ---------- */
  .pv-overlay{ position:fixed; inset:0; z-index:60; background:rgba(26,20,51,0.72); display:flex; flex-direction:column; }
  .pv-bar{ display:flex; align-items:center; gap:10px; padding:12px 20px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .pv-bar .t{ font-weight:800; margin-right:auto; }
  .pv-pages{ flex:1; overflow:auto; padding:24px 16px 40px; display:flex; flex-direction:column; align-items:center; gap:20px; }
  .pv-page{ background:#fff; width:210mm; max-width:100%; min-height:297mm; padding:16mm 16mm 18mm; box-shadow:0 6px 30px rgba(0,0,0,0.35); }
  @media (max-width:820px){ .pv-page{ min-height:0; padding:18px; } .inv{ font-size:11pt; } }
  .inv .org{ font-weight:700; }
  .inv .date{ margin-top:4px; }
  .inv h2{ text-align:center; font-size:15pt; margin:18px 0 4px; }
  .inv .no{ text-align:center; font-weight:700; font-size:14pt; margin-bottom:14px; }
  .inv .parties{ display:flex; justify-content:space-between; margin-bottom:12px; }
  .inv table{ width:100%; border-collapse:collapse; }
  .inv th, .inv td{ border:1px solid #000; padding:4px 6px; height:22px; }
  .inv th{ font-weight:700; text-align:center; }
  .inv td.c{ text-align:center; }
  .inv .sign{ margin-top:26px; line-height:2.4; }
  .inv .basis{ font-size:10pt; margin-top:6px; }
</style>
</head>
<body>
<div id="print-root" aria-hidden="true"></div>
<div id="preview-root"></div>
<div class="app" id="app"></div>

<script>
(function(){
'use strict';

const TOKEN_KEY = 'slt_zayavki_token';
const WD = ['вс','пн','вт','ср','чт','пт','сб'];

/* ============================== СОСТОЯНИЕ ============================== */
// localStorage — только чтобы не вводить пароль каждый раз; все данные живут в Таблице.
const store = {
  get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } },
  set(k,v){ try { localStorage.setItem(k, v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const S = {
  token: store.get(TOKEN_KEY), data: null, tab: null, busy: false, msg: null,
  form: null,          // новая/редактируемая заявка
  mineSel: null,       // выбранная заявка в «Мои заявки»
  inbox: { date: '', src: '*', status: 'active', sel: null },
  cart: null,          // заказ ресторана
  plc: { sel: null, f: null },   // места
  msgTab: 'driver',
  ed: null,            // редактор закупок
  sumDate: '', drvDate: '',
  tr: null,            // перемещение
  inv: { from: '', to: '', q: '', checked: {} },
  mov: { from: '', to: '', src: '', dst: '', type: '', q: '' },
  cat: { q: '', sel: null, f: null },   // справочник позиций
  justCreated: null
};

/* ============================== УТИЛИТЫ ============================== */
const $ = (sel) => document.querySelector(sel);
function h(v){ return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function str(v){ return v === null || v === undefined ? '' : String(v).trim(); }
function num(v){ const x = Number(String(v === null || v === undefined ? '' : v).replace(',', '.').replace(/\s/g,'')); return isFinite(x) ? x : 0; }
function fmtN(x){ return (Math.round(x * 1000) / 1000).toLocaleString('ru-RU'); }
function ru(d){ if (!d) return ''; const p = d.slice(0,10).split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
function ruShort(d){ if (!d) return ''; const p = d.split('-'); return p[2] + '.' + p[1]; }
function wd(d){ const p = d.split('-').map(Number); return WD[new Date(Date.UTC(p[0], p[1]-1, p[2], 12)).getUTCDay()]; }
function ruDay(d){ return d ? wd(d) + ' ' + ruShort(d) : ''; }
function ruDT(dt){ return dt ? ru(dt) + ' ' + dt.slice(11,16) : ''; }
function todayYmd(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addDays(d, k){ const p = d.split('-').map(Number); const x = new Date(Date.UTC(p[0], p[1]-1, p[2]+k, 12)); return x.toISOString().slice(0,10); }
function chip(st){ return '<span class="chip st-' + h(st.replace(/\s/g,'-')) + '">' + h(st) + '</span>'; }
function by(arr, fn){ const m = {}; arr.forEach(x => { const k = fn(x); (m[k] = m[k] || []).push(x); }); return m; }
function uniq(arr){ return Array.from(new Set(arr)); }
const role = () => S.data ? S.data.user.role : '';
const isSuper = () => ['Закупки','Админ'].indexOf(role()) >= 0;
const isRest = () => role() === 'Ресторан';
const canEditRequests = () => isSuper();
function itemById(id){ return (S.data.items || []).find(i => i.id === id); }
function place(name){ return (S.data.places || []).find(p => p.name === name); }
function restaurants(){ return (S.data.places || []).filter(p => p.type === 'Ресторан').map(p => p.name); }
function linesOf(reqId){ return S.data.lines.filter(l => l.reqId === reqId); }
function movOf(no){ return S.data.movements.filter(m => m.no === no); }

/* ============================== API ============================== */
async function api(action, payload){
  const body = Object.assign({ action: action, token: S.token }, payload || {});
  let res;
  try {
    res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  } catch(e) { throw new Error('Нет связи с сервером. Проверьте интернет и попробуйте ещё раз'); }
  let j;
  try { j = await res.json(); } catch(e){ throw new Error('Сервер ответил ошибкой. Попробуйте обновить страницу'); }
  if (!j.ok) {
    if (j.auth) { logout(true); }
    throw new Error(j.error || 'Ошибка');
  }
  return j;
}

async function run(fn, okText){
  if (S.busy) return;
  S.busy = true; S.msg = null; cover(true);
  try {
    const r = await fn();
    if (okText) S.msg = { kind: 'ok', text: typeof okText === 'function' ? okText(r) : okText };
    return r;
  } catch(e) {
    S.msg = { kind: 'err', text: e.message };
  } finally {
    S.busy = false; cover(false); render();
    if (S.msg) window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}
// После выбора в левом списке показать карточку справа (на узком экране она ниже списка).
function showDetail(){
  requestAnimationFrame(() => {
    const el = document.querySelector('.split > div:last-child > .panel');
    if (!el) return;
    const r = el.getBoundingClientRect();
    if (r.top < 0 || r.top > window.innerHeight * 0.6) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

async function reload(){
  const d = await api('bootstrap');
  S.data = d;
  if (S.cart && !cartDirty()) S.cart = null;
  if (!S.tab || !tabs().some(t => t.id === S.tab)) S.tab = tabs()[0].id;
  if (!S.sumDate) S.sumDate = defaultShipDate();
  if (!S.drvDate) S.drvDate = defaultShipDate();
}

function cover(on){
  let c = document.getElementById('cover');
  if (on && !c) { c = document.createElement('div'); c.id = 'cover'; c.className = 'loading-cover'; c.innerHTML = '<span class="spinner"></span> Загрузка…'; document.body.appendChild(c); }
  if (!on && c) c.remove();
}

function defaultShipDate(){
  const t = todayYmd();
  const ds = [];
  (S.data.places || []).forEach(p => (p.deliveries || []).forEach(d => { if (d.date >= t) ds.push(d.date); }));
  S.data.invoices.forEach(i => { if (i.date >= t) ds.push(i.date); });
  ds.sort();
  return ds[0] || t;
}

/* ============================== ВХОД ============================== */
function renderLogin(err){
  $('#app').innerHTML =
    '<div class="login-wrap"><div style="display:flex;justify-content:center;margin-bottom:18px">' + LOGO + '</div>' +
    '<div class="panel"><h2 class="panel-title">Заявки на расходники</h2>' +
    (err ? '<div class="msg err">' + h(err) + '</div>' : '') +
    '<form id="login-form"><div class="field"><label>Логин</label><input type="text" id="lg" autocomplete="username" autofocus></div>' +
    '<div class="field"><label>Пароль</label><input type="password" id="pw" autocomplete="current-password"></div>' +
    '<button class="btn btn-primary" style="width:100%" type="submit">Войти</button></form>' +
    '<p class="small muted" style="margin:14px 0 0">Логин и пароль лежит в тг-переписке с маркетологом</p></div>' +
    '<p class="small muted" style="text-align:center">v' + VERSION + '</p></div>';
  $('#login-form').onsubmit = async (e) => {
    e.preventDefault();
    const login = str($('#lg').value), password = $('#pw').value;
    if (!login || !password) return renderLogin('Введите логин и пароль');
    cover(true);
    try {
      const r = await api('login', { login: login, password: password });
      S.token = r.token; store.set(TOKEN_KEY, r.token);
      await reload();
      cover(false); render();
    } catch(err) { cover(false); renderLogin(err.message); }
  };
}

function logout(expired){
  S.token = ''; S.data = null; S.tab = null; S.form = null; S.ed = null; S.tr = null;
  store.del(TOKEN_KEY);
  renderLogin(expired ? 'Сессия закончилась. Войдите заново' : '');
}

/* ============================== ВКЛАДКИ ============================== */
function tabs(){
  const r = role();
  const T = [];
  const nTasks = S.data && S.data.tasks ? S.data.tasks.filter(t => t.date >= todayYmd() && t.status !== 'Отгружена').length : 0;
  if (r === 'Ресторан') {
    T.push({ id: 'cart', title: 'Заказ' });
    T.push({ id: 'mine', title: 'Мои заявки' });
    if (S.form && S.form.id) T.push({ id: 'req', title: 'Заявка ' + S.form.id });
    T.push({ id: 'tasks', title: 'Собрать', cnt: nTasks });
    T.push({ id: 'transfer', title: 'Перемещение' });
    T.push({ id: 'invoices', title: 'Накладные' });
  } else if (r === 'Закупки' || r === 'Админ') {
    const nNew = S.data ? S.data.requests.filter(q => q.status === 'Отправлена').length : 0;
    T.push({ id: 'inbox', title: 'Заявки', cnt: nNew });
    T.push({ id: 'summary', title: 'Свод на дату' });
    T.push({ id: 'messages', title: 'Сообщения' });
    T.push({ id: 'req', title: S.form && S.form.id ? 'Заявка ' + S.form.id : 'Заявка вручную' });
    T.push({ id: 'transfer', title: 'Перемещение' });
    T.push({ id: 'invoices', title: 'Накладные' });
    T.push({ id: 'catalog', title: 'Справочник' });
    T.push({ id: 'places', title: 'Места' });
    T.push({ id: 'movements', title: 'Отчёт по перемещениям' });
    if (nTasks) T.push({ id: 'tasks', title: 'Собрать', cnt: nTasks });
  } else if (r === 'Водитель') {
    T.push({ id: 'driver', title: 'Маршрут' });
    T.push({ id: 'tasks', title: 'Собрать на складе', cnt: nTasks });
    T.push({ id: 'invoices', title: 'Накладные' });
  } else if (r === 'Экономист') {
    T.push({ id: 'movements', title: 'Перемещения' });
    T.push({ id: 'invoices', title: 'Накладные' });
  } else if (r === 'Маркетолог') {
    T.push({ id: 'tasks', title: 'Собрать', cnt: nTasks });
    T.push({ id: 'invoices', title: 'Накладные' });
  } else {
    T.push({ id: 'inbox', title: 'Заявки' });
    T.push({ id: 'summary', title: 'Свод на дату' });
    T.push({ id: 'movements', title: 'Перемещения' });
    T.push({ id: 'invoices', title: 'Накладные' });
  }
  return T;
}

/* ============================== ОТРИСОВКА ============================== */
function render(){
  if (!S.token || !S.data) return renderLogin();
  const u = S.data.user;
  const T = tabs();
  let html =
    '<header class="top">' + LOGO +
    '<div><h1>Заявки на расходники</h1><div class="sub">' + h(u.name) + ' · ' + h(u.role) + (u.place ? ' · ' + h(u.place) : '') + '</div></div>' +
    '<div class="sync"><span class="version-tag">v' + VERSION + '</span>' +
    '<button class="btn btn-secondary btn-sm" onclick="App.refresh()">Обновить</button>' +
    '<button class="btn btn-secondary btn-sm" onclick="App.logout()">Выйти</button></div></header>' +
    '<div class="tabs">' + T.map(t => '<button class="tab-btn' + (t.id === S.tab ? ' active' : '') + '" onclick="App.tab(\'' + t.id + '\')">' + h(t.title) + (t.cnt ? '<span class="cnt">' + t.cnt + '</span>' : '') + '</button>').join('') + '</div>';
  if (S.msg) html += '<div class="msg ' + S.msg.kind + '">' + h(S.msg.text) + '</div>';
  const V = VIEWS[S.tab];
  html += V ? V() : '';
  $('#app').innerHTML = html;
  if (AFTER[S.tab]) AFTER[S.tab]();
}

const VIEWS = {}, AFTER = {};

/* ---------- Заказ ресторана (каждый день) ---------- */
// Каждая позиция уходит в ближайшую поставку своего источника; ресторан видит только дату и время приёма.
function cartInit(){
  const T = S.data.targets || {};
  const c = { qty: {}, dirty: {}, free: ((T.__free && T.__free.lines) || []).map(x => ({ name: x.name, unit: x.unit, qty: x.qty })), freeDirty: false, comment: '', q: '' };
  S.data.items.forEach(i => { const t = T[i.id]; if (t && t.qty) c.qty[i.id] = t.qty; });
  S.cart = c;
}
function cartDirty(){ return !!S.cart && (Object.keys(S.cart.dirty).length > 0 || S.cart.freeDirty || !!str(S.cart.comment)); }
// Последнее количество по каждой позиции (для «было» и «Как в прошлый раз»), не считая открытых заявок.
function lastQty(){
  const out = {};
  const reqs = S.data.requests.filter(r => !(r.status === 'Отправлена' && r.shipDate >= todayYmd())).sort((a, b) => b.shipDate.localeCompare(a.shipDate));
  reqs.forEach(r => linesOf(r.id).forEach(l => {
    if (!l.itemId || l.itemId in out) return;
    const q = l.approved !== null ? l.approved : l.requested;
    if (q) out[l.itemId] = { qty: q, date: r.shipDate };
  }));
  return out;
}
function dlText(t){ return t && t.deadline ? ruDay(t.deadline.slice(0, 10)) + ' ' + t.deadline.slice(11) : ''; }

VIEWS.cart = function(){
  if (!S.cart) cartInit();
  const C = S.cart, T = S.data.targets || {};
  const prev = lastQty();
  const cats = S.data.categories.slice();
  const items = S.data.items.filter(i => i.active);
  items.forEach(i => { if (cats.indexOf(i.category) < 0) cats.push(i.category || 'Прочее'); });
  const q = C.q.toLowerCase();

  // Ближайшие закрытия приёма
  const slots = {};
  items.forEach(i => { const t = T[i.id]; if (!t || t.none) return; const k = t.deadline + '|' + t.date; (slots[k] = slots[k] || {})[i.category] = 1; });
  const slotHtml = Object.keys(slots).sort().slice(0, 4).map(k => { const p = k.split('|'); return '<div class="small"><b>до ' + h(dlText({ deadline: p[0] })) + '</b> → поставка ' + h(ruDay(p[1])) + ' <span class="muted">· ' + h(Object.keys(slots[k]).join(', ')) + '</span></div>'; }).join('');

  let html = '<div class="panel"><h2 class="panel-title">Заказ</h2>' +
    '<div class="small muted" style="margin-bottom:8px">Добавляйте позиции в любой день. Каждая попадёт в ближайшую поставку — дата видна справа от названия.</div>' +
    (slotHtml ? '<div class="msg info" style="margin-top:0">' + slotHtml + '</div>' : '') +
    '<div class="row" style="align-items:flex-end"><div class="field" style="flex:1 1 240px;margin-bottom:6px"><label>Поиск позиции</label><input type="text" id="c-q" value="' + h(C.q) + '" placeholder="Поиск" oninput="App.cq(this.value)"></div>' +
    (Object.keys(prev).length ? '<div class="field" style="flex:0 0 auto;margin-bottom:6px"><button class="btn btn-secondary btn-sm" onclick="App.cartRepeat()">Как в прошлый раз</button></div>' : '') + '</div>';

  cats.forEach(cat => {
    const list = items.filter(i => (i.category || 'Прочее') === cat && (!q || i.name.toLowerCase().indexOf(q) >= 0));
    if (!list.length) return;
    html += '<h3 class="sec">' + h(cat) + '</h3><div class="items-grid">';
    list.forEach(i => {
      const t = T[i.id] || { none: true };
      const v = C.qty[i.id] || '';
      const p = prev[i.id];
      const dis = t.none || t.locked ? ' disabled' : '';
      const when = t.none ? '<span style="color:var(--red)">нет поставки</span>' : (t.locked ? '<span style="color:var(--amber)">на ' + h(ruShort(t.date)) + ' заказано</span>' : '→ ' + h(ruDay(t.date)));
      html += '<div class="item-row' + (v ? ' has-qty' : '') + '" data-id="' + h(i.id) + '">' +
        '<div><div class="nm">' + h(i.name) + '</div><div class="meta">' + h(i.unitLabel || i.unit) + (i.mult > 1 ? ' · кратно ' + fmtN(i.mult) : '') + ' · ' + when + '</div></div>' +
        '<div class="prev">' + (p ? 'было ' + fmtN(p.qty) : '') + '</div>' +
        '<div class="qty"><button type="button"' + dis + ' onclick="App.cstep(\'' + h(i.id) + '\',-1)">−</button>' +
        '<input type="text" inputmode="decimal" value="' + h(v) + '"' + dis + ' onchange="App.cset(\'' + h(i.id) + '\', this.value)">' +
        '<button type="button"' + dis + ' onclick="App.cstep(\'' + h(i.id) + '\',1)">+</button></div></div>';
    });
    html += '</div>';
  });

  const ft = T.__free;

/* ---------- Поиск позиции по первым буквам ---------- */
// Совпадение с началом любого слова названия: «крыш» → «Крышка…», «200» → «Стакан 200 мл».
function comboMatch(q){
  const items = S.data.items.filter(i => i.active);
  if (!q) return items;
  const words = n => n.toLowerCase().split(/[\s«»"().,:;+\-\/]+/).filter(Boolean);
  const qs = q.toLowerCase().split(/\s+/).filter(Boolean);
  return items.filter(i => { const w = words(i.name); return qs.every(x => w.some(y => y.indexOf(x) === 0)); })
    .sort((a, b) => (b.name.toLowerCase().indexOf(qs[0]) === 0) - (a.name.toLowerCase().indexOf(qs[0]) === 0));
}
function combo(key, value){
  return '<div class="combo" data-key="' + h(key) + '"><input type="text" value="' + h(value) + '" placeholder="Найти позицию…" autocomplete="off"' +
    ' onfocus="this.select();App.comboIn(this)" oninput="App.comboIn(this)" onkeydown="App.comboKey(event,this)" onblur="App.comboBlur(this)"><div class="combo-list"></div></div>';
}

function reqCats(r){ return uniq(linesOf(r.id).map(l => { const it = itemById(l.itemId); return it ? it.category : 'Нет в списке'; })).join(', '); }
VIEWS.mine = function(){

function requestDetail(r, mode){
  if (!r) return '';
  const ls = linesOf(r.id);
  const showApproved = ls.some(l => l.approved !== null) || ['Утверждена','Отгружена'].indexOf(r.status) >= 0;
  let html = '<div class="panel"><h2 class="panel-title">Заявка ' + h(r.id) + ' ' + chip(r.status) + '</h2>';
  html += '<dl class="kv"><dt>Получатель</dt><dd>' + h(r.place) + '</dd><dt>Поставка</dt><dd>' + h(ruDay(r.shipDate)) + '</dd>' +
    (r.source ? '<dt>Источник</dt><dd>' + h(r.source) + '</dd>' : '') +
    '<dt>Создана</dt><dd>' + h(ruDT(r.createdAt)) + ' · ' + h(r.author) + '</dd>' +
    (r.approvedAt ? '<dt>Утверждена</dt><dd>' + h(ruDT(r.approvedAt)) + ' · ' + h(r.approvedBy) + '</dd>' : '') + '</dl>';
  if (r.comment) html += '<div class="msg info">Комментарий ресторана: ' + h(r.comment) + '</div>';
  if (r.purchaseComment) html += '<div class="msg warn">Комментарий закупок: ' + h(r.purchaseComment) + '</div>';
  html += '<div class="t-wrap"><table class="t"><thead><tr><th>Позиция</th><th class="num">Запрошено</th>' + (showApproved ? '<th class="num">Утверждено</th>' : '') + '<th>Комментарий закупок</th></tr></thead><tbody>';
  ls.forEach(l => {
    let ap = '';
    if (showApproved) {
      const a = l.approved === null ? l.requested : l.approved;
      const cls = l.requested === null ? 'diff-up' : (a < l.requested ? 'diff-down' : (a > l.requested ? 'diff-up' : ''));
      ap = '<td class="num ' + cls + '">' + (a === null ? '' : fmtN(a)) + '</td>';
    }
    html += '<tr><td>' + h(l.name) + ' <span class="muted small">' + h(l.pack || l.unit) + '</span>' + (l.requested === null ? ' <span class="chip st-Утверждена">добавлено</span>' : '') + '</td>' +
      '<td class="num">' + (l.requested === null ? '—' : fmtN(l.requested)) + '</td>' + ap + '<td class="small">' + h(l.comment) + '</td></tr>';
  });
  html += '</tbody></table></div>';
  const invs = S.data.invoices.filter(i => i.basis === r.id);
  if (invs.length) html += '<div class="actions">' + invs.map(i => '<button class="btn btn-secondary btn-sm" onclick="App.print([\'' + h(i.no) + '\'])">Печать ' + h(i.no) + '</button>').join('') + '</div>';
  if (mode === 'rest') {
    const a = [];
    if (['Отправлена','Возвращена'].indexOf(r.status) >= 0) a.push('<button class="btn btn-primary" onclick="App.editReq(\'' + r.id + '\')">' + (r.status === 'Возвращена' ? 'Исправить и отправить' : 'Изменить') + '</button>');
    if (r.status === 'Отправлена') a.push('<button class="btn btn-danger" onclick="App.delReq(\'' + r.id + '\')">Удалить</button>');
    if (r.status === 'На проверке') html += '<div class="msg info">Закупки уже проверяют заявку, изменить её нельзя. Если срочно, напишите Тане.</div>';
    if (a.length) html += '<div class="actions">' + a.join('') + '</div>';
  }
  html += '</div>';
  return html;
}

const ACTIVE_ST = ['Отправлена','На проверке','Возвращена'];
function srcLabel(src){ return src || 'без источника'; }
VIEWS.inbox = function(){

    [['active','В работе'],['','Все'],['Отправлена','Отправлена'],['На проверке','На проверке'],['Возвращена','Возвращена'],['Утверждена','Утверждена'],['Отгружена','Отгружена']]
      .map(o => '<option value="' + o[0] + '"' + (o[0] === I.status ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div></div>';

// Сколько ресторан обычно берёт позицию: среднее по утверждённым заявкам за 6 недель до этой поставки (нужно ≥ 2).
function usualQty(placeName, itemId, exceptId, shipDate){
  const from = addDays(shipDate, -42);
  const vals = [];
  S.data.requests.forEach(r => {
    if (r.place !== placeName || r.id === exceptId || r.shipDate < from || r.shipDate >= shipDate || ['Утверждена','Отгружена'].indexOf(r.status) < 0) return;
    S.data.lines.forEach(l => { if (l.reqId === r.id && l.itemId === itemId && l.approved) vals.push(l.approved); });
  });
  return vals.length >= 2 ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
}

function startEditor(r){
  const E = { id: r.id, updatedAt: r.updatedAt, purchaseComment: r.purchaseComment, lines: {}, added: [] };
  linesOf(r.id).forEach(l => { E.lines[l.lineId] = { approved: l.approved !== null ? String(l.approved) : (l.requested !== null ? String(l.requested) : ''), from: l.from || '', comment: l.comment || '', pack: l.pack || '' }; });
  S.ed = E;
}
function packSelect(it, val, onchange, dis){
  const packs = it && it.packs ? it.packs.filter(p => p.active || p.name === val) : [];
  if (packs.length < 2) return '<span class="small muted">' + h(val || (it ? it.unit : '') || '—') + '</span>';
  return '<select' + dis + ' onchange="' + onchange + '">' + packs.map(p => '<option' + (p.name === val ? ' selected' : '') + '>' + h(p.name) + '</option>').join('') + '</select>';
}
function srcOptions(exclude, val){
  const ps = S.data.places.filter(p => p.name !== exclude && (p.active || p.name === val));
  const grp = (t, label) => { const l = ps.filter(p => t.indexOf(p.type) >= 0); return l.length ? '<optgroup label="' + label + '">' + l.map(p => '<option' + (p.name === val ? ' selected' : '') + '>' + h(p.name) + '</option>').join('') + '</optgroup>' : ''; };
  return '<option value="">—</option>' + grp(['Склад','Офис','Ресторан'], 'Свои') + grp(['Поставщик'], 'Поставщики');
}

  });
  html += '</tbody></table></div>';
  html += '<div class="small muted" style="margin-top:6px">«Утвердить» заполнено как запросили — поправьте, если нужно. 0 = не отгружаем (напишите ресторану почему). Количество — в выбранной фасовке.</div>';

  if (editable) {

    html += '<div class="field"><label>Комментарий закупок (виден ресторану)</label><textarea oninput="App.edC(this.value)">' + h(E.purchaseComment) + '</textarea></div>';
    html += '<div class="actions">' +
      '<button class="btn btn-primary" onclick="App.review(\'approve\')">Утвердить</button>' +
      '<button class="btn btn-secondary" onclick="App.review(\'save\')">Сохранить правки, утвердить позже</button>' +
      '<button class="btn btn-danger" onclick="App.review(\'return\')">Вернуть ресторану</button></div>' +
      '<div class="small muted" style="margin-top:8px;line-height:1.6"><b>Утвердить</b> — заявка готова: создаются накладные, ресторан получает уведомление, позиции поставщиков попадают в «Сообщения».<br>' +
      '<b>Сохранить правки</b> — только запомнить изменения; заявка остаётся у вас «На проверке», ресторан её уже не меняет.</div>';
  } else if (r.purchaseComment) {
    html += '<div class="msg warn">Комментарий закупок: ' + h(r.purchaseComment) + '</div>';
  }
  if (approved) {
    const invs = S.data.invoices.filter(i => i.basis === r.id);
    html += '<div class="small muted" style="margin-top:6px">Не хватило? Поправьте количество и нажмите «Сохранить корректировку»: номера накладных сохранятся, ресторан получит уведомление. Сменить «откуда» или фасовку — через «Вернуть в работу».</div>';
    html += '<div class="actions"><button class="btn btn-primary" onclick="App.adjust()">Сохранить корректировку</button>' +
      (invs.length ? '<button class="btn btn-secondary" onclick="App.print(' + h(JSON.stringify(invs.map(i => i.no))) + ')">Печать накладных (' + invs.length + ')</button>' : '') +
      '<button class="btn btn-secondary" onclick="App.reopen()">Вернуть в работу</button></div>';
  }
  html += '</div>';
  return html;
}

/* ---------- Свод по позициям на дату ---------- */
function knownDates(){
  const ds = [];
  (S.data.places || []).forEach(p => (p.deliveries || []).forEach(d => ds.push(d.date)));
  S.data.requests.forEach(r => ds.push(r.shipDate));
  S.data.invoices.forEach(i => ds.push(i.date));
  return uniq(ds).sort().reverse();
}
function summaryInfo(){
  const info = {};
  const byD = by(S.data.requests.filter(r => r.status !== 'Черновик'), r => r.shipDate);
  Object.keys(byD).forEach(d => {
    const wait = byD[d].filter(r => ACTIVE_ST.indexOf(r.status) >= 0).length;
    info[d] = [{ text: 'заявок: ' + byD[d].length }].concat(wait ? [{ text: 'ждут проверки: ' + wait, warn: true }] : []);
  });
  return info;
}
VIEWS.summary = function(){
  const info = summaryInfo();
  const date = S.sumDate = pickDate(S.sumDate, info);
  const reqs = S.data.requests.filter(r => r.shipDate === date && r.status !== 'Черновик');
  const rests = uniq(reqs.map(r => r.place)).sort();
  const rows = {};
  reqs.forEach(r => linesOf(r.id).forEach(l => {
    const q = l.approved !== null ? l.approved : (l.requested || 0);
    if (!q) return;
    const key = (l.itemId || '') + '|' + l.name + '|' + (l.pack || l.unit);
    const it = l.itemId ? itemById(l.itemId) : null;
    const row = rows[key] = rows[key] || { name: l.name, unit: l.pack || l.unit, from: l.from || r.source || '—', order: it ? it.order : 1e9, by: {} };
    row.by[r.place] = (row.by[r.place] || 0) + q;
  }));
  const groups = by(Object.values(rows), r => r.from);
  let html = '<div class="panel"><h2 class="panel-title">Свод на дату</h2>' + dateTiles(date, info, 'App.sumDate');
  if (!date) return html + '</div>';
  html += '<div class="small muted">Утверждённое количество. Черновики не учитываются. Заявок: ' + reqs.length + ' (' +
    h(Object.entries(by(reqs, r => r.status)).map(e => e[0].toLowerCase() + ' ' + e[1].length).join(', ') || '—') + ')</div>';
  if (!reqs.length) return html + '<div class="empty">На эту дату заявок нет</div></div>';
  Object.keys(groups).sort().forEach(src => {
    const list = groups[src].sort((a,b) => a.order - b.order);
    html += '<h3 class="sec">Откуда: ' + h(src) + '</h3><div class="t-wrap"><table class="t"><thead><tr><th>Позиция</th>' + rests.map(p => '<th class="num">' + h(p) + '</th>').join('') + '<th class="num">Итого</th></tr></thead><tbody>';
    list.forEach(r => {
      let tot = 0;
      html += '<tr><td>' + h(r.name) + ' <span class="muted small">' + h(r.unit) + '</span></td>' + rests.map(p => { const v = r.by[p] || 0; tot += v; return '<td class="num">' + (v ? fmtN(v) : '<span class="muted">·</span>') + '</td>'; }).join('') + '<td class="num"><b>' + fmtN(tot) + '</b></td></tr>';
    });
    html += '</tbody></table></div>';
  });
  return html + '</div>';
};

// Плитки дат: только даты, где что-то есть, с кратким содержимым. Ближайшие впереди, прошедшие — в списке.
function dateTiles(sel, info, act){
  const t0 = todayYmd();
  const ds = Object.keys(info).sort();
  const fut = ds.filter(d => d >= addDays(t0, -1)).slice(0, 8);
  const past = ds.filter(d => fut.indexOf(d) < 0).reverse();
  if (!ds.length) return '<div class="empty">Пока нет ни одной поставки</div>';
  let html = '<div class="dates">' + fut.map(d => '<button class="dt' + (d === sel ? ' on' : '') + '" onclick="' + act + '(\'' + d + '\')"><b>' + h(ruDay(d)) + (d === t0 ? ' · сегодня' : '') + '</b>' +
    info[d].map(x => '<span' + (x.warn ? ' class="warn"' : '') + '>' + h(x.text) + '</span>').join('') + '</button>').join('') + '</div>';
  if (past.length) html += '<div class="row" style="margin:-4px 0 10px"><div class="field" style="max-width:260px;margin:0"><select onchange="' + act + '(this.value)"><option value="">Прошедшие даты…</option>' +
    past.map(d => '<option value="' + d + '"' + (d === sel ? ' selected' : '') + '>' + h(ruDay(d)) + ' — ' + h(info[d].map(x => x.text).join(', ')) + '</option>').join('') + '</select></div></div>';
  return html;
}
function pickDate(cur, info){
  if (cur && info[cur]) return cur;
  const t0 = todayYmd(), ds = Object.keys(info).sort();
  return ds.find(d => d >= t0) || ds[ds.length - 1] || '';
}

/* ---------- Сообщения: водителю и поставщикам ---------- */
function driverText(date){
  const invs = S.data.invoices.filter(i => i.date === date);
  if (!invs.length) return '';
  const lines = ['Отгрузка ' + ruDay(date)];
  const byFrom = by(invs, i => i.from);
  Object.keys(byFrom).sort((a,b) => (place(a) && place(a).type === 'Склад' ? -1 : 0) - (place(b) && place(b).type === 'Склад' ? -1 : 0) || a.localeCompare(b)).forEach(from => {
    lines.push('');
    lines.push('Забрать: ' + from.toUpperCase());
    byFrom[from].sort((a,b) => a.to.localeCompare(b.to)).forEach(inv => {
      lines.push('→ ' + inv.to + ' (' + inv.no + ')');
      movOf(inv.no).forEach(m => lines.push('   • ' + m.name + ' — ' + fmtN(m.qty) + ' ' + m.unit));
    });
  });
  return lines.join('\n');
}
function supplierLines(date, sup){
  // Утверждённые строки с этим источником на дату, сгруппированные по получателю.
  const out = {};
  S.data.requests.filter(r => r.shipDate === date && ['Утверждена','Отгружена'].indexOf(r.status) >= 0).forEach(r => {
    linesOf(r.id).forEach(l => { if (l.from === sup && l.approved) (out[r.place] = out[r.place] || []).push(l); });
  });
  return out;
}
function supplierText(date, sup){
  const g = supplierLines(date, sup);
  const places = Object.keys(g).sort();
  if (!places.length) return '';
  const org = S.data.settings.org || 'ООО «ДаСпадобы»';
  const lines = ['Заказ ' + org + ' (Salateira) на ' + ruDay(date) + ' (' + ru(date) + ')'];
  places.forEach(pn => {
    const p = place(pn) || {};
    lines.push('');
    lines.push(pn);
    if (p.address || p.phone) lines.push([p.address, p.phone ? 'тел. ' + p.phone : ''].filter(Boolean).join(', '));
    g[pn].forEach(l => lines.push('• ' + l.name + (l.pack ? ', ' + l.pack : '') + ' — ' + fmtN(l.approved) + (l.pack ? '' : ' ' + l.unit)));
  });
  return lines.join('\n');
}
function messagesInfo(){
  const info = {};
  const add = (d, text, warn) => { (info[d] = info[d] || []).push({ text, warn }); };
  const byD = by(S.data.invoices, i => i.date);
  Object.keys(byD).forEach(d => add(d, 'водителю: ' + byD[d].length + ' накл.'));
  (S.data.places || []).filter(p => p.type === 'Поставщик').forEach(sp => {
    const ds = {};
    S.data.requests.forEach(r => {
      if (r.status === 'Черновик') return;
      const has = r.source === sp.name || linesOf(r.id).some(l => l.from === sp.name);
      if (!has) return;
      const k = ds[r.shipDate] = ds[r.shipDate] || { ok: 0, wait: 0 };
      if (['Утверждена','Отгружена'].indexOf(r.status) >= 0) k.ok++; else k.wait++;
    });
    Object.keys(ds).forEach(d => add(d, sp.name + (ds[d].wait ? ': ждут ' + ds[d].wait : ''), ds[d].wait > 0));
  });
  return info;
}
VIEWS.messages = function(){
  const info = messagesInfo();
  const date = S.drvDate = pickDate(S.drvDate, info);
  const sups = (S.data.places || []).filter(p => p.type === 'Поставщик').map(p => p.name)
    .filter(sp => S.data.requests.some(r => r.shipDate === date && (r.source === sp || linesOf(r.id).some(l => l.from === sp))));
  const hasDriver = S.data.invoices.some(i => i.date === date) || S.data.requests.some(r => r.shipDate === date && ACTIVE_ST.indexOf(r.status) >= 0 && !(place(r.source) && place(r.source).type === 'Поставщик'));
  const tabsList = (hasDriver ? [['driver', 'Водителю']] : []).concat(sups.map(s => [s, s]));
  if (!tabsList.some(t => t[0] === S.msgTab)) S.msgTab = tabsList.length ? tabsList[0][0] : 'driver';
  let html = '<div class="panel"><h2 class="panel-title">Сообщения</h2>' + dateTiles(date, info, 'App.drvDate');
  if (!date) return html + '</div>';
  html += '<div class="tabs" style="margin-bottom:12px">' + tabsList.map(t =>
    '<button class="tab-btn' + (S.msgTab === t[0] ? ' active' : '') + '" style="padding:6px 12px;font-size:0.8rem" onclick="App.msgTab(\'' + h(t[0]) + '\')">' + h(t[1]) + '</button>').join('') + '</div>';
  let txt;
  if (S.msgTab === 'driver') {
    const pend = S.data.requests.filter(r => r.shipDate === date && ACTIVE_ST.indexOf(r.status) >= 0 && !(place(r.source) && place(r.source).type === 'Поставщик'));
    if (pend.length) html += '<div class="msg warn">Ещё не утверждены: ' + h(pend.map(r => r.place + ' ← ' + srcLabel(r.source) + ' (' + r.status.toLowerCase() + ')').join(', ')) + '. В сообщение попадают только утверждённые заявки и перемещения.</div>';
    txt = driverText(date);
  } else {
    const pend = S.data.requests.filter(r => r.shipDate === date && r.source === S.msgTab && ACTIVE_ST.indexOf(r.status) >= 0);
    if (pend.length) html += '<div class="msg warn">Ещё не утверждены: ' + h(pend.map(r => r.place + ' (' + r.status.toLowerCase() + ')').join(', ')) + '. В сообщение попадают только утверждённые.</div>';
    const sp = place(S.msgTab);
    if (sp && sp.contact) html += '<div class="small muted" style="margin-bottom:6px">Контакт поставщика: ' + h(sp.contact) + '</div>';
    const missing = Object.keys(supplierLines(date, S.msgTab)).filter(pn => { const p = place(pn); return !p || !p.address || !p.phone; });
    if (missing.length) html += '<div class="msg warn">Нет адреса или телефона: ' + h(missing.join(', ')) + ' — заполните в «Местах».</div>';
    txt = supplierText(date, S.msgTab);
  }
  if (!txt) return html + '<div class="empty">На эту дату утверждённых позиций нет</div></div>';
  html += '<pre class="msgtext" id="drv-text">' + h(txt) + '</pre><div class="actions">' +
    '<button class="btn btn-primary" onclick="App.copyMsg()">Скопировать для Viber</button>';
  if (S.msgTab === 'driver') {
    html += '<button class="btn btn-secondary" onclick="App.print(' + h(JSON.stringify(S.data.invoices.filter(i => i.date === date).map(i => i.no))) + ')">Печать всех накладных на дату</button>';
    const ok = S.data.requests.filter(r => r.shipDate === date && r.status === 'Утверждена').length;
    if (ok) html += '<button class="btn btn-secondary" onclick="App.shipped()">Отметить: всё отгружено (' + ok + ')</button>';
  }
  return html + '</div></div>';
};

/* ---------- Собрать ---------- */
VIEWS.tasks = function(){
  const t0 = todayYmd();
  const tasks = S.data.tasks;
  let html = '<div class="panel"><h2 class="panel-title">Что собрать</h2>';
  html += '<div class="small muted" style="margin-bottom:6px">Позиции, которые лежат у вас и должны уйти в другие места.</div>';
  if (!tasks.length) return html + '<div class="empty">Сейчас собирать ничего не нужно</div></div>';
  const byDate = by(tasks, t => t.date);
  const day = (d, active) => {
    let x = '<h3 class="sec" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span>' + h(ruDay(d)) + (d === t0 ? ' · сегодня' : '') + '</span>' +
      (active ? '<button class="btn btn-secondary btn-sm" style="text-transform:none;letter-spacing:0" onclick="App.printTasks(\'' + d + '\')">Печать списка</button>' : '') + '</h3>';
    const byTo = by(byDate[d], t => t.to + '|' + t.invoice);
    Object.keys(byTo).sort().forEach(k => {
      const list = byTo[k], t1 = list[0];
      x += '<div style="margin:8px 0 4px"><b>→ ' + h(t1.to) + '</b> <span class="muted small">' + h(t1.invoice) + ' · ' + h(t1.kind.toLowerCase()) + (t1.status === 'Отгружена' ? ' · отгружено' : '') + '</span></div>' +
        '<table class="t"><tbody>' + list.map(t => '<tr><td>' + h(t.name) + '</td><td class="num" style="width:120px"><b>' + fmtN(t.qty) + '</b> ' + h(t.unit) + '</td></tr>').join('') + '</tbody></table>';
    });
    return x;
  };
  const dates = Object.keys(byDate).sort();

  fut.forEach(d => { html += day(d, true); });
  if (past.length) html += '<details class="past"><summary>Прошедшие (' + past.length + ')</summary><div class="inner">' + past.map(d => day(d, false)).join('') + '</div></details>';
  return html + '</div>';
};

/* ---------- Места: рестораны, склад, офис, поставщики ---------- */
const PLACE_TYPES = ['Ресторан','Склад','Офис','Поставщик'];
const DAY_ORDER = ['пн','вт','ср','чт','пт','сб','вс'];
function daysSet(v){
  const t = str(v).toLowerCase().replace(/[–—]/g, '-');
  if (/ежеднев|каждый|все дни/.test(t)) return DAY_ORDER.slice();
  const out = [];
  t.split(/[,;\s]+/).filter(Boolean).forEach(tok => {
    const m = tok.split('-').filter(Boolean);
    if (m.length === 2) { let a = DAY_ORDER.indexOf(m[0].slice(0, 2)), b = DAY_ORDER.indexOf(m[1].slice(0, 2)); if (a < 0 || b < 0) return; for (let k = 0; k < 7; k++) { const d = DAY_ORDER[(a + k) % 7]; if (out.indexOf(d) < 0) out.push(d); if ((a + k) % 7 === b) break; } }
    else { const d = DAY_ORDER.indexOf(tok.slice(0, 2)); if (d >= 0 && out.indexOf(DAY_ORDER[d]) < 0) out.push(DAY_ORDER[d]); }
  });
  return out;
}
function daysStr(set){
  if (set.length === 7) return 'ежедневно';
  return DAY_ORDER.filter(d => set.indexOf(d) >= 0).map(d => d[0].toUpperCase() + d[1]).join(', ');
}
function schedText(p){
  if (!p.days) return '';
  p = Object.assign({}, p, { days: daysStr(daysSet(p.days)) || p.days });
  return p.days + ' · приём ' + (num(p.lead) === 0 ? 'в день поставки' : 'за ' + num(p.lead) + ' дн.') + ' до ' + (p.time || '16:00');
}
function placeForm(p){
  if (!p) return { isNew: true, name: '', type: 'Поставщик', code: '', invoiceName: '', responsible: '', address: '', phone: '', days: '', lead: '1', time: '16:00', contact: '', active: true };
  return Object.assign({ isNew: false }, p, { lead: p.lead === '' ? '1' : p.lead, time: p.time || '16:00' });
}

      '<button type="button" class="all' + (daysSet(f.days).length === 7 ? ' on' : '') + '" onclick="App.plDay(\'all\')">Все дни</button></div></div>' +
    '<div class="row"><div class="field"><label>Приём за сколько дней (0 — в день поставки)</label><input type="text" inputmode="numeric" value="' + h(f.lead) + '" oninput="App.plF(\'lead\', this.value)"></div>' +
    '<div class="field"><label>Приём до</label><input type="time" value="' + h(f.time) + '" oninput="App.plF(\'time\', this.value)"></div></div>' +
    '<div class="small muted">Пример: БелАсва возит по средам, заказ в тот же день до 10:00 → Ср, 0, 10:00. Молочка — каждый день, заказ за 2 дня до 12:00 → Все дни, 2, 12:00.</div>';
  if (ex && ex.deliveries && ex.deliveries.length) html += '<div class="small" style="margin-top:8px"><b>Ближайшие поставки:</b> ' + ex.deliveries.filter(d => !d.closed).slice(0, 4).map(d => h(ruDay(d.date)) + ' <span class="muted">(до ' + h(dlText(d)) + ')</span>').join(' · ') + '</div>';
  html += '<label class="chk" style="margin-top:12px"><input type="checkbox"' + (f.active !== false ? ' checked' : '') + ' onchange="App.plF(\'active\', this.checked)"> Активно</label>';
  html += '<div class="actions"><button class="btn btn-primary" onclick="App.plSave()">' + (f.isNew ? 'Добавить' : 'Сохранить') + '</button><button class="btn btn-secondary" onclick="App.plCancel()">Отмена</button></div>';
  if (!f.isNew) html += '<div class="small muted" style="margin-top:8px">Название не меняется: по нему на место ссылаются заявки и накладные.</div>';
  return html + '</div></div></div>';
};

    const ms = movOf(i.no);
    const rows = ms.map(m => '<tr><td>' + h(m.name) + '</td><td class="c">' + h(m.unit) + '</td><td class="c">' + h(fmtN(m.qty)) + '</td></tr>');

      '<h2>Накладная на внутреннее перемещение</h2><div class="no">№ ' + h(i.no) + '</div>' +
      '<div class="parties"><div>Отпустил: <b>' + h(i.fromName) + '</b></div><div>Принял: <b>' + h(i.toName) + '</b></div></div>' +
      '<table><thead><tr><th style="width:62%">Наименование</th><th>Ед. изм.</th><th>Количество</th></tr></thead><tbody>' + rows.join('') + '</tbody></table>' +

function findInvoices(nos){ return nos.map(no => S.data.invoices.find(i => i.no === no)).filter(Boolean); }

/* ============================== EXCEL ============================== */
function exportExcel(){
  if (!window.XLSX) { S.msg = { kind: 'err', text: 'Библиотека Excel ещё не загрузилась, попробуйте через пару секунд' }; return render(); }
  const list = movFiltered().sort((a,b) => a.date.localeCompare(b.date) || a.no.localeCompare(b.no));
  const rows = list.map(m => ({ 'Дата': ru(m.date), '№ накладной': m.no, 'Тип': m.type, 'Откуда': m.from, 'Куда': m.to, 'ID позиции': m.itemId, 'Наименование': m.name, 'Категория': m.category, 'Ед. изм.': m.unit, 'Количество': m.qty }));
  const dsts = uniq(list.map(m => m.to)).sort();
  const piv = {};
  list.forEach(m => { const k = m.name + '|' + m.unit; const r = piv[k] = piv[k] || { 'Позиция': m.name, 'Ед. изм.': m.unit }; r[m.to] = (r[m.to] || 0) + m.qty; });
  const pivRows = Object.values(piv).sort((a,b) => a['Позиция'].localeCompare(b['Позиция'])).map(r => { let t = 0; dsts.forEach(d => { r[d] = r[d] || 0; t += r[d]; }); r['Итого'] = t; return r; });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Перемещения');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pivRows, { header: ['Позиция','Ед. изм.'].concat(dsts, ['Итого']) }), 'Свод по ресторанам');
  XLSX.writeFile(wb, 'Перемещения_' + S.mov.from + '_' + S.mov.to + '.xlsx');
}

function roundUp(id, v){
  const it = itemById(id);
  let x = num(v);
  if (x <= 0) return '';
  const m = it ? it.mult || 1 : 1;
  x = Math.ceil(Math.round(x / m * 1000) / 1000) * m;
  return x;
}
function keepFocus(fn){
  const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
  fn();
  if (id) { const e = document.getElementById(id); if (e) { e.focus(); try { e.setSelectionRange(pos, pos); } catch(_){} } }
}

    } else if (key === 'rf') {
      const it = itemById(id); if (!it) return;
      if (!S.form.lines.some(l => l.itemId === id)) S.form.lines.push({ itemId: id, name: it.name, unit: it.unitLabel || it.unit, qty: '' });
      if (!S.form.source && it.source) S.form.source = it.source;
    } else if (key.indexOf('tr:') === 0) {
      const l = S.tr.lines[Number(key.slice(3))];
      if (id === '__free') { l.itemId = '__free'; l.name = typed; l.unit = l.unit || 'шт'; }
      else { const it = itemById(id); l.itemId = id; l.unit = it ? it.unit : 'шт'; l.name = ''; }
      S.justCreated = null;
    }
    render();
    if (key.indexOf('tr:') === 0) { const q = document.querySelectorAll('.free-row input[inputmode=decimal]')[Number(key.slice(3))]; if (q) q.focus(); }
  },
  print: printInvoices,
  printTasks: printTasks,
  preview: previewInvoices,
  pvClose(){ $('#preview-root').innerHTML = ''; document.body.style.overflow = ''; },
  pvPrint(){ const nos = JSON.parse($('#preview-root').getAttribute('data-nos') || '[]'); printInvoices(nos); },
  excel: exportExcel
};

function comboOpts(el){
  const key = el.parentNode.getAttribute('data-key');
  const q = el.value.trim();
  const list = comboMatch(q).slice(0, 10);
  const opts = list.map(i => ({ id: i.id, label: i.name, meta: (i.unitLabel || i.unit) + (i.mult > 1 ? ' · кратно ' + fmtN(i.mult) : '') + (i.source ? ' · ' + i.source : '') }));
  if (key.indexOf('tr:') === 0 && q) opts.push({ id: '__free', label: 'Вписать «' + q + '» вручную', meta: '', free: true });
  return opts;
}
function comboDraw(el){
  const box = el.parentNode.querySelector('.combo-list');
  const opts = comboOpts(el);
  const hi = Math.min(Number(el.getAttribute('data-hi') || 0), Math.max(opts.length - 1, 0));
  const key = el.parentNode.getAttribute('data-key');
  box.innerHTML = opts.length ? opts.map((o, k) => '<div class="combo-opt' + (k === hi ? ' hi' : '') + (o.free ? ' free' : '') + '" onmousedown="event.preventDefault();App.comboPick(\'' + h(key) + '\',\'' + h(o.id) + '\',' + k + ',this)">' +
    '<span>' + h(o.label) + '</span><span class="m">' + h(o.meta) + '</span></div>').join('') : '<div class="combo-empty">Ничего не нашлось</div>';
  box.classList.add('open');
}
function fallbackCopy(t){
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  ta.remove();
}

/* ============================== СТАРТ ============================== */
(async function start(){
  if (!S.token) return renderLogin();
  cover(true);
  try { await reload(); cover(false); render(); }
  catch(e){ cover(false); if (S.token) { S.msg = null; renderLogin(e.message); } }
})();
})();
</script>
