<!--
  Salateira · Заявки на расходники (zayavki.html)
  Версия 3.2

  3.2 — все действия сохраняются в фоне (у ресторанов тоже), экран не блокируется; в утверждённых
        поставках вместо серых полей обычный текст.
  3.1 — «Утвердить поставку» сохраняется в фоне; меню и подсказки закрываются кликом мимо и по Esc;
        исправлены подсказка, галочка в списке сборки, подписи в пересчёте. Нужен Code.gs ≥ 2.8.0.
  3.0 — новый интерфейс: разделы (сверху, на телефоне снизу) и подразделы, крупные заголовки и
        понятная иерархия, кнопки сохранения закреплены снизу, пояснения спрятаны под «?», тексты без
        стрелок и разделителей. Заказ: категории для быстрого перехода, «Часто заказываете». Таня:
        4 раздела вместо 11 вкладок, действия по ресторану в меню «⋯», сообщение поставщику прямо в поставке.
        Нужен Code.gs ≥ 2.7.0.
  2.8 — скорость: страница открывается сразу из сохранённых данных и тихо обновляется; Excel-библиотека
        грузится только по кнопке; история старше 2 месяцев догружается в отчёте по запросу; ⏱ у закупок.
        Колонка «Кол-во в ед. учёта» в накладных, списке сборки и Excel. Нужен Code.gs ≥ 2.6.0.
  2.7 — вкладка «Закупка на склад» (заранее у поставщика, сразу утверждена, видно остаток и сколько нужно
        ресторанам) и «Ожидаемые приходы». Остатки показываются только в местах хранения, не в ресторанах.
        В пересчётах — «было с приходом» и «расход». Нужен Code.gs ≥ 2.5.0.
  2.6 — рестораны сами присылают пересчёт (вкладка «Пересчёт»); в остатки он попадает только после
        утверждения Таней («Остатки → Пересчёты ресторанов»). Нужен Code.gs ≥ 2.4.0.
  2.5 — инвентаризацию можно вводить в фасовке (рулоны, банки) — пересчёт в единицу учёта.
        Нужен Code.gs ≥ 2.3.0 (ускорение: каждый лист читается один раз за запрос, правки пишутся пачкой).
  2.4 — остатки и приёмка. Ресторан: в «Моих заявках» блок «Ждут приёмки» — «Принять без
        разногласий» / «Принять с правками» для заявок и входящих перемещений. Закупки: вкладка
        «Остатки» (по позициям с разбивкой по местам и правкой, инвентаризация места целиком),
        остаток и «ожидается» под позицией в поставке, приёмка за склад; в отчёте — расход
        по инвентаризации. Нужен Code.gs ≥ 2.2.0 и один раз migrateV3().
  2.3 — «Поставки» у закупок: список поставок (источник + дата) вместо заявок по ресторанам;
        одна общая таблица позиций с разбивкой по ресторанам, «Утвердить поставку» сразу для всех,
        возврат одного ресторана; сохранение быстрее — свежие данные приходят в ответе.
        Нужен Code.gs ≥ 2.1.0.
  2.2 — «Заказ»: позиции, которые уже у закупок, показаны как «на 27.10 заказано N» без правки,
        остальные можно дозаказать до дедлайна (уйдёт отдельной заявкой). Нужен Code.gs ≥ 2.0.2.
  2.1 — время приёма без «1899 года»; дни поставки — переключатели по дням недели; «Собрать»:
        печать списка на день, прошедшие дни свёрнуты внизу; после действий страница поднимается
        к сообщению, выбор слева сразу показывает карточку; у закупок понятнее «Утвердить» и
        «Сохранить правки»; в «Сообщениях» и «Своде» даты — плитками с тем, что в них есть;
        короче подсказки в полях, подсказка светлее введённого текста.
  2.0 — поставщики и графики. Ресторан: вкладка «Заказ» — заказывает каждый день, каждая позиция
        сама уходит в ближайшую поставку (видна дата и время приёма), «Как в прошлый раз»;
        источники ресторану не видны. Закупки: заявки сгруппированы по источнику и дате,
        фасовка в строке заявки (поставщик фасовки становится источником), «Заявка вручную»
        (в т.ч. на склад), «Сообщения» — водителю и каждому поставщику (с адресами и телефонами),
        раздел «Места» с графиками, в справочнике — фасовки, новая категория/поставщик на месте.
        Нужен Code.gs ≥ 2.0.0.
  1.7 — компактная форма заявки: позиции в две колонки на широком экране, плотнее строки,
        количество рядом с названием; в накладной «Отпустил» вместо «Сдал».
  1.6 — корректировка утверждённой заявки (количество/комментарий, номера накладных
        сохраняются); пометка «больше обычного» у Тани; «Как в прошлый раз» в новой
        заявке. Нужен Code.gs ≥ 1.4.0.
  1.5 — «Просмотреть» у накладных: предпросмотр листов A4 прямо на странице,
        оттуда — печать или «Сохранить как PDF».
  1.4 — подключение Telegram со страницы убрано: ID вносит администратор в таблицу.
  1.3 — Telegram: кнопка «Подключить Telegram» в шапке (ссылка на бота с одноразовым
        кодом → «Проверить»), отключение. Нужен Code.gs ≥ 1.3.0.
  1.2 — накладная: подписи «Сдал» / «Принял» (без «Администратор» — отпускает
        и офис); таблица без пустых строк — ровно столько строк, сколько позиций.
  1.1 — фиолетовая палитра (#7002FF); «Взять в работу» продублирована вверху
        заявки; поиск позиции по первым буквам в перемещениях и при добавлении
        позиции закупками; вкладка «Справочник» — закупки добавляют и правят
        позиции прямо со страницы (нужен Code.gs ≥ 1.2.0); тексты по правкам.
  1.0 — первая версия. Вход по логину/паролю (учётки в Google Таблице).
        Ресторан: новая заявка по категориям с кратностью и прошлым заказом,
        мои заявки с «было → стало» и комментариями закупок, отзыв заявки,
        «Собрать» (что отдать другим), перемещение в другой ресторан, накладные.
        Закупки: входящие заявки, «Взять в работу», правка количеств/источника/
        комментариев, возврат, утверждение (накладные создаются сами), свод по
        позициям на дату, сообщение водителю, отметка «отгружено».
        Водитель: маршрут на дату. Экономист: перемещения за период, свод по
        ресторанам, выгрузка в Excel, печать накладных пачкой.
        Бэкенд: Code.gs ≥ 1.1.0.
-->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salateira · Заявки на расходники</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237002FF'/%3E%3Ctext x='32' y='45' font-family='Arial, Helvetica, sans-serif' font-weight='800' font-size='38' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#7002FF; --accent-dark:#5300C2; --accent-soft:#F1E9FF; --accent-line:#D9C6FF;
    --ink:#17122B; --muted:#6A6480; --faint:#9A94AD; --line:#E6E1F0; --line-soft:#F0EDF6; --bg:#F6F4FA; --hover:#FAF8FE;
    --ok:#0F8F62; --ok-soft:#E5F5EE;
    --red:#D6304A; --red-soft:#FCEBEE; --amber:#A8650B; --amber-soft:#FDF2E1;
    --blue:#3B4FD8; --blue-soft:#ECEFFE; --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:'Manrope', system-ui, sans-serif; font-size:15px; font-weight:500; background:var(--bg); color:var(--ink); line-height:1.45; -webkit-font-smoothing:antialiased; }
  .app{ max-width:1220px; margin:0 auto; padding:0 24px 96px; }
  @media (max-width:700px){ .app{ padding:0 14px 120px; } }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* Шапка и навигация: разделы сверху (на телефоне — снизу), подразделы — переключателем под ними */
  header.top{ display:flex; align-items:center; gap:28px; padding:16px 0; margin-bottom:8px; border-bottom:1px solid var(--line); }
  .logo-mark{ height:22px; width:auto; display:block; flex:0 0 auto; }
  .nav{ display:flex; gap:4px; }
  .nav-btn{ font-family:inherit; font-size:0.95rem; font-weight:700; color:var(--muted); background:none; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; position:relative; }
  .nav-btn:hover{ color:var(--ink); background:var(--line-soft); }
  .nav-btn.active{ color:var(--accent); background:var(--accent-soft); }
  .cnt{ display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:999px; background:var(--red); color:#fff; font-size:0.7rem; font-weight:800; line-height:18px; text-align:center; vertical-align:1px; }
  .who{ margin-left:auto; display:flex; align-items:center; gap:12px; font-size:0.85rem; color:var(--muted); white-space:nowrap; }
  .who b{ color:var(--ink); font-weight:700; }
  .link-btn{ font-family:inherit; font-size:0.85rem; font-weight:700; color:var(--muted); background:none; border:none; padding:4px 2px; cursor:pointer; }
  .link-btn:hover{ color:var(--accent); }
  .subnav{ display:flex; gap:2px; padding:3px; background:var(--line-soft); border-radius:10px; width:max-content; max-width:100%; overflow-x:auto; margin:16px 0 18px; }
  .sub-btn{ font-family:inherit; font-size:0.86rem; font-weight:700; color:var(--muted); background:none; border:none; padding:7px 14px; border-radius:8px; cursor:pointer; white-space:nowrap; }
  .subnav.fill{ width:100%; } .subnav.fill .sub-btn{ flex:1; padding:7px 8px; }
  .sub-btn.active{ background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(23,18,43,0.08); }
  .page-gap{ height:18px; }
  @media (max-width:700px){
    header.top{ gap:12px; padding:12px 0; }
    header.top .nav{ display:none; }
    .bottom-nav{ position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; background:#fff; border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); }
    .bottom-nav .nav-btn{ flex:1; font-size:0.78rem; padding:10px 2px; text-align:center; }
    .who .nm{ display:none; }
    .subnav{ flex-wrap:wrap; width:auto; }
    details.hint .hint-body{ position:fixed; left:16px; right:16px; top:auto; bottom:calc(76px + env(safe-area-inset-bottom)); width:auto; }
    .logo-mark{ height:18px; }
    .bottom-nav .nav-btn.active{ background:var(--accent-soft); color:var(--accent); }
  }
  @media (min-width:701px){ .bottom-nav{ display:none; } }

  /* Иерархия: заголовок страницы → раздел → строка. Без плашек ради плашек */
  .panel{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; }
  @media (max-width:700px){ .panel{ padding:16px; border-radius:10px; } }
  .panel + .panel{ margin-top:16px; }
  .ph{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 16px; }
  h2.panel-title{ font-size:1.4rem; font-weight:800; letter-spacing:-0.02em; margin:0 0 16px; line-height:1.2; }
  .ph h2.panel-title{ margin:0; }
  h3.sec{ font-size:1.05rem; font-weight:800; color:var(--ink); margin:26px 0 8px; letter-spacing:-0.01em; }
  h3.sec .muted{ font-weight:600; font-size:0.85rem; }
  .lead{ font-size:0.95rem; color:var(--ink); margin:-6px 0 14px; }
  .muted{ color:var(--muted); }
  .small{ font-size:0.84rem; }
  .split{ display:grid; grid-template-columns:minmax(300px, 380px) 1fr; gap:18px; align-items:start; }
  .split.wide{ grid-template-columns:minmax(260px, 310px) 1fr; }
  @media (max-width:960px){ .split, .split.wide{ grid-template-columns:1fr; } }
  .split > *{ min-width:0; }
  table.ed-t{ min-width:860px; }
  table.ed-t select{ min-width:120px; }

  .btn{ font-family:inherit; font-size:0.9rem; font-weight:700; padding:10px 18px; border-radius:10px; border:1.5px solid transparent; cursor:pointer; white-space:nowrap; }
  .btn:disabled{ opacity:0.45; cursor:default; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover:not(:disabled){ background:var(--accent-dark); }
  .btn-secondary{ background:#fff; border-color:var(--line); color:var(--ink); }
  .btn-secondary:hover:not(:disabled){ border-color:var(--accent); }
  .btn-danger{ background:#fff; border-color:#F2C4CA; color:var(--red); }
  .btn-danger:hover:not(:disabled){ background:var(--red-soft); }
  .btn-sm{ padding:6px 11px; font-size:0.8rem; border-radius:8px; }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; }
  @media (max-width:700px){ .btn{ padding:12px 18px; } .btn-sm{ padding:8px 12px; } }

  /* Закреплённая снизу кнопка сохранения */
  .savebar{ position:sticky; bottom:0; z-index:20; display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:#fff; border-top:1px solid var(--line);
    margin:22px -24px -22px; padding:14px 24px; border-radius:0 0 var(--radius) var(--radius); box-shadow:0 -8px 20px rgba(23,18,43,0.06); }
  .savebar .sb-info{ font-size:0.9rem; color:var(--muted); margin-right:auto; }
  .savebar .sb-info b{ color:var(--ink); }
  @media (max-width:700px){ .savebar{ bottom:calc(58px + env(safe-area-inset-bottom)); margin:18px -16px -16px; padding:12px 16px; border-radius:0; } .savebar .btn{ flex:1 1 auto; } .savebar .sb-info{ font-size:0.82rem; } .savebar .sb-info:empty{ display:none; } }
  .no-bnav .savebar{ bottom:0; }

  /* Подсказка по «?» вместо серых абзацев */
  details.hint{ display:inline-block; position:relative; }
  details.hint summary{ list-style:none; cursor:pointer; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line); color:var(--muted); font-size:0.78rem; font-weight:800; display:flex; align-items:center; justify-content:center; }
  details.hint summary::-webkit-details-marker{ display:none; }
  details.hint .hint-body b{ color:#fff; font-weight:800; }
  details.hint[open] summary{ border-color:var(--accent); color:var(--accent); }
  details.hint .hint-body{ position:absolute; z-index:35; left:0; top:28px; width:min(360px, 80vw); background:var(--ink); color:#fff; font-size:0.84rem; font-weight:500; line-height:1.5; padding:12px 14px; border-radius:10px; box-shadow:0 10px 30px rgba(23,18,43,0.25); }

  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label{ font-size:0.82rem; font-weight:700; color:var(--muted); }
  input[type=text], input[type=password], input[type=number], input[type=date], input[type=time], select, textarea{
    font-family:inherit; font-size:0.95rem; font-weight:500; color:var(--ink); background:#fff; border:1.5px solid var(--line); border-radius:9px; padding:9px 11px; outline:none; width:100%;
  }
  input:focus, select:focus, textarea:focus{ border-color:var(--accent); }
  input::placeholder, textarea::placeholder{ color:#BEB8CE; opacity:1; }
  input:disabled, select:disabled, textarea:disabled{ background:#F4F2F9; color:#9E98B0; border-color:#ECE8F4; cursor:not-allowed; }
  .days{ display:flex; gap:6px; flex-wrap:wrap; }
  .days button{ font-family:inherit; font-size:0.84rem; font-weight:700; min-width:44px; padding:7px 10px; border-radius:8px; border:1.5px solid var(--line); background:#fff; color:var(--muted); cursor:pointer; }
  .days button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .days button.all{ margin-left:6px; }
  .dates{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .dates .dt{ border:1.5px solid var(--line); border-radius:10px; padding:7px 11px; background:#fff; cursor:pointer; text-align:left; font-family:inherit; min-width:120px; }
  .dates .dt b{ display:block; font-size:0.9rem; }
  .dates .dt span{ display:block; font-size:0.72rem; color:var(--muted); line-height:1.3; }
  .dates .dt.on{ border-color:var(--accent); background:var(--accent-soft); }
  .dates .dt .warn{ color:var(--amber); }
  details.past{ margin-top:18px; }
  details.past summary{ cursor:pointer; font-size:0.82rem; font-weight:700; color:var(--muted); }
  details.past .inner{ opacity:0.55; }
  .ptask h2{ font-size:15pt; text-align:left; margin:0 0 4px; }
  .ptask h3{ font-size:12pt; margin:14px 0 4px; }
  .ptask th.tick, .ptask td.tick{ width:14mm; text-align:center; }
  textarea{ resize:vertical; min-height:60px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row > .field{ flex:1 1 160px; }

  .msg{ font-size:0.9rem; padding:11px 14px; border-radius:10px; margin:10px 0; white-space:pre-line; }
  .msg.err{ background:var(--red-soft); color:#9B1C2C; }
  .msg.ok{ background:var(--ok-soft); color:var(--ok); }
  .msg.warn{ background:var(--amber-soft); color:#7A4E0E; }
  .msg.info{ background:var(--blue-soft); color:#1E4E80; }

  table.t{ width:100%; border-collapse:collapse; font-size:0.92rem; }
  table.t th{ text-align:left; font-size:0.8rem; font-weight:700; color:var(--muted); padding:8px 10px; border-bottom:1.5px solid var(--line); white-space:nowrap; }
  table.t td{ padding:9px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  table.t td .sub{ display:block; font-size:0.8rem; color:var(--muted); font-weight:500; margin-top:1px; }
  table.t tr.grp td{ background:var(--hover); font-weight:700; }
  table.t tr.click{ cursor:pointer; }
  table.t tr.click:hover td{ background:var(--hover); }
  table.t tr.sel td{ background:var(--accent-soft); }
  table.t td.num, table.t th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  table.t tfoot td{ font-weight:800; border-top:1.5px solid var(--line); }
  .t-wrap{ overflow-x:auto; }

  .chip{ display:inline-block; font-size:0.72rem; font-weight:700; padding:2px 9px; border-radius:999px; white-space:nowrap; }
  .st-Черновик{ background:#EFECF6; color:var(--muted); }
  .st-Отправлена{ background:var(--accent-soft); color:var(--accent-dark); }
  .st-На-проверке{ background:var(--amber-soft); color:var(--amber); }
  .st-Возвращена{ background:var(--red-soft); color:var(--red); }
  .st-Утверждена{ background:var(--ok-soft); color:var(--ok); }
  .st-Отгружена{ background:#E9E6F1; color:#4A4560; }
  .st-Получена{ background:var(--ok-soft); color:var(--ok); }
  .st-Получена-с-расхождением{ background:var(--amber-soft); color:var(--amber); }
  .chip.late{ background:var(--red-soft); color:var(--red); }

  .items-grid{ display:grid; grid-template-columns:1fr 1fr; column-gap:36px; }
  @media (max-width:1000px){ .items-grid{ grid-template-columns:1fr; } }
  .item-row{ display:grid; grid-template-columns:1fr 70px 132px; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line-soft); min-height:52px; }
  .item-row:last-child{ border-bottom:none; }
  @media (min-width:1001px){ .items-grid .item-row:nth-last-child(2):nth-child(odd){ border-bottom:none; } }
  .item-row .nm{ font-weight:700; font-size:0.95rem; line-height:1.25; }
  .item-row .meta{ font-size:0.8rem; color:var(--muted); line-height:1.3; margin-top:2px; }
  .item-row .prev{ font-size:0.8rem; color:var(--faint); text-align:right; }
  .item-row .note{ font-size:0.76rem; color:var(--red); }
  .qty{ display:flex; align-items:center; gap:4px; }

45ZM676.775 73.7578C658.369 73.7578 649.166 85.2621 646.098 107.247H706.173C704.128 87.0516 695.692 73.7578 676.775 73.7578ZM783.594 2.06641C792.771 2.06644 800.211 9.50571 800.211 18.6826C800.211 27.8597 792.771 35.2988 783.594 35.2988H783.055C773.878 35.2988 766.439 27.8597 766.439 18.6826C766.439 9.50569 773.878 2.06641 783.055 2.06641H783.594Z" fill="#7002FF"/></svg>';
const TOKEN_KEY = 'slt_zayavki_token';
const WD = ['вс','пн','вт','ср','чт','пт','сб'];

/* ============================== СОСТОЯНИЕ ============================== */
// localStorage — только чтобы не вводить пароль каждый раз; все данные живут в Таблице.
const store = {
  get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } },
  set(k,v){ try { localStorage.setItem(k, v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const S = {
  token: store.get(TOKEN_KEY), data: null, tab: null, busy: false, msg: null,
  form: null,          // новая/редактируемая заявка
  mineSel: null,       // выбранная заявка в «Мои заявки»
  inbox: { status: 'active', sel: null, sup: null },
  sup: null,           // редактор поставки
  acc: null,           // приёмка «с правками»
  stk: { mode: 'items', q: '', open: '', vals: {}, units: {}, place: '', note: '', cnt: '', cntLoaded: '', cntVals: {}, cntNote: '' },
  cnt: { q: '', vals: {}, units: {}, comment: '', loaded: '' },
  pur: { source: '', to: '', date: '', comment: '', all: false, vals: {}, packs: {} },   // закупка на склад   // пересчёт ресторана   // остатки
  pendingData: null,   // свежие данные из ответа на сохранение
  cart: null,          // заказ ресторана
  plc: { sel: null, f: null },   // места
  msgTab: 'driver',
  ed: null,            // редактор закупок
  sumDate: '', drvDate: '',
  tr: null,            // перемещение
  inv: { from: '', to: '', q: '', checked: {} },
  mov: { from: '', to: '', src: '', dst: '', type: '', q: '' },
  cat: { q: '', sel: null, f: null },   // справочник позиций
  justCreated: null
};

/* ============================== УТИЛИТЫ ============================== */
const $ = (sel) => document.querySelector(sel);
function h(v){ return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function str(v){ return v === null || v === undefined ? '' : String(v).trim(); }
function num(v){ const x = Number(String(v === null || v === undefined ? '' : v).replace(',', '.').replace(/\s/g,'')); return isFinite(x) ? x : 0; }
function fmtN(x){ return (Math.round(x * 1000) / 1000).toLocaleString('ru-RU'); }
function ru(d){ if (!d) return ''; const p = d.slice(0,10).split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
function ruShort(d){ if (!d) return ''; const p = d.split('-'); return p[2] + '.' + p[1]; }
function wd(d){ const p = d.split('-').map(Number); return WD[new Date(Date.UTC(p[0], p[1]-1, p[2], 12)).getUTCDay()]; }
function ruDay(d){ return d ? wd(d) + ' ' + ruShort(d) : ''; }
function ruDT(dt){ return dt ? ru(dt) + ' ' + dt.slice(11,16) : ''; }
function todayYmd(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addDays(d, k){ const p = d.split('-').map(Number); const x = new Date(Date.UTC(p[0], p[1]-1, p[2]+k, 12)); return x.toISOString().slice(0,10); }
function chip(st){ return '<span class="chip st-' + h(st.replace(/\s/g,'-')) + '">' + h(st) + '</span>'; }
function by(arr, fn){ const m = {}; arr.forEach(x => { const k = fn(x); (m[k] = m[k] || []).push(x); }); return m; }
function uniq(arr){ return Array.from(new Set(arr)); }
const role = () => S.data ? S.data.user.role : '';
const isSuper = () => ['Закупки','Админ'].indexOf(role()) >= 0;
const isRest = () => role() === 'Ресторан';
const canEditRequests = () => isSuper();
function itemById(id){ return (S.data.items || []).find(i => i.id === id); }
function place(name){ return (S.data.places || []).find(p => p.name === name); }
function restaurants(){ return (S.data.places || []).filter(p => p.type === 'Ресторан').map(p => p.name); }
function linesOf(reqId){ return S.data.lines.filter(l => l.reqId === reqId); }
function movOf(no){ return S.data.movements.filter(m => m.no === no); }

/* ============================== API ============================== */
async function api(action, payload){
  const t0 = performance.now();
  const body = Object.assign({ action: action, token: S.token }, payload || {});
  if (action !== 'bootstrap' && action !== 'login') body.withData = true;
  let res;
  try {
    res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  } catch(e) { throw new Error('Нет связи с сервером. Проверьте интернет и попробуйте ещё раз'); }
  let j;
  try { j = await res.json(); } catch(e){ throw new Error('Сервер ответил ошибкой. Попробуйте обновить страницу'); }
  if (!j.ok) {
    if (j.auth) { logout(true); }
    throw new Error(j.error || 'Ошибка');
  }
  if (j.data) { S.pendingData = j.data; delete j.data; }
  S.timing = { server: j.ms, total: Math.round(performance.now() - t0) };
  return j;
}

// Действия сохраняются в фоне: экран не блокируется, можно работать дальше.
// Одно и то же действие повторно не запускается, пока не закончилось первое.
// Если человек за это время ушёл на другой экран, результат не уводит его обратно.
const RUNNING = {};
async function run(fn, okText){
  const key = fn.toString();
  if (RUNNING[key]) return;
  RUNNING[key] = true;
  const nav0 = S.navSeq || 0;
  S.bg = (S.bg || 0) + 1; S.msg = null; render();
  let r;
  try {
    r = await fn();
    S.msgKind = null;
    if (okText) { const t = typeof okText === 'function' ? okText(r) : okText; S.msg = { kind: S.msgKind || 'ok', text: t }; }
  } catch(e) {
    S.msg = { kind: 'err', text: e.message };
  } finally {
    delete RUNNING[key];
    S.bg--;
    if ((S.navSeq || 0) !== nav0 && S.userTab) S.tab = S.userTab;   // человек ушёл на другой экран — оставляем его там
    renderWhenIdle();
    if (S.msg && (S.navSeq || 0) === nav0) window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  return r;
}
// После выбора в левом списке показать карточку справа (на узком экране она ниже списка).
function showDetail(){
  requestAnimationFrame(() => {
    const el = document.querySelector('.split > div:last-child > .panel');
    if (!el) return;
    const r = el.getBoundingClientRect();
    if (r.top < 0 || r.top > window.innerHeight * 0.6) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

const DATA_KEY = 'slt_zayavki_data';
function tokenLogin(){ return (S.token || '').split('|')[0]; }
function saveDataCache(d){ try { localStorage.setItem(DATA_KEY, JSON.stringify({ login: tokenLogin(), v: VERSION, d: d })); } catch(e){} }
function loadDataCache(){ try { const x = JSON.parse(localStorage.getItem(DATA_KEY) || 'null'); return x && x.login === tokenLogin() && x.v === VERSION ? x.d : null; } catch(e){ return null; } }
async function reload(){
  let d = S.pendingData;
  S.pendingData = null;
  if (!d) d = await api('bootstrap');
  applyData(d);
}
function applyData(d){
  if (S.hist) mergeHist(d, S.hist);
  S.data = d;
  saveDataCache(d);
  if (S.cart && !cartDirty()) S.cart = null;
  if (!S.tab || !tabs().some(t => t.id === S.tab)) S.tab = tabs()[0].id;
  if (!S.sumDate) S.sumDate = defaultShipDate();
  if (!S.drvDate) S.drvDate = defaultShipDate();
}

function cover(on){
  let c = document.getElementById('cover');
  if (on && !c) { c = document.createElement('div'); c.id = 'cover'; c.className = 'loading-cover'; c.innerHTML = '<span class="spinner"></span> Загружаем'; document.body.appendChild(c); }
  if (!on && c) c.remove();
}

function defaultShipDate(){
  const t = todayYmd();
  const ds = [];
  (S.data.places || []).forEach(p => (p.deliveries || []).forEach(d => { if (d.date >= t) ds.push(d.date); }));
  S.data.invoices.forEach(i => { if (i.date >= t) ds.push(i.date); });
  ds.sort();
  return ds[0] || t;
}

/* ============================== ВХОД ============================== */
function renderLogin(err){
  $('#app').innerHTML =
    '<div class="login-wrap"><div style="display:flex;justify-content:center;margin-bottom:18px">' + LOGO + '</div>' +
    '<div class="panel">' + title('Заявки на расходники') +
    (err ? '<div class="msg err">' + h(err) + '</div>' : '') +
    '<form id="login-form"><div class="field"><label>Логин</label><input type="text" id="lg" autocomplete="username" autofocus></div>' +
    '<div class="field"><label>Пароль</label><input type="password" id="pw" autocomplete="current-password"></div>' +
    '<button class="btn btn-primary" style="width:100%" type="submit">Войти</button></form>' +
    '<p class="small muted" style="margin:14px 0 0">Логин и пароль есть в переписке с маркетологом в Telegram.</p></div>' +
    '<p class="small muted" style="text-align:center">Версия ' + VERSION + '</p></div>';
  $('#login-form').onsubmit = async (e) => {
    e.preventDefault();
    const login = str($('#lg').value), password = $('#pw').value;
    if (!login || !password) return renderLogin('Введите логин и пароль');
    cover(true);
    try {
      const r = await api('login', { login: login, password: password });
      S.token = r.token; store.set(TOKEN_KEY, r.token);
      await reload();
      cover(false); render();
    } catch(err) { cover(false); renderLogin(err.message); }
  };
}

function logout(expired){
  S.token = ''; S.data = null; S.tab = null; S.form = null; S.ed = null; S.tr = null;
  store.del(TOKEN_KEY); store.del(DATA_KEY);
  renderLogin(expired ? 'Сессия закончилась. Войдите заново' : '');
}

/* ============================== РАЗДЕЛЫ ============================== */
// Разделы — крупная навигация (сверху, на телефоне снизу). Внутри раздела — подразделы переключателем.
function sections(){
  const r = role(), d = S.data;
  const nTasks = d && d.tasks ? d.tasks.filter(t => t.date >= todayYmd() && t.status !== 'Отгружена').length : 0;
  const hasTasks = d && d.tasks && d.tasks.length > 0;
  const S_ = [];
  const sec = (id, title, subs) => { subs = subs.filter(Boolean); if (subs.length) S_.push({ id, title, subs, cnt: subs.reduce((a, x) => a + (x.cnt || 0), 0) }); };
  if (r === 'Ресторан') {
    const nAcc = d ? toAccept().reqs.length + toAccept().invs.length : 0;
    const oc = d ? myOpenCount() : null;
    sec('order', 'Заказ', [{ id: 'cart', title: 'Заказ' }]);
    sec('mine', 'Заявки', [{ id: 'mine', title: 'Мои заявки', cnt: nAcc }, S.form && S.form.id ? { id: 'req', title: 'Заявка ' + S.form.id } : null]);
    if (hasTasks) sec('tasks', 'Сборка', [{ id: 'tasks', title: 'Сборка', cnt: nTasks }]);
    sec('docs', 'Документы', [{ id: 'invoices', title: 'Накладные' }, { id: 'transfer', title: 'Перемещение' }]);
    sec('count', 'Пересчёт', [{ id: 'count', title: 'Пересчёт', cnt: oc && oc.status === 'Возвращён' ? 1 : 0 }]);
  } else if (r === 'Закупки' || r === 'Админ') {
    const nNew = d ? supplies().filter(s => s.reqs.some(r => ACTIVE_ST.indexOf(r.status) >= 0)).length : 0;
    sec('sup', 'Поставки', [{ id: 'inbox', title: 'Поставки', cnt: nNew }, { id: 'summary', title: 'Свод на дату' }, { id: 'messages', title: 'Сообщения' },
      { id: 'req', title: S.form && S.form.id ? 'Заявка ' + S.form.id : 'Заявка вручную' }]);
    sec('store', 'Склад', [{ id: 'stock', title: 'Остатки' }, { id: 'purchase', title: 'Закупка' }, { id: 'counts', title: 'Пересчёты ресторанов', cnt: d ? pendingCounts().length : 0 }]);
    sec('docs', 'Документы', [{ id: 'invoices', title: 'Накладные' }, { id: 'transfer', title: 'Перемещение' }, { id: 'movements', title: 'Отчёт' }, nTasks ? { id: 'tasks', title: 'Сборка', cnt: nTasks } : null]);
    sec('ref', 'Справочник', [{ id: 'catalog', title: 'Позиции' }, { id: 'places', title: 'Места' }]);
  } else if (r === 'Водитель') {
    sec('route', 'Маршрут', [{ id: 'driver', title: 'Маршрут' }]);
    sec('tasks', 'Сборка', [{ id: 'tasks', title: 'Сборка', cnt: nTasks }]);
    sec('docs', 'Накладные', [{ id: 'invoices', title: 'Накладные' }]);
  } else if (r === 'Экономист') {
    sec('rep', 'Отчёт', [{ id: 'movements', title: 'Отчёт' }]);
    sec('docs', 'Накладные', [{ id: 'invoices', title: 'Накладные' }]);
  } else if (r === 'Маркетолог') {
    sec('tasks', 'Сборка', [{ id: 'tasks', title: 'Сборка', cnt: nTasks }]);
    sec('docs', 'Накладные', [{ id: 'invoices', title: 'Накладные' }]);
  } else {
    sec('sup', 'Поставки', [{ id: 'inbox', title: 'Поставки' }, { id: 'summary', title: 'Свод на дату' }]);
    sec('rep', 'Отчёт', [{ id: 'movements', title: 'Отчёт' }]);
    sec('docs', 'Накладные', [{ id: 'invoices', title: 'Накладные' }]);
  }
  return S_;
}
// Плоский список видов (для проверок «такая вкладка есть»)
function tabs(){ return [].concat.apply([], sections().map(s => s.subs)); }
function secOf(tab){ return sections().find(s => s.subs.some(x => x.id === tab)); }

/* ============================== ОТРИСОВКА ============================== */
// Пока кнопка нажата, перерисовку откладываем: иначе после правки поля (change) кнопка
// заменяется под курсором и клик теряется.
// Меню «⋯» и подсказки «?» закрываются кликом мимо, по Esc и после выбора пункта
document.addEventListener('click', e => {
  document.querySelectorAll('details.menu[open], details.hint[open]').forEach(d => {
    if (!d.contains(e.target) || (d.classList.contains('menu') && e.target.closest('.menu-body button'))) d.removeAttribute('open');
  });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('details.menu[open], details.hint[open]').forEach(d => d.removeAttribute('open')); });
document.addEventListener('toggle', e => {   // открыто только одно
  const t = e.target; if (!t.open || !t.matches || !t.matches('details.menu, details.hint')) return;
  document.querySelectorAll('details.menu[open], details.hint[open]').forEach(d => { if (d !== t) d.removeAttribute('open'); });
}, true);
let holdRender = false, renderPending = false;
document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('button, .btn, .card, .dt, tr.click')) holdRender = true; }, true);
window.addEventListener('pointerup', () => setTimeout(() => { holdRender = false; if (renderPending) { renderPending = false; render(); } }, 0), true);
function render(){
  if (holdRender) { renderPending = true; return; }
  if (!S.token || !S.data) return renderLogin();
  const u = S.data.user;
  const SEC = sections(), cur = secOf(S.tab) || SEC[0];
  const navBtns = SEC.map(s => '<button class="nav-btn' + (cur && s.id === cur.id ? ' active' : '') + '" onclick="App.sec(\'' + s.id + '\')">' + h(s.title) + (s.cnt ? '<span class="cnt">' + s.cnt + '</span>' : '') + '</button>').join('');
  const timing = S.timing && isSuper() ? '<span title="Последняя загрузка. Скрипт Google ' + fmtN((S.timing.server || 0) / 1000) + ' с, вместе с интернетом ' + fmtN(S.timing.total / 1000) + ' с">' + fmtN(Math.round(S.timing.total / 100) / 10) + ' с</span>' : '';
  let html =
    '<header class="top">' + LOGO + '<nav class="nav">' + navBtns + '</nav>' +
    '<div class="who">' + (S.bg > 0 ? '<span><span class="spinner"></span> Сохраняем</span>' : S.syncing ? '<span>Обновляем данные</span>' : timing) +
    '<span class="nm"><b>' + h(u.place || u.name) + '</b></span>' +
    '<button class="link-btn" onclick="App.refresh()">Обновить</button><button class="link-btn" onclick="App.logout()">Выйти</button></div></header>';
  if (cur && cur.subs.length > 1) html += '<div class="subnav">' + cur.subs.map(x => '<button class="sub-btn' + (x.id === S.tab ? ' active' : '') + '" onclick="App.tab(\'' + x.id + '\')">' + h(x.title) + (x.cnt ? '<span class="cnt">' + x.cnt + '</span>' : '') + '</button>').join('') + '</div>';
  else html += '<div class="page-gap"></div>';
  if (S.msg) html += '<div class="msg ' + S.msg.kind + '">' + h(S.msg.text) + '</div>';
  const V = VIEWS[S.tab];
  html += V ? V() : '';
  html += '<nav class="bottom-nav">' + navBtns + '</nav>';
  $('#app').innerHTML = html;
  if (AFTER[S.tab]) AFTER[S.tab]();
}
// Заголовок страницы с подсказкой по «?»
function title(t, hintText, extra){ return '<div class="ph"><h2 class="panel-title">' + t + '</h2>' + (hintText ? hint(hintText) : '') + (extra || '') + '</div>'; }
function hint(t){ return '<details class="hint"><summary aria-label="Подсказка">?</summary><div class="hint-body">' + t + '</div></details>'; }
// Закреплённая снизу полоса с главным действием
function savebar(info, buttons){ if (S.bg > 0) info = '<span class="spinner"></span> Сохраняем'; return '<div class="savebar">' + (info ? '<div class="sb-info">' + info + '</div>' : '<div class="sb-info"></div>') + buttons + '</div>'; }
function plural(n, a, b, c5){ const m = n % 10, m100 = n % 100; return n + ' ' + (m === 1 && m100 !== 11 ? a : (m >= 2 && m <= 4 && (m100 < 10 || m100 >= 20) ? b : c5)); }

const VIEWS = {}, AFTER = {};

/* ---------- Заказ ресторана (каждый день) ---------- */
// Каждая позиция уходит в ближайшую поставку своего источника; ресторан видит только дату и время приёма.
function cartInit(){
  const T = S.data.targets || {};
  const c = { qty: {}, dirty: {}, free: ((T.__free && T.__free.lines) || []).map(x => ({ name: x.name, unit: x.unit, qty: x.qty })), freeDirty: false, comment: '', q: '' };
  S.data.items.forEach(i => { const t = T[i.id]; if (t && t.qty) c.qty[i.id] = t.qty; });
  S.cart = c;
}
function cartDirty(){ return !!S.cart && (Object.keys(S.cart.dirty).length > 0 || S.cart.freeDirty || !!str(S.cart.comment)); }
// Последнее количество по каждой позиции (для «было» и «Как в прошлый раз»), не считая открытых заявок.
function lastQty(){
  const out = {};
  const reqs = S.data.requests.filter(r => !(r.status === 'Отправлена' && r.shipDate >= todayYmd())).sort((a, b) => b.shipDate.localeCompare(a.shipDate));
  reqs.forEach(r => linesOf(r.id).forEach(l => {
    if (!l.itemId || l.itemId in out) return;
    const q = l.approved !== null ? l.approved : l.requested;
    if (q) out[l.itemId] = { qty: q, date: r.shipDate };
  }));
  return out;
}
function dlText(t){ return t && t.deadline ? ruDay(t.deadline.slice(0, 10)) + ' ' + t.deadline.slice(11) : ''; }

// «Заказ до 16:00.» сегодня, иначе «Заказ до 16:00, 28.10.»
function deadlineText(dl){ if (!dl) return ''; const d = dl.slice(0, 10), t = dl.slice(11, 16); return 'Заказ до ' + t + (d === todayYmd() ? '' : ', ' + ruShort(d)) + '.'; }
// Что ресторан заказывает чаще всего (по истории заявок)
function frequentItems(){
  const n = {};
  S.data.requests.forEach(r => linesOf(r.id).forEach(l => { if (l.itemId) n[l.itemId] = (n[l.itemId] || 0) + 1; }));
  return Object.keys(n).filter(id => n[id] >= 2 && itemById(id) && itemById(id).active).sort((a, b) => n[b] - n[a]).slice(0, 10);
}
function cartRow(i, T, C, prev, mainDate){
  const t = T[i.id] || { none: true };
  const v = t.locked ? t.lockedQty : (C.qty[i.id] || '');
  const p = prev[i.id];
  const dis = t.none || t.locked ? ' disabled' : '';
  const meta = [h(i.unitLabel || i.unit) + (i.mult > 1 ? ', кратно ' + fmtN(i.mult) : '')];
  if (t.none) meta.push('<span style="color:var(--red)">Сейчас нет поставки</span>');
  else if (t.locked) meta.push('<span style="color:var(--amber)">На ' + h(ruShort(t.date)) + ' уже заказано ' + h(fmtN(t.lockedQty)) + '</span>');
  else if (t.date !== mainDate) meta.push('Поставка ' + h(ruShort(t.date)));
  return '<div class="item-row' + (v ? ' has-qty' : '') + '" data-id="' + h(i.id) + '">' +
    '<div><div class="nm">' + h(i.name) + '</div><div class="meta">' + meta.join('. ') + '</div></div>' +
    '<div class="prev">' + (p ? 'было ' + fmtN(p.qty) : '') + '</div>' +
    '<div class="qty"><button type="button"' + dis + ' aria-label="Меньше" onclick="App.cstep(\'' + h(i.id) + '\',-1)">−</button>' +
    '<input type="text" inputmode="decimal" aria-label="Количество" value="' + h(v) + '"' + dis + ' onchange="App.cset(\'' + h(i.id) + '\', this.value)">' +
    '<button type="button"' + dis + ' aria-label="Больше" onclick="App.cstep(\'' + h(i.id) + '\',1)">+</button></div></div>';
}
VIEWS.cart = function(){
  if (!S.cart) cartInit();
  const C = S.cart, T = S.data.targets || {};
  const prev = lastQty();
  const items = S.data.items.filter(i => i.active);
  const cats = uniq(S.data.categories.concat(items.map(i => i.category || 'Прочее')));
  const q = C.q.toLowerCase();

  // Ближайшие поставки: «Заказ до 16:00. Поставка 29.10.2026»
  const slots = {}, byDate = {};
  items.forEach(i => { const t = T[i.id]; if (!t || t.none) return; const k = t.deadline + '|' + t.date; (slots[k] = slots[k] || {})[i.category] = 1; byDate[t.date] = (byDate[t.date] || 0) + 1; });
  const mainDate = Object.keys(byDate).sort((a, b) => byDate[b] - byDate[a])[0];
  const keys = Object.keys(slots).sort().slice(0, 4);
  const dl = keys.map(k => { const p = k.split('|'); return '<li><b>' + h(deadlineText(p[0])) + ' Поставка ' + h(ru(p[1])) + '</b>' + (keys.length > 1 ? '<span class="what">' + h(Object.keys(slots[k]).join(', ')) + '</span>' : '') + '</li>'; }).join('');

  let html = '<div class="panel">' + title('Заказ', 'Позиции можно добавлять в любой день. Каждая уйдёт в ближайшую поставку. Если приём на неё уже закрыт, позиция попадёт в следующую.') +
    (dl ? '<ul class="deadlines">' + dl + '</ul>' : '') +
    '<div class="row" style="align-items:flex-end"><div class="field" style="flex:1 1 240px;margin-bottom:6px"><input type="text" id="c-q" value="' + h(C.q) + '" placeholder="Найти позицию" aria-label="Поиск" oninput="App.cq(this.value)"></div>' +
    (Object.keys(prev).length ? '<div class="field" style="flex:0 0 auto;margin-bottom:6px"><button class="btn btn-secondary" onclick="App.cartRepeat()">Как в прошлый раз</button></div>' : '') + '</div>';
  if (!q) html += '<div class="chips">' + cats.filter(cat => items.some(i => (i.category || 'Прочее') === cat)).map(cat => '<button type="button" onclick="App.jump(\'cat-' + h(cat) + '\')">' + h(cat) + '</button>').join('') + '</div>';

  const freq = q ? [] : frequentItems();
  if (freq.length) html += '<h3 class="sec">Часто заказываете</h3><div class="items-grid">' + freq.map(id => cartRow(itemById(id), T, C, prev, mainDate)).join('') + '</div>';
  cats.forEach(cat => {
    const list = items.filter(i => (i.category || 'Прочее') === cat && (!q || i.name.toLowerCase().indexOf(q) >= 0));
    if (!list.length) return;
    html += '<h3 class="sec" id="cat-' + h(cat) + '">' + h(cat) + '</h3><div class="items-grid">' + list.map(i => cartRow(i, T, C, prev, mainDate)).join('') + '</div>';
  });

  const ft = T.__free;
  html += '<h3 class="sec">Нет в списке</h3><div class="small muted" style="margin-bottom:8px">Впишите название. Закупки проверят, есть ли такая позиция.</div>';
  const fdis = !ft || ft.locked ? ' disabled' : '';
  C.free.forEach((x, k) => {
    html += '<div class="free-row"><input type="text" placeholder="Название" value="' + h(x.name) + '"' + fdis + ' onchange="App.cfree(' + k + ',\'name\',this.value)">' +
      '<input type="text" placeholder="Ед." value="' + h(x.unit) + '"' + fdis + ' onchange="App.cfree(' + k + ',\'unit\',this.value)">' +
      '<input type="text" inputmode="decimal" placeholder="Кол-во" value="' + h(x.qty) + '"' + fdis + ' onchange="App.cfree(' + k + ',\'qty\',this.value)">' +
      '<button class="x-btn" type="button" aria-label="Убрать"' + fdis + ' onclick="App.cfreeDel(' + k + ')">×</button></div>';
  });
  if (!fdis) html += '<button class="btn btn-secondary btn-sm" type="button" onclick="App.cfreeAdd()">Добавить позицию</button>';
  html += '<h3 class="sec">Комментарий для закупок</h3><textarea oninput="App.ccomment(this.value)">' + h(C.comment) + '</textarea>';
  const n = Object.keys(C.dirty).length + (C.freeDirty ? 1 : 0);
  html += savebar(n ? 'Изменено: <b>' + plural(n, 'позиция', 'позиции', 'позиций') + '</b>' : 'Изменений нет',
    (n ? '<button class="btn btn-secondary" onclick="App.cartReset()">Отменить</button>' : '') +
    '<button class="btn btn-primary" id="cart-save" onclick="App.cartSave()"' + (n || str(C.comment) ? '' : ' disabled') + '>Сохранить заказ</button>');
  return html + '</div>';
};

/* ---------- Заявка целиком: правка рестораном, «Заявка вручную» у закупок ---------- */

  else html += '<div class="small muted" style="margin-top:8px">Новые позиции добавляются во вкладке «Заказ».</div>';
  html += '<div class="field" style="margin-top:12px"><label>Комментарий</label><textarea onchange="App.rf(\'comment\', this.value, true)">' + h(f.comment) + '</textarea></div>';
  html += savebar('', '<button class="btn btn-secondary" onclick="App.cancelEdit()">Отмена</button><button class="btn btn-primary" onclick="App.saveReq()">' + (sup ? 'Сохранить заявку' : 'Сохранить и отправить') + '</button>');
  return html + '</div>';
};

/* ---------- Поиск позиции по первым буквам ---------- */
// Совпадение с началом любого слова названия: «крыш» → «Крышка…», «200» → «Стакан 200 мл».
function comboMatch(q){
  const items = S.data.items.filter(i => i.active);
  if (!q) return items;
  const words = n => n.toLowerCase().split(/[\s«»"().,:;+\-\/]+/).filter(Boolean);
  const qs = q.toLowerCase().split(/\s+/).filter(Boolean);
  return items.filter(i => { const w = words(i.name); return qs.every(x => w.some(y => y.indexOf(x) === 0)); })
    .sort((a, b) => (b.name.toLowerCase().indexOf(qs[0]) === 0) - (a.name.toLowerCase().indexOf(qs[0]) === 0));
}
function combo(key, value){
  return '<div class="combo" data-key="' + h(key) + '"><input type="text" value="' + h(value) + '" placeholder="Найти позицию" autocomplete="off"' +
    ' onfocus="this.select();App.comboIn(this)" oninput="App.comboIn(this)" onkeydown="App.comboKey(event,this)" onblur="App.comboBlur(this)"><div class="combo-list"></div></div>';
}

/* ---------- Мои заявки (ресторан): заявки и приёмка ---------- */
function reqCats(r){ return uniq(linesOf(r.id).map(l => { const it = itemById(l.itemId); return it ? it.category : 'Нет в списке'; })).join(', '); }
const TO_ACCEPT = ['Утверждена','Отгружена'];
// Что ждёт приёмки у этого пользователя: заявки и входящие перемещения
function toAccept(){
  const me = S.data.user.place, t0 = todayYmd();
  const reqs = S.data.requests.filter(r => TO_ACCEPT.indexOf(r.status) >= 0 && r.shipDate <= t0 && (isSuper() || r.place === me));
  const invs = S.data.invoices.filter(i => i.type === 'Между ресторанами' && !i.acceptedAt && i.date <= t0 && (isSuper() || i.to === me));
  return { reqs, invs };
}
VIEWS.mine = function(){
  const reqs = S.data.requests.slice().sort((a,b) => b.shipDate.localeCompare(a.shipDate) || b.id.localeCompare(a.id));
  const ta = toAccept();
  if (!reqs.length && !ta.invs.length) return '<div class="panel">' + title('Мои заявки') + '<div class="empty">Заявок пока нет. Заказ оформляется во вкладке «Заказ».</div></div>';
  const ids = reqs.map(r => r.id).concat(ta.invs.map(i => 'inv:' + i.no));
  if (!S.mineSel || ids.indexOf(S.mineSel) < 0) S.mineSel = ta.reqs[0] ? ta.reqs[0].id : (ta.invs[0] ? 'inv:' + ta.invs[0].no : reqs[0].id);
  const card = r => '<div class="card' + (r.id === S.mineSel ? ' sel' : '') + '" onclick="App.mineSel(\'' + r.id + '\')"><div class="top"><span class="title">' + h(reqCats(r)) + '</span>' + chip(r.status) + '</div>' +
    '<div class="sub">' + plural(linesOf(r.id).length, 'позиция', 'позиции', 'позиций') + '</div></div>';
  const byDay = list => { let last = '', out = ''; list.forEach(r => { if (r.shipDate !== last) { last = r.shipDate; out += '<div class="list-date">Поставка ' + h(ruDay(r.shipDate)) + '</div>'; } out += card(r); }); return out; };
  let html = '<div class="split"><div class="panel">' + title('Мои заявки');
  if (ta.reqs.length || ta.invs.length) {
    html += '<h3 class="sec" style="margin-top:0">Нужно принять</h3><div class="card-list">' + byDay(ta.reqs) + (ta.invs.length && ta.reqs.length ? '<div class="list-date">Перемещения</div>' : '') +
      ta.invs.map(i => '<div class="card' + ('inv:' + i.no === S.mineSel ? ' sel' : '') + '" onclick="App.mineSel(\'inv:' + h(i.no) + '\')"><div class="top"><span class="title">Перемещение ' + h(ruDay(i.date)) + '</span></div>' +
        '<div class="sub">От ресторана ' + h(i.from) + ', накладная ' + h(i.no) + '</div></div>').join('') + '</div>';
  }
  const rest = reqs.filter(r => ta.reqs.indexOf(r) < 0);
  if (rest.length) html += (ta.reqs.length || ta.invs.length ? '<h3 class="sec">Все заявки</h3>' : '') + '<div class="card-list">' + byDay(rest) + '</div>';
  html += '</div><div>';
  if (S.mineSel.indexOf('inv:') === 0) html += transferAccept(S.data.invoices.find(i => i.no === S.mineSel.slice(4)));
  else html += requestDetail(S.data.requests.find(r => r.id === S.mineSel), 'rest');
  return html + '</div></div>';
};

function requestDetail(r, mode){
  if (!r) return '';
  const ls = linesOf(r.id);
  const showApproved = ls.some(l => l.approved !== null) || TO_ACCEPT.indexOf(r.status) >= 0;
  const showGot = ls.some(l => l.received !== null);
  const acc = S.acc && S.acc.id === r.id ? S.acc : null;   // режим «Принять с правками»
  let html = '<div class="panel">' + title((mode === 'rest' ? h(reqCats(r)) + ', поставка ' : 'Поставка ') + h(ruDay(r.shipDate)), '', chip(r.status));
  html += '<dl class="kv"><dt>Заявка</dt><dd>' + h(r.id) + '</dd><dt>Получатель</dt><dd>' + h(r.place) + '</dd>' +
    (r.source ? '<dt>Источник</dt><dd>' + h(r.source) + '</dd>' : '') +
    '<dt>Создана</dt><dd>' + h(ruDT(r.createdAt)) + ', ' + h(r.author) + '</dd>' +
    (r.approvedAt ? '<dt>Утверждена</dt><dd>' + h(ruDT(r.approvedAt)) + ', ' + h(r.approvedBy) + '</dd>' : '') + '</dl>';
  if (r.comment) html += '<div class="msg info">Комментарий ресторана: ' + h(r.comment) + '</div>';
  if (r.purchaseComment) html += '<div class="msg warn">Комментарий закупок: ' + h(r.purchaseComment) + '</div>';
  if (acc) html += '<div class="msg info">Впишите, сколько фактически приехало. Закупки получат уведомление о расхождении.</div>';
  html += '<div class="t-wrap"><table class="t"><thead><tr><th>Позиция</th><th class="num">Заказано</th>' + (showApproved ? '<th class="num">Утверждено</th>' : '') +
    (acc || showGot ? '<th class="num" style="width:110px">Получено</th>' : '') + '<th>Комментарий закупок</th></tr></thead><tbody>';
  ls.forEach(l => {
    let ap = '';
    const a = l.approved === null ? l.requested : l.approved;
    if (showApproved) {
      const cls = l.requested === null ? 'diff-up' : (a < l.requested ? 'diff-down' : (a > l.requested ? 'diff-up' : ''));
      ap = '<td class="num ' + cls + '">' + (a === null ? '' : fmtN(a)) + '</td>';
    }
    let got = '';
    if (acc) got = a ? '<td><input type="text" inputmode="decimal" style="text-align:right" value="' + h(acc.lines[l.lineId]) + '" oninput="App.accLine(\'' + l.lineId + '\', this.value)"></td>' : '<td></td>';
    else if (showGot) got = '<td class="num' + (l.received !== null && l.received !== a ? ' diff-down' : '') + '">' + (l.received === null ? '' : fmtN(l.received)) + '</td>';
    html += '<tr><td>' + h(l.name) + (l.requested === null ? ' <span class="chip st-Утверждена">добавили закупки</span>' : '') + '<span class="sub">' + h(l.pack || l.unit) + '</span></td>' +
      '<td class="num">' + (l.requested === null ? '' : fmtN(l.requested)) + '</td>' + ap + got + '<td class="small">' + h(l.comment) + '</td></tr>';
  });
  html += '</tbody></table></div>';
  const invs = S.data.invoices.filter(i => i.basis === r.id);
  if (invs.length) html += '<div class="actions">' + invs.map(i => '<button class="btn btn-secondary btn-sm" onclick="App.preview([\'' + h(i.no) + '\'])">Накладная ' + h(i.no) + '</button>').join('') + '</div>';
  if (r.status === 'На проверке' && mode === 'rest') html += '<div class="msg info">Закупки уже проверяют заявку, поэтому изменить её нельзя. Если что-то срочно, напишите Тане.</div>';
  // Приёмка: ресторан-получатель или закупки
  const canAcc = TO_ACCEPT.indexOf(r.status) >= 0 && (isSuper() || r.place === S.data.user.place);
  if (canAcc && (mode === 'rest' || isSuper())) {
    if (!acc) html += savebar(r.shipDate > todayYmd() ? 'Примите, когда товар приедет' : 'Проверьте, всё ли приехало',
      '<button class="btn btn-secondary" onclick="App.accStart(\'' + r.id + '\')">Принять с правками</button><button class="btn btn-primary" onclick="App.accept(\'' + r.id + '\')">Принять без разногласий</button>');
    else html += savebar('', '<button class="btn btn-secondary" onclick="App.accCancel()">Отмена</button><button class="btn btn-primary" onclick="App.accept(\'' + r.id + '\', true)">Подтвердить приёмку</button>');
  } else if (mode === 'rest') {
    const a = [];
    if (r.status === 'Отправлена') a.push('<button class="btn btn-danger" onclick="App.delReq(\'' + r.id + '\')">Удалить</button>');
    if (['Отправлена','Возвращена'].indexOf(r.status) >= 0) a.push('<button class="btn btn-primary" onclick="App.editReq(\'' + r.id + '\')">' + (r.status === 'Возвращена' ? 'Исправить и отправить' : 'Изменить') + '</button>');
    if (a.length) html += savebar('', a.join(''));
  }
  html += '</div>';
  return html;
}

  const done = (S.data.counts || []).filter(c => c.status === 'Утверждён').sort((a,b) => b.date.localeCompare(a.date)).slice(0, 6);

function countReview(){

/* ---------- Закупка: Таня заранее заказывает у поставщика на склад ---------- */
function packAmount(it, packName){ const p = it && (it.packs || []).find(x => x.name === packName); return p && p.amount ? p.amount : ((it && it.base) || 1); }
// Сколько ресторанам нужно с этого места по ещё не принятым заявкам (в ед. учёта)
function demandFrom(store, itemId){
  const t0 = todayYmd(), it = itemById(itemId);
  let q = 0;
  S.data.lines.forEach(l => {
    if (l.itemId !== itemId || l.from !== store) return;
    const r = S.data.requests.find(x => x.id === l.reqId);
    if (!r || r.place === store || r.shipDate < t0 || ['Отправлена','На проверке','Утверждена','Отгружена'].indexOf(r.status) < 0) return;
    q += (l.approved === null ? (l.requested || 0) : l.approved) * packAmount(it, l.pack);
  });
  return Math.round(q * 1000) / 1000;
}
function purPacks(it, src){ const all = (it.packs || []).filter(p => p.active); const own = all.filter(p => p.supplier === src); return own.concat(all.filter(p => own.indexOf(p) < 0)); }
VIEWS.purchase = function(){
  const P = S.pur;
  const sups = S.data.places.filter(p => p.active && p.type !== 'Ресторан');
  const tos = S.data.places.filter(p => p.active && p.type !== 'Поставщик');
  if (!P.to) P.to = (tos.find(p => p.type === 'Склад') || tos[0] || {}).name || '';
  if (!P.date) P.date = addDaysYmd(todayYmd(), 1);
  let html = '<div class="panel">' + title('Закупка на склад', 'Заказ у поставщика заранее, на все рестораны. Закупка сразу утверждена: попадает в «Сообщения» поставщику на дату прихода, а в остатках видна как ожидаемый приход. Когда товар приедет, примите его в списке ниже.') +
    '<div class="row"><div class="field"><label>Поставщик</label><select onchange="App.purF(\'source\', this.value)"><option value="">Выберите</option>' +
      sups.map(p => '<option' + (p.name === P.source ? ' selected' : '') + '>' + h(p.name) + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>Куда</label><select onchange="App.purF(\'to\', this.value)">' + tos.map(p => '<option' + (p.name === P.to ? ' selected' : '') + '>' + h(p.name) + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>Дата прихода</label><input type="date" value="' + h(P.date) + '" onchange="App.purF(\'date\', this.value)"></div>' +
    '<div class="field"><label>Комментарий</label><input type="text" value="' + h(P.comment) + '" oninput="App.purC(this.value)"></div></div>';
  if (P.source) {
    const mine = i => i.from === P.source || i.source === P.source || (i.packs || []).some(p => p.supplier === P.source);
    let items = S.data.items.filter(i => i.active && (P.all || mine(i)));
    if (!P.all && !items.length) items = S.data.items.filter(i => i.active);
    const cats = uniq(S.data.categories.concat(items.map(i => i.category)));

function addDaysYmd(ymd, k){ const p = ymd.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2] + k, 12)).toISOString().slice(0, 10); }

/* ---------- Остатки (закупки) ---------- */
function stockOf(placeName, itemId){ const q = S.data.stock && S.data.stock.qty[placeName]; return q ? (q[itemId] || 0) : 0; }
function pendingOf(placeName, itemId){ const q = S.data.stock && S.data.stock.pending[placeName]; return q ? (q[itemId] || 0) : 0; }
function bunit(itemId){ const it = itemById(itemId) || {}; return (S.data.stock && S.data.stock.units[itemId]) || it.baseUnit || it.unit || ''; }
// Короткая строка для проверки заявки: «Контейнер 700 шт (+300) · Дана 120»
// Места хранения позиции: склады + её «Откуда», если это своё место (например, пакеты хранит Палаццо).
// Остатки ресторанов-получателей не показываем: там расходники копятся до пересчёта.
function storesOf(i){
  const st = S.data.places.filter(p => p.type === 'Склад' && p.active).map(p => p.name);
  const f = i && place(i.from);
  return uniq((f && f.type !== 'Поставщик' ? [i.from] : []).concat(st));
}
function mainStore(i){ return storesOf(i)[0] || ''; }
function stockHint(itemId, placeNames){
  if (!S.data.stock || !itemId) return '';
  const parts = uniq(placeNames.filter(Boolean)).map(p => {
    const q = stockOf(p, itemId), pd = pendingOf(p, itemId);
    return h(p) + ' ' + fmtN(q) + ' ' + h(bunit(itemId)) + (pd ? ', <span style="color:var(--ok)">ожидается ' + fmtN(pd) + '</span>' : '');
  });
  return parts.length ? '<span class="sub">Остаток: ' + parts.join('; ') + '</span>' : '';
}
function toBase(vals, units){
  const factor = id => { const it = itemById(id), u = it ? countUnits(it).find(x => x.name === units[id]) : null; return u ? u.amount : 1; };
  return Object.keys(vals).filter(id => str(vals[id]) !== '').map(id => ({ itemId: id, qty: Math.round(num(vals[id]) * factor(id) * 1000) / 1000 }));
}
// Пересчитывать можно в любой фасовке: «3 рулона» → 3 × 500 шт в единице учёта
function countUnits(i){
  const u = [{ name: bunit(i.id), amount: 1 }];
  (i.packs || []).forEach(p => { if (p.active !== false && p.amount && p.amount !== 1 && !u.some(x => x.name === p.name)) u.push({ name: p.name, amount: p.amount }); });
  return u;
}
function countUnitSelect(i, units, act){
  units = units || S.stk.units; act = act || 'stkUnit';
  const u = countUnits(i), cur = units[i.id] || u[0].name;
  if (u.length < 2) return '<span class="small muted">' + h(u[0].name) + '</span>';
  return '<select onchange="App.' + act + '(\'' + i.id + '\', this.value)">' + u.map(x => '<option' + (x.name === cur ? ' selected' : '') + ' value="' + h(x.name) + '">' + h(x.name) + (x.amount !== 1 ? ' (' + fmtN(x.amount) + ' ' + h(u[0].name) + ')' : '') + '</option>').join('') + '</select>';
}

/* ---------- Поставки (закупки): единица работы — источник + дата ---------- */
const ACTIVE_ST = ['Отправлена','На проверке','Возвращена'];
function srcLabel(src){ return src || 'без источника'; }
function supKey(src, date){ return (src || '') + '|' + date; }
function supplies(){
  const g = {};
  S.data.requests.filter(r => r.status !== 'Черновик').forEach(r => {
    const k = supKey(r.source, r.shipDate);
    (g[k] = g[k] || { key: k, source: r.source || '', date: r.shipDate, reqs: [] }).reqs.push(r);
  });
  return Object.values(g);
}
function supDeadline(src, date){ const sp = place(src); return sp && sp.deliveries ? sp.deliveries.find(x => x.date === date) : null; }

VIEWS.inbox = function(){
  const I = S.inbox;

  const single = I.sel ? S.data.requests.find(x => x.id === I.sel) : null;

  if (I.status === 'active') list = list.filter(s => s.reqs.some(r => ACTIVE_ST.indexOf(r.status) >= 0));
  else if (I.status === 'done') list = list.filter(s => s.reqs.every(r => ACTIVE_ST.indexOf(r.status) < 0));
  list.sort((a, b) => a.date.localeCompare(b.date) || a.source.localeCompare(b.source));
  if (I.sup && !list.some(s => s.key === I.sup) && !single) I.sup = null;
  let html = '<div class="split wide"><div class="panel">' + title('Поставки', 'Поставка объединяет заявки всех ресторанов от одного источника на одну дату. Проверьте количество и утвердите поставку целиком.') +
    '<div class="subnav fill" style="margin:0 0 14px">' + [['active','В работе'],['done','Готово'],['','Все']]

function startSupply(s){
  const E = { key: s.key, lines: {}, items: {}, versions: {}, comment: '' };
  s.reqs.forEach(r => {
    E.versions[r.id] = r.updatedAt;
    linesOf(r.id).forEach(l => {
      E.lines[l.lineId] = { approved: l.approved !== null ? String(l.approved) : (l.requested !== null ? String(l.requested) : ''), comment: l.comment || '', pack: l.pack || '', from: l.from || '' };
    });
  });
  S.sup = E;
}

      '<td class="num"><b>' + fmtN(totReq) + '</b></td>' +
      '<td>' + (editable.length ? packSelect(it, e0.pack || g.unit, 'App.supItem(\'' + h(k) + '\',\'pack\',this.value)', '') : h(e0.pack || g.unit)) + '</td>' +

    });
  });
  html += '</tbody></table></div>';
  const nEdit = s.reqs.filter(canEdit).length;
  if (nEdit) {
    html += savebar('К утверждению: <b>' + plural(nEdit, 'заявка', 'заявки', 'заявок') + '</b>' + hint('<b>Сохранить без утверждения</b>: изменения запомнятся, заявки останутся у вас на проверке, рестораны уже не смогут их менять.<br><br><b>Утвердить поставку</b>: создаются накладные, если везёт склад, ресторанам уходят уведомления, позиции поставщиков попадают в «Сообщения».'),
      '<button class="btn btn-secondary" onclick="App.supSave(false)">Сохранить без утверждения</button><button class="btn btn-primary" onclick="App.supSave(true)">Утвердить поставку</button>');
  } else {
    const txt = sp && sp.type === 'Поставщик' ? supplierText(s.date, s.source) : '';
    html += '<div class="msg ok">Поставка утверждена.</div>';
    if (txt) html += '<h3 class="sec">Сообщение поставщику</h3><pre class="msgtext" id="drv-text">' + h(txt) + '</pre>' +
      savebar(sp.contact ? h(sp.contact) : '', '<button class="btn btn-primary" onclick="App.copyMsg()">Скопировать сообщение</button>');
  }
  return html + '</div>';
}

// Сколько ресторан обычно берёт позицию: среднее по утверждённым заявкам за 6 недель до этой поставки (нужно ≥ 2).
function usualQty(placeName, itemId, exceptId, shipDate){
  const from = addDays(shipDate, -42);
  const vals = [];
  S.data.requests.forEach(r => {
    if (r.place !== placeName || r.id === exceptId || r.shipDate < from || r.shipDate >= shipDate || ['Утверждена','Отгружена'].indexOf(r.status) < 0) return;
    S.data.lines.forEach(l => { if (l.reqId === r.id && l.itemId === itemId && l.approved) vals.push(l.approved); });
  });
  return vals.length >= 2 ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
}

function startEditor(r){
  const E = { id: r.id, updatedAt: r.updatedAt, purchaseComment: r.purchaseComment, lines: {}, added: [] };
  linesOf(r.id).forEach(l => { E.lines[l.lineId] = { approved: l.approved !== null ? String(l.approved) : (l.requested !== null ? String(l.requested) : ''), from: l.from || '', comment: l.comment || '', pack: l.pack || '' }; });
  S.ed = E;
}
function packSelect(it, val, onchange, dis){
  const packs = it && it.packs ? it.packs.filter(p => p.active || p.name === val) : [];
  if (packs.length < 2) return '<span class="small muted">' + h(val || (it ? it.unit : '') || '—') + '</span>';
  return '<select' + dis + ' onchange="' + onchange + '">' + packs.map(p => '<option' + (p.name === val ? ' selected' : '') + '>' + h(p.name) + '</option>').join('') + '</select>';
}
function srcOptions(exclude, val){
  const ps = S.data.places.filter(p => p.name !== exclude && (p.active || p.name === val));
  const grp = (t, label) => { const l = ps.filter(p => t.indexOf(p.type) >= 0); return l.length ? '<optgroup label="' + label + '">' + l.map(p => '<option' + (p.name === val ? ' selected' : '') + '>' + h(p.name) + '</option>').join('') + '</optgroup>' : ''; };
  return '<option value="">—</option>' + grp(['Склад','Офис','Ресторан'], 'Свои') + grp(['Поставщик'], 'Поставщики');
}

function editor(r){
  if (!S.ed || S.ed.id !== r.id || S.ed.updatedAt !== r.updatedAt) startEditor(r);
  const E = S.ed;
  const editable = ['Отправлена','На проверке','Возвращена'].indexOf(r.status) >= 0;
  const approved = ['Утверждена','Отгружена'].indexOf(r.status) >= 0;
  const sp = place(r.source);
  const d = sp && sp.deliveries ? sp.deliveries.find(x => x.date === r.shipDate) : null;
  let html = '<div class="panel">' + title(h(r.place) + ', поставка ' + h(ruDay(r.shipDate)), 'Количество в «Утвердить» заполнено так, как заказал ресторан. 0 значит, что позицию не везём: напишите ресторану почему. Количество указывается в выбранной упаковке.', chip(r.status));
  html += '<dl class="kv"><dt>Заявка</dt><dd>' + h(r.id) + '</dd><dt>Источник</dt><dd>' + h(srcLabel(r.source)) + (d ? '<span class="muted">, приём ' + (d.closed ? 'закрыт' : 'до ' + h(dlText(d))) + '</span>' : '') + '</dd>' +
    '<dt>Создана</dt><dd>' + h(ruDT(r.createdAt)) + ', ' + h(r.author) + '</dd>' +
    (r.approvedAt ? '<dt>Утверждена</dt><dd>' + h(ruDT(r.approvedAt)) + ', ' + h(r.approvedBy) + '</dd>' : '') + '</dl>';
  if (r.comment) html += '<div class="msg info">Комментарий ресторана: ' + h(r.comment) + '</div>';
  if (r.status === 'Отправлена') html += '<div class="msg info" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><span>Пока заявка не взята в работу, ресторан может её менять.</span>' +
    '<button class="btn btn-primary btn-sm" onclick="App.take()">Взять в работу</button></div>';

  html += '<div class="t-wrap"><table class="t ed-t"><thead><tr><th>Позиция</th><th class="num">Заказано</th><th style="width:130px">Упаковка</th><th class="num" style="width:96px">Утвердить</th><th style="width:150px">Откуда</th><th>Комментарий ресторану</th></tr></thead><tbody>';
  linesOf(r.id).forEach(l => {
    const e = E.lines[l.lineId];
    const it = l.itemId ? itemById(l.itemId) : null;
    const dis = editable ? '' : ' disabled';
    const disQ = editable || approved ? '' : ' disabled';
    const us = l.itemId && l.requested ? usualQty(r.place, l.itemId, r.id, r.shipDate) : null;
    const over = us !== null && l.requested >= us * (S.data.settings.overuse || 1.5) && l.requested - us >= ((it || {}).mult || 1);
    html += '<tr><td>' + h(l.name) + (!l.itemId ? ' <span class="chip st-Возвращена">нет в справочнике</span>' : '') +
      (over ? '<span class="sub" style="color:var(--red)" title="Среднее по утверждённым заявкам этого ресторана за 6 недель">Больше обычного, обычно около ' + fmtN(us) + '</span>' : '') +
      (l.invoice ? '<span class="sub">Накладная ' + h(l.invoice) + '</span>' : '') +
      stockHint(l.itemId, [place(e.from) && place(e.from).type !== 'Поставщик' ? e.from : mainStore(itemById(l.itemId))]) + '</td>' +
      '<td class="num">' + (l.requested === null ? '' : fmtN(l.requested)) + '</td>' +
      '<td>' + (editable ? packSelect(it, e.pack || l.unit, 'App.edPack(\'' + l.lineId + '\', this.value)', '') : h(e.pack || l.unit)) + '</td>' +
      (disQ ? '<td class="num">' + h(e.approved) + '</td>' : '<td><input type="text" inputmode="decimal" style="text-align:right" value="' + h(e.approved) + '" oninput="App.ed(\'' + l.lineId + '\',\'approved\',this.value)"></td>') +
      '<td>' + (editable ? '<select onchange="App.ed(\'' + l.lineId + '\',\'from\',this.value)">' + srcOptions(r.place, e.from) + '</select>' : h(e.from)) + '</td>' +
      (disQ ? '<td class="small">' + h(e.comment) + '</td></tr>' : '<td><input type="text" value="' + h(e.comment) + '" oninput="App.ed(\'' + l.lineId + '\',\'comment\',this.value)"></td></tr>');
  });
  E.added.forEach((a, k) => {
    const it = itemById(a.itemId);
    html += '<tr><td>' + h(it ? it.name : a.itemId) + ' <span class="chip st-Утверждена">новая</span></td><td class="num"></td>' +
      '<td>' + packSelect(it, a.pack || (it ? it.unit : ''), 'App.edAddPack(' + k + ', this.value)', '') + '</td>' +
      '<td><input type="text" inputmode="decimal" style="text-align:right" value="' + h(a.approved) + '" oninput="App.edAdd(' + k + ',\'approved\',this.value)"></td>' +
      '<td><select onchange="App.edAdd(' + k + ',\'from\',this.value)">' + srcOptions(r.place, a.from) + '</select></td>' +
      '<td><button class="btn btn-danger btn-sm" onclick="App.edAddDel(' + k + ')">Убрать</button></td></tr>';
  });
  html += '</tbody></table></div>';

  if (editable) {
    html += '<div class="field" style="margin-top:12px"><label>Добавить позицию</label>' + combo('ed', '') + '</div>';
    html += '<div class="field"><label>Комментарий закупок (виден ресторану)</label><textarea oninput="App.edC(this.value)">' + h(E.purchaseComment) + '</textarea></div>';
    html += savebar(hint('<b>Сохранить без утверждения</b>: изменения запомнятся, заявка останется у вас на проверке, ресторан уже не сможет её менять.<br><br><b>Утвердить</b>: создаются накладные, ресторан получает уведомление, позиции поставщиков попадают в «Сообщения».'),
      '<button class="btn btn-danger" onclick="App.review(\'return\')">Вернуть ресторану</button><button class="btn btn-secondary" onclick="App.review(\'save\')">Сохранить без утверждения</button><button class="btn btn-primary" onclick="App.review(\'approve\')">Утвердить</button>');
  } else if (r.purchaseComment) {
    html += '<div class="msg warn">Комментарий закупок: ' + h(r.purchaseComment) + '</div>';
  }
  if (['Получена','Получена с расхождением'].indexOf(r.status) >= 0) html += '<div class="msg ' + (r.status === 'Получена' ? 'ok' : 'warn') + '">' + h(r.status) + '.' + (r.status === 'Получена' ? '' : ' Что пришло на самом деле, видно в заявке ресторана в колонке «Получено». Остаток склада можно поправить в разделе «Склад».') + '</div>';
  if (approved) {
    const invs = S.data.invoices.filter(i => i.basis === r.id);
    html += savebar(hint('Если чего-то не хватило, поправьте количество и сохраните корректировку: номера накладных останутся прежними, ресторан получит уведомление. Чтобы сменить «Откуда» или упаковку, верните заявку в работу.'),
      (invs.length ? '<button class="btn btn-secondary" onclick="App.print(' + h(JSON.stringify(invs.map(i => i.no))) + ')">Печать накладных</button>' : '') +
      '<button class="btn btn-secondary" onclick="App.reopen()">Вернуть в работу</button>' +
      (place(r.place) && place(r.place).type !== 'Ресторан' ? '<button class="btn btn-secondary" onclick="App.accept(\'' + r.id + '\')">Принять на ' + h(r.place) + '</button>' : '') +
      '<button class="btn btn-primary" onclick="App.adjust()">Сохранить корректировку</button>');
  }
  html += '</div>';
  return html;
}

/* ---------- Свод по позициям на дату ---------- */
function knownDates(){
  const ds = [];
  (S.data.places || []).forEach(p => (p.deliveries || []).forEach(d => ds.push(d.date)));
  S.data.requests.forEach(r => ds.push(r.shipDate));
  S.data.invoices.forEach(i => ds.push(i.date));
  return uniq(ds).sort().reverse();
}
function summaryInfo(){
  const info = {};
  const byD = by(S.data.requests.filter(r => r.status !== 'Черновик'), r => r.shipDate);
  Object.keys(byD).forEach(d => {
    const wait = byD[d].filter(r => ACTIVE_ST.indexOf(r.status) >= 0).length;
    info[d] = [{ text: plural(byD[d].length, 'заявка', 'заявки', 'заявок') }].concat(wait ? [{ text: 'Не утверждено ' + wait, warn: true }] : []);
  });
  return info;
}
VIEWS.summary = function(){
  const info = summaryInfo();
  const date = S.sumDate = pickDate(S.sumDate, info);
  const reqs = S.data.requests.filter(r => r.shipDate === date && r.status !== 'Черновик');
  const rests = uniq(reqs.map(r => r.place)).sort();
  const rows = {};
  reqs.forEach(r => linesOf(r.id).forEach(l => {
    const q = l.approved !== null ? l.approved : (l.requested || 0);
    if (!q) return;
    const key = (l.itemId || '') + '|' + l.name + '|' + (l.pack || l.unit);
    const it = l.itemId ? itemById(l.itemId) : null;
    const row = rows[key] = rows[key] || { name: l.name, unit: l.pack || l.unit, from: l.from || r.source || '—', order: it ? it.order : 1e9, by: {} };
    row.by[r.place] = (row.by[r.place] || 0) + q;
  }));
  const groups = by(Object.values(rows), r => r.from);
  let html = '<div class="panel">' + title('Свод на дату', 'Сколько всего везём на дату, по источникам и ресторанам. Если заявка уже утверждена, берётся утверждённое количество, иначе заказанное.') + dateTiles(date, info, 'App.sumDate');
  if (!date) return html + '</div>';
  if (reqs.length) html += '<p class="lead">' + h(Object.entries(by(reqs, r => r.status)).map(e => e[0] + ': ' + e[1].length).join('. ')) + '.</p>';
  if (!reqs.length) return html + '<div class="empty">На эту дату заявок нет</div></div>';
  Object.keys(groups).sort().forEach(src => {
    const list = groups[src].sort((a,b) => a.order - b.order);
    html += '<h3 class="sec">' + h(src) + '</h3><div class="t-wrap"><table class="t"><thead><tr><th>Позиция</th>' + rests.map(p => '<th class="num">' + h(p) + '</th>').join('') + '<th class="num">Итого</th></tr></thead><tbody>';
    list.forEach(r => {
      let tot = 0;
      html += '<tr><td>' + h(r.name) + '<span class="sub">' + h(r.unit) + '</span></td>' + rests.map(p => { const v = r.by[p] || 0; tot += v; return '<td class="num">' + (v ? fmtN(v) : '') + '</td>'; }).join('') + '<td class="num"><b>' + fmtN(tot) + '</b></td></tr>';
    });
    html += '</tbody></table></div>';
  });
  return html + '</div>';
};

// Плитки дат: только даты, где что-то есть, с кратким содержимым. Ближайшие впереди, прошедшие — в списке.
function dateTiles(sel, info, act){
  const t0 = todayYmd();
  const ds = Object.keys(info).sort();
  const fut = ds.filter(d => d >= addDays(t0, -1)).slice(0, 8);
  const past = ds.filter(d => fut.indexOf(d) < 0).reverse();
  if (!ds.length) return '<div class="empty">Поставок пока нет</div>';
  let html = '<div class="dates">' + fut.map(d => '<button class="dt' + (d === sel ? ' on' : '') + '" onclick="' + act + '(\'' + d + '\')"><b>' + (d === t0 ? 'Сегодня, ' : '') + h(ruDay(d)) + '</b>' +
    info[d].map(x => '<span' + (x.warn ? ' class="warn"' : '') + '>' + h(x.text) + '</span>').join('') + '</button>').join('') + '</div>';
  if (past.length) html += '<div class="row" style="margin:-4px 0 10px"><div class="field" style="max-width:260px;margin:0"><select onchange="' + act + '(this.value)"><option value="">Прошедшие даты</option>' +
    past.map(d => '<option value="' + d + '"' + (d === sel ? ' selected' : '') + '>' + h(ruDay(d)) + ': ' + h(info[d].map(x => x.text).join(', ')) + '</option>').join('') + '</select></div></div>';
  return html;
}
function pickDate(cur, info){
  if (cur && info[cur]) return cur;
  const t0 = todayYmd(), ds = Object.keys(info).sort();
  return ds.find(d => d >= t0) || ds[ds.length - 1] || '';
}

/* ---------- Сообщения: водителю и поставщикам ---------- */
function driverText(date){
  const invs = S.data.invoices.filter(i => i.date === date);
  if (!invs.length) return '';
  const lines = ['Отгрузка ' + ru(date) + ' (' + WD[new Date(date + 'T12:00:00').getDay()] + ')'];
  const byFrom = by(invs, i => i.from);
  Object.keys(byFrom).sort((a,b) => (place(a) && place(a).type === 'Склад' ? -1 : 0) - (place(b) && place(b).type === 'Склад' ? -1 : 0) || a.localeCompare(b)).forEach(from => {
    lines.push('');
    lines.push('Забрать: ' + from.toUpperCase());
    byFrom[from].sort((a,b) => a.to.localeCompare(b.to)).forEach(inv => {
      lines.push(inv.to + ', накладная ' + inv.no);
      movOf(inv.no).forEach(m => lines.push('• ' + m.name + ': ' + fmtN(m.qty) + ' ' + m.unit));
    });
  });
  return lines.join('\n');
}
function supplierLines(date, sup){
  // Утверждённые строки с этим источником на дату, сгруппированные по получателю.
  const out = {};
  S.data.requests.filter(r => r.shipDate === date && ['Утверждена','Отгружена'].indexOf(r.status) >= 0).forEach(r => {
    linesOf(r.id).forEach(l => { if (l.from === sup && l.approved) (out[r.place] = out[r.place] || []).push(l); });
  });
  return out;
}
function supplierText(date, sup){
  const g = supplierLines(date, sup);
  const places = Object.keys(g).sort();
  if (!places.length) return '';
  const org = S.data.settings.org || 'ООО «ДаСпадобы»';
  const lines = ['Заказ ' + org + ' (Salateira) на ' + ru(date)];
  places.forEach(pn => {
    const p = place(pn) || {};
    lines.push('');
    lines.push(pn);
    if (p.address || p.phone) lines.push([p.address, p.phone ? 'тел. ' + p.phone : ''].filter(Boolean).join(', '));
    g[pn].forEach(l => lines.push('• ' + l.name + (l.pack ? ', ' + l.pack : '') + ': ' + fmtN(l.approved) + (l.pack ? '' : ' ' + l.unit)));
  });
  return lines.join('\n');
}
function messagesInfo(){
  const info = {};
  const add = (d, text, warn) => { (info[d] = info[d] || []).push({ text, warn }); };
  const byD = by(S.data.invoices, i => i.date);
  Object.keys(byD).forEach(d => add(d, 'Водителю ' + plural(byD[d].length, 'накладная', 'накладные', 'накладных')));
  (S.data.places || []).filter(p => p.type === 'Поставщик').forEach(sp => {
    const ds = {};
    S.data.requests.forEach(r => {
      if (r.status === 'Черновик') return;
      const has = r.source === sp.name || linesOf(r.id).some(l => l.from === sp.name);
      if (!has) return;
      const k = ds[r.shipDate] = ds[r.shipDate] || { ok: 0, wait: 0 };
      if (['Утверждена','Отгружена'].indexOf(r.status) >= 0) k.ok++; else k.wait++;
    });
    Object.keys(ds).forEach(d => add(d, sp.name + (ds[d].wait ? ', не утверждено ' + ds[d].wait : ''), ds[d].wait > 0));
  });
  return info;
}
VIEWS.messages = function(){
  const info = messagesInfo();
  const date = S.drvDate = pickDate(S.drvDate, info);
  const sups = (S.data.places || []).filter(p => p.type === 'Поставщик').map(p => p.name)
    .filter(sp => S.data.requests.some(r => r.shipDate === date && (r.source === sp || linesOf(r.id).some(l => l.from === sp))));
  const hasDriver = S.data.invoices.some(i => i.date === date) || S.data.requests.some(r => r.shipDate === date && ACTIVE_ST.indexOf(r.status) >= 0 && !(place(r.source) && place(r.source).type === 'Поставщик'));
  const tabsList = (hasDriver ? [['driver', 'Водителю']] : []).concat(sups.map(s => [s, s]));
  if (!tabsList.some(t => t[0] === S.msgTab)) S.msgTab = tabsList.length ? tabsList[0][0] : 'driver';
  let html = '<div class="panel">' + title('Сообщения', 'Готовые тексты для Viber: водителю по накладным и каждому поставщику по утверждённым заявкам. В текст попадает только утверждённое.') + dateTiles(date, info, 'App.drvDate');
  if (!date) return html + '<div class="empty">Сообщений пока нет</div></div>';
  html += '<div class="subnav" style="margin:4px 0 14px">' + tabsList.map(t =>
    '<button class="sub-btn' + (S.msgTab === t[0] ? ' active' : '') + '" onclick="App.msgTab(\'' + h(t[0]) + '\')">' + h(t[1]) + '</button>').join('') + '</div>';
  let txt;
  if (S.msgTab === 'driver') {
    const pend = S.data.requests.filter(r => r.shipDate === date && ACTIVE_ST.indexOf(r.status) >= 0 && !(place(r.source) && place(r.source).type === 'Поставщик'));
    if (pend.length) html += '<div class="msg warn">Ещё не утверждены: ' + h(pend.map(r => r.place + ' из ' + srcLabel(r.source)).join(', ')) + '. Их нет в сообщении.</div>';
    txt = driverText(date);
  } else {
    const pend = S.data.requests.filter(r => r.shipDate === date && r.source === S.msgTab && ACTIVE_ST.indexOf(r.status) >= 0);
    if (pend.length) html += '<div class="msg warn">Ещё не утверждены: ' + h(pend.map(r => r.place).join(', ')) + '. Их нет в сообщении.</div>';
    const sp = place(S.msgTab);
    if (sp && sp.contact) html += '<p class="lead">Контакт поставщика: ' + h(sp.contact) + '</p>';
    const missing = Object.keys(supplierLines(date, S.msgTab)).filter(pn => { const p = place(pn); return !p || !p.address || !p.phone; });
    if (missing.length) html += '<div class="msg warn">Нет адреса или телефона: ' + h(missing.join(', ')) + '. Заполните их в разделе «Справочник», «Места».</div>';
    txt = supplierText(date, S.msgTab);
  }
  if (!txt) return html + '<div class="empty">На эту дату утверждённых позиций нет</div></div>';
  html += '<pre class="msgtext" id="drv-text">' + h(txt) + '</pre>';
  let btns = '';
  if (S.msgTab === 'driver') {
    btns += '<button class="btn btn-secondary" onclick="App.print(' + h(JSON.stringify(S.data.invoices.filter(i => i.date === date).map(i => i.no))) + ')">Печать накладных</button>';
    const ok = S.data.requests.filter(r => r.shipDate === date && r.status === 'Утверждена').length;
